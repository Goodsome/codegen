[project]
name = "codegen"
version = "0.1.13"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "argparse>=1.4.0",
    "black>=25.12.0",
    "case-converter>=1.2.0",
    "dependency-injector>=4.48.3",
    "mcp>=1.26.0",
    "path>=17.1.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.2",
    "typer>=0.20.0",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]

[project.scripts]
codegen = "codegen.entrypoints.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegen"]

[tool.hatch.build.targets.sdist]
include = []

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
reportUnusedCallResult = "none"
