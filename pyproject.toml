[project]
name = "codegen"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "argparse>=1.4.0",
    "black>=25.12.0",
    "dependency-injector>=4.48.3",
    "jinja2>=3.1.6",
    "path>=17.1.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyrefly>=0.46.0",
    "pyyaml>=6.0.2",
    "ruff>=0.14.10",
    "typer>=0.20.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.36.1",
    "black>=25.12.0",
    "pyrefly>=0.46.0",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]

[project.scripts]
codegen = "codegen.cli:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codegen = ["python_gen/templates/**/*"]
