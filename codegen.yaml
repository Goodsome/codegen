    services:
    - name: DependencyResolver
      dependencies:
      - type: string
        container: map
        name: global_registry
      operations:
      - name: build_from_package_spec
        inputs:
        - type: Self
          container: type
          name: cls
        - type: PackageSpec
          name: package_spec
