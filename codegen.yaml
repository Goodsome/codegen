        inputs:
        - type: Self
          name: self
        - type: SnakeString
          name: name
        output:
          type: Self
      - name: get_member
        description: Get an EnumMemberSpec by name. Raises ValueError if not found.
        inputs:
        - type: Self
          name: self
        - type: SnakeString
          name: name
        output:
          type: EnumMemberSpec
    - name: AggregateSpec
      description: Specification of a domain aggregate to be generated.
      base_types:
      - DomainConcept
      attributes:
      - type: Any
        name: __concept_name__
        default: aggregate_root
      - type: Any
        name: __pkg_name__
        default: aggregates
    - name: BootstrapSpec
      description: Specification of the bootstrap configuration.
      attributes:
      - type: ConfigSpec
        optional: true
        name: config
      - type: ContainerSpec
        optional: true
        name: container
      behaviors:
      - name: to_package_spec
        description: "将 BootstrapSpec 转换为 PackageSpec\n\nArgs:\n    contexts: All\
          \ bounded contexts with their configs\n\nReturns:\n    PackageSpec for bootstrap\
          \ package, or None if no bootstrap spec"
        inputs:
        - type: Self
          name: self
        - type: BoundedContext
          container: list
          name: contexts
        output:
          type: PackageSpec
          optional: true
    - name: ConfigSpec
      description: Specification for a configuration object (AppSettings or ContextSettings).
      attributes:
      - type: PascalString
        optional: true
        name: class_name
      - type: string
        name: env_prefix
        default: ''
      - type: string
        optional: true
        name: env_file
      - type: ConfigFieldSpec
        container: list
        name: fields
        default: list
      behaviors:
      - name: to_class_spec
        description: 将 ConfigSpec 转换为 ClassSpec
        inputs:
        - type: Self
          name: self
        - type: string
          optional: true
          name: class_name
        output:
          type: ClassSpec
      - name: _create_model_config_attribute
        description: 创建 model_config 属性
        inputs:
        - type: Self
          name: self
        output:
          type: VariableSpec
      - name: to_module_spec
        description: 将 ConfigSpec 转换为 ModuleSpec
        inputs:
        - type: Self
          name: self
        - type: string
          optional: true
          name: class_name
        output:
          type: ModuleSpec
      - name: to_app_config_module
        description: 创建 AppSettings 模块，包含所有 context 的嵌套配置
        inputs:
        - type: Self
          name: self
        - type: BoundedContext
          container: list
          name: contexts
        output:
          type: ModuleSpec
    ports:
    - name: BlueprintStorage
      description: Loads the blueprint from a file.
      kind: adapter
      operations:
      - name: load
        inputs:
        - type: Self
          name: self
        output:
          type: Blueprint
          optional: true
      - name: save
        inputs:
        - type: Self
          name: self
        - type: Blueprint
          name: blueprint
        output:
          type: None