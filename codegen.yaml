name: codegen
description: ''
layout: ''
contexts:
- name: domain_definition
  domain:
    value_objects:
    - name: Attribute
      description: Standard specification for a class attribute.
      attributes:
      - name: name
        type: str
      - name: type
        type: str
      - name: description
        type: str
        optional: true
      - name: optional
        type: bool
        optional: true
    - name: Blueprint
      description: Root of the generation model. Represents the entire project definition.
      attributes:
      - name: name
        type: str
      - name: description
        type: str
      - name: layout
        type: str
      - name: contexts
        type: list[BoundedContext]
        optional: true
      - name: bootstrap
        type: MetaBootstrap
        optional: true
    - name: BoundedContext
      description: A logical boundary within the system.
      attributes:
      - name: name
        type: str
      - name: description
        type: str
        optional: true
      - name: domain
        type: MetaDomain
        optional: true
      - name: application
        type: MetaApplication
        optional: true
      - name: infrastructure
        type: MetaInfrastructure
        optional: true
    - name: MetaAggregate
      description: Specification of a domain aggregate to be generated.
      attributes:
      - name: name
        type: str
      - name: description
        type: str
        optional: true
      - name: attributes
        type: list[Attribute]
        optional: true
      - name: behaviors
        type: list[MethodSpec]
        optional: true
    - name: MetaApplication
      description: Specification of an application to be generated.
      attributes:
      - name: use_cases
        type: list[MetaUseCase]
        optional: true
      - name: ports
        type: list[MetaPort]
        optional: true
    - name: MetaBootstrap
      description: Specification of the bootstrap configuration.
      attributes:
      - name: bindings
        type: list[PortBinding]
        optional: true
    - name: MetaDomain
      description: Specification of a domain to be generated.
      attributes:
      - name: aggregates
        type: list[MetaAggregate]
        optional: true
      - name: value_objects
        type: list[MetaValueObject]
        optional: true
      - name: services
        type: list[MetaService]
        optional: true
      - name: ports
        type: list[MetaPort]
        optional: true
    - name: MetaImplementation
      description: Specification of an implementation to be generated.
      attributes:
      - name: name
        type: str
      - name: implements
        type: str
      - name: description
        type: str
        optional: true
      - name: attributes
        type: list[Attribute]
        optional: true
    - name: MetaInfrastructure
      description: Specification of an infrastructure to be generated.
      attributes:
      - name: adapters
        type: list[MetaImplementation]
        optional: true
      - name: acl
        type: list[MetaImplementation]
        optional: true
    - name: MetaInfrastructureAdapter
      description: Specification of an infrastructure adapter to be generated.
      attributes:
      - name: name
        type: str
      - name: description
        type: str
        optional: true
      - name: implements
        type: str
      - name: config
        type: dict[str, Any]
        optional: true
    - name: MetaPort
      description: Specification of a domain port to be generated.
      attributes:
      - name: name
        type: str
      - name: description
        type: str
        optional: true
      - name: kind
        type: str
      - name: operations
        type: list[MethodSpec]
        optional: true
    - name: MetaService
      description: Specification of a domain service to be generated.
      attributes:
      - name: name
        type: str
      - name: description
        type: str
        optional: true
      - name: attributes
        type: list[Attribute]
        optional: true
      - name: operations
        type: list[MethodSpec]
        optional: true
    - name: MetaUseCase
      description: Specification of a use case to be generated.
      attributes:
      - name: name
        type: str
      - name: kind
        type: str
      - name: attributes
        type: list[Attribute]
        optional: true
      - name: description
        type: str
        optional: true
      - name: command
        type: MetaUseCaseCommand
        optional: true
      - name: query
        type: MetaUseCaseQuery
        optional: true
      - name: result
        type: MetaUseCaseResult
        optional: true
    - name: MetaUseCaseCommand
      description: Specification of a use case command to be generated.
      attributes:
      - name: name
        type: str
        optional: true
      - name: attributes
        type: list[Attribute]
        optional: true
    - name: MetaUseCaseQuery
      description: Specification of a use case command to be generated.
      attributes:
      - name: name
        type: str
        optional: true
      - name: attributes
        type: list[Attribute]
        optional: true
    - name: MetaUseCaseResult
      description: Specification of a use case result to be generated.
      attributes:
      - name: name
        type: str
        optional: true
      - name: attributes
        type: list[Attribute]
        optional: true
    - name: MetaValueObject
      description: Specification of a value object to be generated.
      attributes:
      - name: name
        type: str
      - name: description
        type: str
        optional: true
      - name: attributes
        type: list[Attribute]
        optional: true
    - name: MethodOutput
      description: Specification of the output of a method.
      attributes:
      - name: type
        type: str
    - name: MethodSpec
      description: Standard specification for a class method.
      attributes:
      - name: name
        type: str
      - name: description
        type: str
        optional: true
      - name: inputs
        type: list[Attribute]
      - name: output
        type: MethodOutput
    - name: PortBinding
      description: Binding between a port and an adapter.
      attributes:
      - name: port
        type: str
      - name: implementation
        type: str
    ports:
    - name: BlueprintStorage
      description: Loads the blueprint from a file.
      kind: Service
      operations:
      - name: load
        inputs: []
        output:
          type: Blueprint | None
      - name: save
        inputs:
        - name: blueprint
          type: Blueprint
        output:
          type: None
  application:
    use_cases:
    - name: LoadBlueprint
      kind: command
      attributes:
      - name: blueprint_loader
        type: BlueprintStorage
      command:
        attributes:
        - name: node
          type: str | None
          optional: true
      result:
        attributes:
        - name: blueprint
          type: Blueprint
- name: orchestration
  domain:
    services:
    - name: AggregateMapper
      attributes:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: aggregate
          type: MetaAggregate
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - name: aggregates
          type: Iterable[MetaAggregate]
        output:
          type: PackageSpec
      - name: to_aggregate
        inputs:
        - name: module
          type: ModuleSpec
        output:
          type: MetaAggregate
      - name: to_aggregates
        inputs:
        - name: package
          type: PackageSpec
        output:
          type: list[MetaAggregate]
    - name: ApplicationMapper
      attributes:
      - name: use_case_mapper
        type: UseCaseMapper
        optional: true
      - name: port_mapper
        type: PortMapper
        optional: true
      operations:
      - name: to_package_spec
        inputs:
        - name: application
          type: MetaApplication
        output:
          type: PackageSpec
      - name: to_application
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: MetaApplication
    - name: AttributeMapper
      operations:
      - name: to_parameter_spec
        inputs:
        - name: attribute
          type: Attribute
        - name: default_field_flavor
          type: FieldFlavor | None
        output:
          type: ParameterSpec
      - name: to_attribute
        inputs:
        - name: parameter_spec
          type: ParameterSpec
        output:
          type: Attribute
      - name: to_parameter_specs
        inputs:
        - name: attributes
          type: list[Attribute]
        - name: default_field_flavor
          type: FieldFlavor | None
        output:
          type: list[ParameterSpec]
      - name: to_attributes
        inputs:
        - name: parameter_specs
          type: list[ParameterSpec]
        output:
          type: list[Attribute]
    - name: BlueprintMapper
      attributes:
      - name: context_mapper
        type: ContextMapper
        optional: true
      operations:
      - name: to_package_spec
        inputs:
        - name: blueprint
          type: Blueprint
        output:
          type: PackageSpec
      - name: to_blueprint
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: Blueprint
    - name: ContextMapper
      attributes:
      - name: domain_mapper
        type: DomainMapper
        optional: true
      - name: application_mapper
        type: ApplicationMapper
        optional: true
      - name: infrastructure_mapper
        type: InfrastructureMapper
        optional: true
      operations:
      - name: to_package_spec
        inputs:
        - name: context
          type: BoundedContext
        output:
          type: PackageSpec
      - name: to_context
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: BoundedContext
      - name: _collect_class_specs_in_ports
        inputs:
        - name: class_specs
          type: dict[str, ClassSpec]
        - name: package_spec
          type: PackageSpec
        output:
          type: None
    - name: DomainMapper
      attributes:
      - name: aggregate_mapper
        type: AggregateMapper
        optional: true
      - name: value_object_mapper
        type: ValueObjectMapper
        optional: true
      - name: service_mapper
        type: ServiceMapper
        optional: true
      - name: port_mapper
        type: PortMapper
        optional: true
      operations:
      - name: to_package_spec
        inputs:
        - name: domain
          type: MetaDomain
        output:
          type: PackageSpec
      - name: to_domain
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: MetaDomain
    - name: ImplementationMapper
      attributes:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: implementation
          type: MetaImplementation
        - name: ports_class_specs
          type: dict[str, ClassSpec]
        output:
          type: ModuleSpec
      - name: to_implementation
        inputs:
        - name: module_spec
          type: ModuleSpec
        output:
          type: MetaImplementation
      - name: remove_abstract_method
        inputs:
        - name: function_spec
          type: FunctionSpec
        output:
          type: FunctionSpec
    - name: InfrastructureMapper
      attributes:
      - name: implementation_mapper
        type: ImplementationMapper
        optional: true
      operations:
      - name: to_package_spec
        inputs:
        - name: infrastructure
          type: MetaInfrastructure
        - name: ports_class_specs
          type: dict[str, ClassSpec]
        output:
          type: PackageSpec
      - name: to_infrastructure
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: MetaInfrastructure
    - name: MethodMapper
      attributes:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      operations:
      - name: to_function_spec
        inputs:
        - name: method
          type: MethodSpec
        - name: function_type
          type: FunctionType
        output:
          type: FunctionSpec
      - name: to_method
        inputs:
        - name: function_spec
          type: FunctionSpec
        output:
          type: MethodSpec
    - name: PortMapper
      attributes:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: port
          type: MetaPort
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - name: ports
          type: Iterable[MetaPort]
        output:
          type: PackageSpec
      - name: to_port
        inputs:
        - name: module_spec
          type: ModuleSpec
        output:
          type: MetaPort
      - name: to_ports
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: list[MetaPort]
    - name: ServiceMapper
      attributes:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: service
          type: MetaService
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - name: services
          type: Iterable[MetaService]
        output:
          type: PackageSpec
      - name: to_service
        inputs:
        - name: module_spec
          type: ModuleSpec
        output:
          type: MetaService
      - name: to_services
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: list[MetaService]
    - name: UseCaseMapper
      attributes:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: use_case
          type: MetaUseCase
        output:
          type: ModuleSpec
      - name: to_use_case
        inputs:
        - name: module_spec
          type: ModuleSpec
        output:
          type: MetaUseCase
    - name: ValueObjectMapper
      attributes:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: value_object
          type: MetaValueObject
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - name: value_objects
          type: Iterable[MetaValueObject]
        output:
          type: PackageSpec
      - name: module_spec_to_value_objects
        inputs:
        - name: module_spec
          type: ModuleSpec
        output:
          type: list[MetaValueObject]
      - name: to_value_objects
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: list[MetaValueObject]
  application:
    use_cases:
    - name: GenerateProject
      kind: command
      attributes:
      - name: loader
        type: LoadBlueprint
      - name: generator
        type: GeneratePackage
      - name: mapper
        type: BlueprintMapper
        optional: true
      command:
        attributes:
        - name: overwrite
          type: bool
        - name: node
          type: str | None
      result:
        attributes:
        - name: result
          type: str
    - name: UpdateBlueprint
      kind: command
      attributes:
      - name: parser
        type: ParsePackage
      - name: storage
        type: BlueprintStorage
      - name: mapper
        type: BlueprintMapper
        optional: true
      command:
        attributes:
        - name: path
          type: Path
      result:
        attributes:
        - name: result
          type: str
- name: python_gen
  domain:
    value_objects:
    - name: ClassSpec
      description: Represents a class in a Python module.
      attributes:
      - name: name
        type: str
      - name: description
        type: str
        optional: true
      - name: decorators
        type: list[str]
        optional: true
      - name: inheritance
        type: list[str]
        optional: true
      - name: attributes
        type: list[ParameterSpec]
        optional: true
      - name: methods
        type: list[FunctionSpec]
        optional: true
    - name: FunctionType
      attributes:
      - name: CLASS_METHOD
        type: Any
      - name: STATIC_METHOD
        type: Any
      - name: INSTANCE_METHOD
        type: Any
      - name: FUNCTION
        type: Any
    - name: FunctionSpec
      description: Represents a function in a Python module.
      attributes:
      - name: name
        type: str
      - name: decorators
        type: list[str]
        optional: true
      - name: parameters
        type: list[ParameterSpec]
        optional: true
      - name: return_annotation
        type: TypeAnnotationSpec
      - name: suite
        type: str
        optional: true
      - name: function_type
        type: FunctionType
        optional: true
    - name: ImportedName
      description: Represents a name imported from another module.
      attributes:
      - name: name
        type: str
      - name: alias
        type: str | None
        optional: true
    - name: ImportFromSpec
      description: Represents an import statement from another module.
      attributes:
      - name: module
        type: str
      - name: names
        type: list[ImportedName]
    - name: ModuleSpec
      description: Represents a Python module.
      attributes:
      - name: name
        type: str
      - name: functions
        type: list[FunctionSpec]
        optional: true
      - name: classes
        type: list[ClassSpec]
        optional: true
      - name: imports
        type: list[ImportFromSpec]
        optional: true
    - name: PackageSpec
      description: Represents a Python package.
      attributes:
      - name: name
        type: str
      - name: modules
        type: list[ModuleSpec]
        optional: true
      - name: sub_packages
        type: list[PackageSpec]
        optional: true
    - name: FieldFlavor
      attributes:
      - name: PYDANTIC
        type: Any
      - name: DATACLASS
        type: Any
    - name: FieldSpec
      attributes:
      - name: default
        type: str
        optional: true
      - name: default_factory
        type: str
        optional: true
      - name: flavor
        type: FieldFlavor
        optional: true
    - name: ParameterSpec
      description: Represents a parameter in a Python function.
      attributes:
      - name: name
        type: str
      - name: annotation
        type: TypeAnnotationSpec
      - name: default
        type: FieldSpec | None
        optional: true
      - name: optional
        type: bool
        optional: true
    - name: TypeAnnotationSpec
      description: Represents a type annotation.
      attributes:
      - name: name
        type: str
      - name: args
        type: list[TypeAnnotationSpec]
        optional: true
    services:
    - name: DependencyResolver
      attributes:
      - name: global_registry
        type: dict[str, str]
      operations:
      - name: build_from_package_spec
        inputs:
        - name: cls
          type: Any
        - name: package_spec
          type: PackageSpec
        output:
          type: DependencyResolver
      - name: resolve_module
        inputs:
        - name: module_spec
          type: ModuleSpec
        output:
          type: Iterable[ImportFromSpec]
    - name: PythonSyntaxTranslator
      description: Bidirectional translator between Python source code and PackageSpec.
      attributes:
      - name: template_port
        type: TemplatePort
      - name: file_system_port
        type: FileSystemPort
      operations:
      - name: to_package_spec
        inputs:
        - name: package_path
          type: Path
        output:
          type: PackageSpec
      - name: to_code
        inputs:
        - name: module_spec
          type: ModuleSpec
        - name: imports
          type: Iterable[ImportFromSpec]
        output:
          type: str
      - name: generate_source_tree
        inputs:
        - name: package_spec
          type: PackageSpec
        - name: target_node
          type: str | None
        output:
          type: dict[Path, str]
      - name: _collect_files_recursively
        inputs:
        - name: current_spec
          type: PackageSpec
        - name: resolver
          type: DependencyResolver
        - name: output_dict
          type: dict[Path, str]
        - name: current_path
          type: Path
        - name: target_node
          type: str | None
        output:
          type: None
  application:
    use_cases:
    - name: GeneratePackage
      kind: command
      attributes:
      - name: file_system_port
        type: FileSystemPort
      - name: translator
        type: PythonSyntaxTranslator
      command:
        attributes:
        - name: package_spec
          type: PackageSpec
        - name: overwrite
          type: bool
        - name: node
          type: str | None
          optional: true
      result:
        attributes:
        - name: result
          type: str
    - name: ParsePackage
      kind: query
      attributes:
      - name: translator
        type: PythonSyntaxTranslator
      query:
        attributes:
        - name: package_path
          type: Path
      result:
        attributes:
        - name: package_spec
          type: PackageSpec
- name: shared
  domain:
    services:
    - name: NamingService
      description: Provides naming conventions for generated artifacts.
      operations:
      - name: to_snake_case
        inputs:
        - name: name
          type: str
        output:
          type: str
    ports:
    - name: FileSystemPort
      description: Port for interacting with the file system.
      kind: Service
      operations:
      - name: read_file
        inputs:
        - name: path
          type: Path
        output:
          type: str
      - name: write_file
        inputs:
        - name: path
          type: Path
        - name: content
          type: str
        - name: overwrite
          type: bool
        output:
          type: None
      - name: list_directory_recursively
        inputs:
        - name: path
          type: Path
        output:
          type: Iterator[Path]
      - name: list_directory_flat
        inputs:
        - name: path
          type: Path
        output:
          type: Iterator[Path]
      - name: is_directory
        inputs:
        - name: path
          type: Path
        output:
          type: bool
      - name: is_file
        inputs:
        - name: path
          type: Path
        output:
          type: bool
      - name: exists
        inputs:
        - name: path
          type: Path
        output:
          type: bool
    - name: TemplatePort
      description: Port for generating templates.
      kind: Service
      operations:
      - name: render
        inputs:
        - name: template_path
          type: str
        - name: context
          type: Dict[str, Any]
        output:
          type: str
