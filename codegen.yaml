# yaml-language-server: $schema=./codegen.schema.json
name: Codegen
description: ''
contexts:
- name: Shared
  domain:
    enums:
    - name: ContainerType
      members:
      - name: NONE
        value: none
      - name: LIST
        value: list
      - name: SET
        value: set
      - name: MAP
        value: map
      - name: ITERABLE
        value: iterable
      - name: CALLABLE
        value: callable
    - name: PrimitiveType
      description: 通用原语类型，不依赖具体语言。
      members:
      - name: STRING
        value: string
      - name: INTEGER
        value: integer
      - name: FLOAT
        value: float
      - name: BOOLEAN
        value: boolean
      - name: DATETIME
        value: datetime
      - name: UUID
        value: uuid
      - name: ANY
        value: any
    value_objects:
    - name: SnakeString
      behaviors:
      - name: __new__
        inputs:
        - name: cls
          type: any
        - name: value
          type: string
        output:
          type: Any
    - name: PascalString
      behaviors:
      - name: __new__
        inputs:
        - name: cls
          type: any
        - name: value
          type: string
        output:
          type: Any
    - name: NamingString
      description: 基于 case-converter 的增强型字符串
      behaviors:
      - name: to_pascal
        output:
          type: str
      - name: to_snake
        output:
          type: str
      - name: to_kebab
        output:
          type: str
      - name: to_camel
        output:
          type: str
      - name: to_macro
        output:
          type: str
      - name: __get_pydantic_core_schema__
        inputs:
        - name: source_type
          type: any
        - name: handler
          type: GetCoreSchemaHandler
        output:
          type: core_schema.CoreSchema
    - name: MacroString
      behaviors:
      - name: __new__
        inputs:
        - name: cls
          type: any
        - name: value
          type: string
        output:
          type: Any
    ports:
    - name: FileSystemPort
      description: Port for interacting with the file system.
      kind: adapter
      operations:
      - name: read_file
        inputs:
        - name: path
          type: Path
        output:
          type: str
      - name: write_file
        inputs:
        - name: path
          type: Path
        - name: content
          type: string
        - name: overwrite
          type: boolean
          default: 'False'
        output:
          type: None
      - name: list_directory_recursively
        inputs:
        - name: path
          type: Path
        output:
          type: Iterator[Path]
      - name: list_directory_flat
        inputs:
        - name: path
          type: Path
        output:
          type: Iterator[Path]
      - name: is_directory
        inputs:
        - name: path
          type: Path
        output:
          type: bool
      - name: is_file
        inputs:
        - name: path
          type: Path
        output:
          type: bool
      - name: exists
        inputs:
        - name: path
          type: Path
        output:
          type: bool
  infrastructure:
    implementations:
    - name: OsFileSystem
      implements: FileSystemPort
      technology: os
      description: OS file system adapter for reading/writing files.
- name: Orchestration
  domain:
    enums:
    - name: BuildStatus
      members:
      - name: SUCCESS
        value: SUCCESS
      - name: FAILURE
        value: FAILURE
      - name: WARNING
        value: WARNING
    - name: FileStatus
      members:
      - name: CREATED
        value: CREATED
      - name: UPDATED
        value: UPDATED
      - name: SKIPPED
        value: SKIPPED
      - name: FAILED
        value: FAILED
    value_objects:
    - name: BuildResult
      description: Top-level result object returned by generation use cases.
      attributes:
      - name: model_config
        type: Any
        default: ConfigDict(frozen=False)
      - name: status
        type: BuildStatus
      - name: files
        type: FileResult
        container: list
        optional: true
      - name: stats
        type: BuildStats
        optional: true
      - name: messages
        type: string
        container: list
        optional: true
      behaviors:
      - name: add_file_result
        inputs:
        - name: result
          type: FileResult
        output:
          type: Any
    - name: FileResult
      description: Represents the outcome for a single file generation.
      attributes:
      - name: path
        type: string
      - name: status
        type: FileStatus
      - name: message
        type: string
        optional: true
      - name: diff
        type: string
        optional: true
    - name: BuildStats
      description: Aggregated statistics for a build operation.
      attributes:
      - name: model_config
        type: Any
        default: ConfigDict(frozen=False)
      - name: total_files
        type: integer
        default: '0'
      - name: created_count
        type: integer
        default: '0'
      - name: updated_count
        type: integer
        default: '0'
      - name: skipped_count
        type: integer
        default: '0'
      - name: failed_count
        type: integer
        default: '0'
      - name: duration_ms
        type: integer
        default: '0'
      behaviors:
      - name: add_result
        inputs:
        - name: result
          type: FileResult
        output:
          type: Any
    services:
    - name: ImplementationMapper
      dependencies:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: implementation
          type: ImplementationSpec
        - name: port
          type: PortSpec
        output:
          type: ModuleSpec
      - name: to_implementation
        inputs:
        - name: module_spec
          type: ModuleSpec
        - name: technology
          type: string
        output:
          type: ImplementationSpec
      - name: _get_class_name
        inputs:
        - name: implementation
          type: ImplementationSpec
        output:
          type: str
    - name: EnumMapper
      operations:
      - name: to_python_enum_spec
        inputs:
        - name: meta_enum
          type: EnumSpec
        output:
          type: PythonEnumSpec
      - name: to_enum_spec
        inputs:
        - name: enum_spec
          type: PythonEnumSpec
        output:
          type: EnumSpec
      - name: to_module_spec
        inputs:
        - name: enums
          type: EnumSpec
          container: iterable
        output:
          type: ModuleSpec
      - name: to_meta_enums
        inputs:
        - name: module_spec
          type: ModuleSpec
        output:
          type: Iterable[EnumSpec]
    - name: ValueObjectMapper
      dependencies:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: value_object
          type: ValueObjectSpec
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - name: value_objects
          type: ValueObjectSpec
          container: iterable
        output:
          type: PackageSpec
      - name: module_spec_to_value_objects
        inputs:
        - name: module_spec
          type: ModuleSpec
        output:
          type: list[ValueObjectSpec]
      - name: to_value_objects
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: list[ValueObjectSpec]
    - name: EntityMapper
      dependencies:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: entity
          type: EntitySpec
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - name: entities
          type: EntitySpec
          container: iterable
        output:
          type: PackageSpec
      - name: to_entity
        inputs:
        - name: module
          type: ModuleSpec
        output:
          type: EntitySpec
      - name: to_entities
        inputs:
        - name: package
          type: PackageSpec
        output:
          type: list[EntitySpec]
    - name: DomainMapper
      dependencies:
      - name: aggregate_mapper
        type: AggregateMapper
        optional: true
      - name: entity_mapper
        type: EntityMapper
        optional: true
      - name: value_object_mapper
        type: ValueObjectMapper
        optional: true
      - name: service_mapper
        type: ServiceMapper
        optional: true
      - name: port_mapper
        type: PortMapper
        optional: true
      - name: enum_mapper
        type: EnumMapper
        optional: true
      operations:
      - name: to_package_spec
        inputs:
        - name: domain
          type: DomainSpec
        output:
          type: PackageSpec
      - name: to_domain
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: DomainSpec
    - name: ContextMapper
      dependencies:
      - name: domain_mapper
        type: DomainMapper
        optional: true
      - name: application_mapper
        type: ApplicationMapper
        optional: true
      - name: infrastructure_mapper
        type: InfrastructureMapper
        optional: true
      operations:
      - name: to_package_spec
        inputs:
        - name: context
          type: BoundedContext
        output:
          type: PackageSpec
      - name: to_context
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: BoundedContext
      - name: _collect_class_specs_in_ports
        inputs:
        - name: class_specs
          type: ClassSpec
          container: map
        - name: package_spec
          type: PackageSpec
        output:
          type: None
    - name: InfrastructureMapper
      dependencies:
      - name: implementation_mapper
        type: ImplementationMapper
        optional: true
      operations:
      - name: to_package_spec
        inputs:
        - name: infrastructure
          type: InfrastructureSpec
        - name: port_finder
          type: PortSpec
          container: callable
        output:
          type: PackageSpec
      - name: to_infrastructure
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: InfrastructureSpec
    - name: AggregateMapper
      dependencies:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: aggregate
          type: AggregateSpec
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - name: aggregates
          type: AggregateSpec
          container: iterable
        output:
          type: PackageSpec
      - name: to_aggregate
        inputs:
        - name: module
          type: ModuleSpec
        output:
          type: AggregateSpec
      - name: to_aggregates
        inputs:
        - name: package
          type: PackageSpec
        output:
          type: list[AggregateSpec]
    - name: BlueprintMapper
      dependencies:
      - name: context_mapper
        type: ContextMapper
        optional: true
      operations:
      - name: to_package_spec
        inputs:
        - name: blueprint
          type: Blueprint
        output:
          type: PackageSpec
      - name: to_blueprint
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: Blueprint
    - name: AttributeMapper
      dependencies:
      - name: type_system_converter
        type: TypeSystemConverter
        optional: true
      operations:
      - name: to_variable_spec
        inputs:
        - name: attribute
          type: AttributeSpec
        - name: default_field_flavor
          type: FieldFlavor
          optional: true
          default: None
        output:
          type: VariableSpec
      - name: to_attribute
        inputs:
        - name: variable_spec
          type: VariableSpec
        output:
          type: AttributeSpec
      - name: to_variable_specs
        inputs:
        - name: attributes
          type: AttributeSpec
          container: list
        - name: default_field_flavor
          type: FieldFlavor
          optional: true
          default: None
        output:
          type: list[VariableSpec]
      - name: to_attributes
        inputs:
        - name: variable_specs
          type: VariableSpec
          container: list
        output:
          type: list[AttributeSpec]
    - name: MethodMapper
      dependencies:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      operations:
      - name: to_function_spec
        inputs:
        - name: method
          type: MethodSpec
        - name: function_type
          type: FunctionType
          default: FunctionType.FUNCTION
        - name: is_abstract
          type: boolean
          default: 'False'
        - name: is_private
          type: boolean
          default: 'False'
        output:
          type: FunctionSpec
      - name: to_method
        inputs:
        - name: function_spec
          type: FunctionSpec
        output:
          type: MethodSpec
    - name: PortMapper
      dependencies:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: port
          type: PortSpec
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - name: ports
          type: PortSpec
          container: iterable
        output:
          type: PackageSpec
      - name: to_port
        inputs:
        - name: module_spec
          type: ModuleSpec
        output:
          type: PortSpec
      - name: to_ports
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: list[PortSpec]
    - name: TypeSystemConverter
      description: 通用类型系统与 Python 类型系统的双向转换器
      operations:
      - name: to_python_annotation
        inputs:
        - name: attribute
          type: AttributeSpec
        output:
          type: TypeAnnotationSpec
      - name: from_python_annotation
        inputs:
        - name: annotation
          type: TypeAnnotationSpec
          optional: true
        output:
          type: tuple[str, ContainerType, bool, str | None]
      - name: _apply_container
        inputs:
        - name: core_type
          type: string
        - name: container
          type: ContainerType
        output:
          type: TypeAnnotationSpec
      - name: _make_optional
        inputs:
        - name: annotation
          type: TypeAnnotationSpec
        output:
          type: TypeAnnotationSpec
      - name: _extract_optional
        inputs:
        - name: annotation
          type: TypeAnnotationSpec
        output:
          type: tuple[bool, TypeAnnotationSpec]
      - name: _extract_container_and_type
        inputs:
        - name: annotation
          type: TypeAnnotationSpec
        output:
          type: tuple[ContainerType, str]
    - name: UseCaseMapper
      dependencies:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: use_case
          type: UseCaseSpec
        output:
          type: ModuleSpec
      - name: to_use_case
        inputs:
        - name: module_spec
          type: ModuleSpec
        output:
          type: UseCaseSpec
    - name: ApplicationMapper
      dependencies:
      - name: use_case_mapper
        type: UseCaseMapper
        optional: true
      - name: port_mapper
        type: PortMapper
        optional: true
      operations:
      - name: to_package_spec
        inputs:
        - name: application
          type: ApplicationSpec
        output:
          type: PackageSpec
      - name: to_application
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: ApplicationSpec
    - name: ServiceMapper
      dependencies:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: service
          type: ServiceSpec
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - name: services
          type: ServiceSpec
          container: iterable
        output:
          type: PackageSpec
      - name: to_service
        inputs:
        - name: module_spec
          type: ModuleSpec
        output:
          type: ServiceSpec
      - name: to_services
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: list[ServiceSpec]
    - name: TestSkeletonMapper
      description: 'Generates parametrized test skeleton ModuleSpecs from domain metadata.
        Produces two files per component: test_*.py (regenerable skeleton) and cases_*.py
        (hand-edited test data, never overwritten).'
      operations:
      - name: to_cases_module_spec
        inputs:
        - name: component_name
          type: string
        - name: methods
          type: MethodSpec
          container: list
        output:
          type: ModuleSpec
      - name: to_service_test_module_spec
        inputs:
        - name: service
          type: ServiceSpec
        - name: context_name
          type: string
        - name: project_name
          type: string
        output:
          type: ModuleSpec
      - name: to_behavior_test_module_spec
        inputs:
        - name: name
          type: string
        - name: behaviors
          type: MethodSpec
          container: list
        - name: context_name
          type: string
        - name: project_name
          type: string
        - name: component_type
          type: string
        output:
          type: ModuleSpec
      - name: to_test_package_spec
        inputs:
        - name: context
          type: BoundedContext
        - name: project_name
          type: string
        output:
          type: PackageSpec
  application:
    use_cases:
    - name: GenerateProject
      kind: command
      dependencies:
      - name: loader
        type: LoadBlueprint
      - name: generator
        type: GeneratePackage
      - name: mapper
        type: BlueprintMapper
        optional: true
      command:
        attributes:
        - name: overwrite
          type: boolean
        - name: node
          type: string
          optional: true
        - name: root_path
          type: string
          default: ''''''
      result:
        attributes:
        - name: result
          type: BuildResult
    - name: GenerateBlueprint
      kind: command
      dependencies:
      - name: parser
        type: ParsePackage
      - name: storage
        type: BlueprintStorage
      - name: mapper
        type: BlueprintMapper
        optional: true
      command:
        attributes:
        - name: path
          type: Path
      result:
        attributes:
        - name: result
          type: string
- name: Entrypoints
- name: PythonGen
  domain:
    enums:
    - name: AssignmentFlavor
      members:
      - name: NONE
        value: none
      - name: LITERAL
        value: literal
      - name: SYMBOL
        value: symbol
      - name: CALL
        value: call
      - name: DICT
        value: dict
      - name: LIST
        value: list
      - name: RAW_CODE
        value: raw_code
      - name: CODE
        value: code
    - name: FunctionType
      members:
      - name: CLASS_METHOD
        value: class_method
      - name: STATIC_METHOD
        value: static_method
      - name: INSTANCE_METHOD
        value: instance_method
      - name: FUNCTION
        value: function
    - name: FieldFlavor
      members:
      - name: PYDANTIC
        value: pydantic
      - name: DATACLASS
        value: dataclass
    value_objects:
    - name: ModuleAssignmentSpec
      description: Represents a top-level assignment in a module.
      attributes:
      - name: name
        type: string
      - name: value
        type: string
      - name: type_annotation
        type: string
        optional: true
        default: None
      behaviors:
      - name: create
        inputs:
        - name: name
          type: string
        - name: value
          type: string
        - name: type_annotation
          type: string
          optional: true
          default: None
        output:
          type: ModuleAssignmentSpec
    - name: RawCodeSpec
      description: Represents a block of raw source code.
      attributes:
      - name: code
        type: string
      behaviors:
      - name: create
        inputs:
        - name: code
          type: string
        output:
          type: RawCodeSpec
    - name: ClassSpec
      description: Represents a class in a Python module.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: string
        default: ''''''
      - name: decorators
        type: string
        container: list
        optional: true
      - name: inheritance
        type: string
        container: list
        optional: true
      - name: attributes
        type: VariableSpec
        container: list
        optional: true
      - name: methods
        type: FunctionSpec
        container: list
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: name
          type: string
        - name: description
          type: string
          default: ''''''
        - name: decorators
          type: string
          container: list
          optional: true
          default: None
        - name: inheritance
          type: string
          container: list
          optional: true
          default: None
        - name: attributes
          type: VariableSpec
          container: list
          optional: true
          default: None
        - name: methods
          type: FunctionSpec
          container: list
          optional: true
          default: None
        output:
          type: ClassSpec
      - name: create_value_object
        output:
          type: ClassSpec
      - name: create_aggregate
        output:
          type: ClassSpec
      - name: create_entity
        output:
          type: ClassSpec
      - name: get_required_types
        output:
          type: set[str]
      - name: merge
        inputs:
        - name: other
          type: ClassSpec
        output:
          type: ClassSpec
    - name: FunctionSpec
      description: Represents a function in a Python module.
      attributes:
      - name: name
        type: SnakeString
      - name: decorators
        type: string
        container: list
        optional: true
      - name: parameters
        type: VariableSpec
        container: list
        optional: true
      - name: return_annotation
        type: TypeAnnotationSpec
      - name: suite
        type: string
        default: ''''''
      - name: function_type
        type: FunctionType
        default: FunctionType.FUNCTION
      - name: is_private
        type: boolean
        default: 'False'
      behaviors:
      - name: create
        inputs:
        - name: name
          type: string
        - name: return_annotation
          type: TypeAnnotationSpec
        - name: decorators
          type: string
          container: list
          optional: true
          default: None
        - name: parameters
          type: VariableSpec
          container: list
          optional: true
          default: None
        - name: suite
          type: string
          default: ''''''
        - name: function_type
          type: FunctionType
          default: FunctionType.FUNCTION
        - name: is_private
          type: boolean
          default: 'False'
        output:
          type: Any
      - name: get_required_types
        output:
          type: set[str]
      - name: is_instance_method
        output:
          type: bool
      - name: merge
        inputs:
        - name: other
          type: FunctionSpec
        output:
          type: FunctionSpec
      - name: is_init_method
        output:
          type: bool
    - name: TypeAnnotationSpec
      description: Represents a type annotation.
      attributes:
      - name: name
        type: string
      - name: args
        type: TypeAnnotationSpec
        container: list
        optional: true
      behaviors:
      - name: render
        output:
          type: str
      - name: get_all_referenced_names
        output:
          type: set[str]
      - name: is_nullable
        output:
          type: bool
    - name: ReferenceSpec
      description: 引用一个已存在的变量或符号 (对应 AST Name节点)。
      attributes:
      - name: name
        type: string
    - name: LiteralSpec
      description: 基础类型的字面量值 (对应 AST Constant节点)。
      attributes:
      - name: value
        type: any
    - name: PythonEnumMemberSpec
      description: Represents an enum member in a Python module.
      attributes:
      - name: name
        type: MacroString
      - name: value
        type: Any
        optional: true
        custom_type_string: str | int | None
      - name: description
        type: string
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: name
          type: string
        - name: value
          type: Any
          default: None
          custom_type_string: str | int | None
        - name: description
          type: string
          default: ''''''
        output:
          type: PythonEnumMemberSpec
    - name: AssignmentSpec
      description: 描述变量的赋值结构 (RHS)。 对应 AST 中的 value 节点。
      attributes:
      - name: flavor
        type: AssignmentFlavor
      - name: literal
        type: LiteralSpec
        optional: true
      - name: reference
        type: ReferenceSpec
        optional: true
      - name: call
        type: CallSpec
        optional: true
      - name: list_items
        type: AssignmentSpec
        container: list
        optional: true
      - name: dict_items
        type: AssignmentSpec
        container: map
        optional: true
      - name: code
        type: string
        optional: true
      behaviors:
      - name: from_code
        inputs:
        - name: code
          type: string
        output:
          type: AssignmentSpec
      - name: from_literal
        inputs:
        - name: value
          type: any
        output:
          type: AssignmentSpec
      - name: from_call
        inputs:
        - name: func_name
          type: string
        - name: args
          type: AssignmentSpec
          container: list
          optional: true
          default: None
        - name: kwargs
          type: AssignmentSpec
          container: map
          optional: true
          default: None
        output:
          type: AssignmentSpec
    - name: CallSpec
      description: 函数调用或类实例化 (对应 AST Call节点)。
      attributes:
      - name: callee
        type: string
      - name: args
        type: AssignmentSpec
        container: list
      - name: kwargs
        type: AssignmentSpec
        container: map
    - name: TypeSpec
      description: 描述变量的类型注解结构 (LHS)。 对应 AST 中的 annotation 节点。
      attributes:
      - name: core_type
        type: string
      - name: container
        type: ContainerType
      - name: nullable
        type: boolean
    - name: ImportedName
      description: Represents a name imported from another module.
      attributes:
      - name: name
        type: string
      - name: alias
        type: string
        optional: true
        default: None
      behaviors:
      - name: render
        output:
          type: str
    - name: ModuleSpec
      description: Represents a Python module.
      attributes:
      - name: name
        type: SnakeString
      - name: functions
        type: FunctionSpec
        container: list
        optional: true
      - name: classes
        type: ClassSpec
        container: list
        optional: true
      - name: imports
        type: ImportFromSpec
        container: list
        optional: true
      - name: enums
        type: PythonEnumSpec
        container: list
        optional: true
      - name: assignments
        type: ModuleAssignmentSpec
        container: list
        optional: true
      - name: extra_code
        type: RawCodeSpec
        container: list
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: name
          type: string
        - name: functions
          type: FunctionSpec
          container: list
          optional: true
          default: None
        - name: classes
          type: ClassSpec
          container: list
          optional: true
          default: None
        - name: imports
          type: ImportFromSpec
          container: list
          optional: true
          default: None
        - name: enums
          type: PythonEnumSpec
          container: list
          optional: true
          default: None
        - name: assignments
          type: ModuleAssignmentSpec
          container: list
          optional: true
          default: None
        - name: extra_code
          type: RawCodeSpec
          container: list
          optional: true
          default: None
        output:
          type: ModuleSpec
      - name: create_shared_models
        output:
          type: ModuleSpec
      - name: get_init_module
        output:
          type: ModuleSpec
      - name: filename
        output:
          type: str
      - name: is_init_module
        output:
          type: bool
      - name: is_match_name
        inputs:
        - name: name
          type: string
        output:
          type: bool
      - name: get_required_types
        output:
          type: set[str]
      - name: has_class
        inputs:
        - name: class_name
          type: string
        output:
          type: bool
      - name: has_function
        inputs:
        - name: function_name
          type: string
        output:
          type: bool
      - name: has_class_or_function
        inputs:
        - name: name
          type: string
        output:
          type: bool
      - name: collect_class_spec
        output:
          type: dict[str, ClassSpec]
      - name: merge
        inputs:
        - name: other
          type: ModuleSpec
        output:
          type: ModuleSpec
    - name: PackageSpec
      description: Represents a Python package.
      attributes:
      - name: name
        type: SnakeString
      - name: modules
        type: ModuleSpec
        container: list
        optional: true
      - name: sub_packages
        type: PackageSpec
        container: list
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: name
          type: string
        - name: modules
          type: ModuleSpec
          container: list
          optional: true
          default: None
        - name: sub_packages
          type: PackageSpec
          container: list
          optional: true
          default: None
        output:
          type: Any
      - name: is_empty
        output:
          type: bool
      - name: get_global_registry
        inputs:
        - name: root_path
          type: string
          default: ''''''
        output:
          type: dict[str, str]
      - name: _build_symbol_table
        inputs:
        - name: root_path
          type: string
        - name: table
          type: string
          container: map
        output:
          type: Any
      - name: collect_class_spec
        output:
          type: dict[str, ClassSpec]
      - name: merge
        inputs:
        - name: other
          type: PackageSpec
        output:
          type: PackageSpec
    - name: ImportFromSpec
      description: Represents an import statement from another module.
      attributes:
      - name: module
        type: string
      - name: names
        type: ImportedName
        container: list
      - name: type_checking
        type: boolean
        default: 'False'
      behaviors:
      - name: create
        inputs:
        - name: module
          type: string
        - name: names
          type: string
          container: list
        - name: type_checking
          type: boolean
          default: 'False'
        output:
          type: ImportFromSpec
      - name: has_name
        inputs:
        - name: name
          type: string
        output:
          type: bool
      - name: add_name
        inputs:
        - name: name
          type: string
        output:
          type: ImportFromSpec
      - name: render
        output:
          type: str
      - name: render_from_expression
        output:
          type: str
      - name: render_names
        output:
          type: str
      - name: merge
        inputs:
        - name: other
          type: ImportFromSpec
        output:
          type: ImportFromSpec
    - name: VariableSpec
      description: '对应 Python 代码中的 name: type_spec = assignment_spec'
      attributes:
      - name: name
        type: SnakeString
      - name: type_spec
        type: TypeAnnotationSpec
        optional: true
      - name: assignment
        type: AssignmentSpec
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: name
          type: string
        - name: type_spec
          type: TypeAnnotationSpec
          optional: true
        - name: assignment
          type: AssignmentSpec
          optional: true
          default: None
        output:
          type: VariableSpec
    - name: PythonEnumSpec
      description: Represents an enum in a Python module.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: string
        optional: true
      - name: decorators
        type: string
        container: list
        optional: true
      - name: base_class
        type: string
        optional: true
      - name: members
        type: PythonEnumMemberSpec
        container: list
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: name
          type: string
        - name: description
          type: string
          default: ''''''
        - name: decorators
          type: string
          container: list
          optional: true
          default: None
        - name: base_class
          type: string
          default: '''Enum'''
        - name: members
          type: PythonEnumMemberSpec
          container: list
          optional: true
          default: None
        output:
          type: PythonEnumSpec
    services:
    - name: DependencyResolver
      dependencies:
      - name: global_registry
        type: string
        container: map
      operations:
      - name: build_from_package_spec
        inputs:
        - name: package_spec
          type: PackageSpec
        - name: root_path
          type: string
          default: ''''''
        output:
          type: DependencyResolver
      - name: resolve_module
        inputs:
        - name: module_spec
          type: ModuleSpec
        output:
          type: Iterable[ImportFromSpec]
    - name: PythonSyntaxTranslator
      description: Bidirectional translator between Python source code and PackageSpec.
      dependencies:
      - name: source_code_port
        type: SourceCodePort
      - name: file_system_port
        type: FileSystemPort
      operations:
      - name: to_package_spec
        inputs:
        - name: package_path
          type: Path
        output:
          type: PackageSpec
      - name: to_code
        inputs:
        - name: module_spec
          type: ModuleSpec
        - name: imports
          type: ImportFromSpec
          container: iterable
        output:
          type: str
      - name: generate_source_tree
        inputs:
        - name: package_spec
          type: PackageSpec
        - name: target_node
          type: string
          optional: true
        - name: root_path
          type: string
          default: ''''''
        output:
          type: dict[Path, str]
      - name: _collect_files_recursively
        inputs:
        - name: current_spec
          type: PackageSpec
        - name: resolver
          type: DependencyResolver
        - name: output_dict
          type: Any
          custom_type_string: dict[Path, str]
        - name: current_path
          type: Path
        - name: target_node
          type: string
          optional: true
        output:
          type: None
    ports:
    - name: SourceCodePort
      description: Port for bidirectional translation between Spec objects and Python
        source code.
      kind: adapter
      operations:
      - name: render_module
        inputs:
        - name: module_spec
          type: ModuleSpec
        - name: imports
          type: ImportFromSpec
          container: list
        output:
          type: str
      - name: parse_module
        inputs:
        - name: source_code
          type: string
        - name: module_name
          type: string
        output:
          type: ModuleSpec
    - name: CodeFormatter
      description: Formats Python source code.
      kind: adapter
      operations:
      - name: format_code
        inputs:
        - name: code
          type: string
        output:
          type: str
  application:
    use_cases:
    - name: ParsePackage
      kind: query
      dependencies:
      - name: translator
        type: PythonSyntaxTranslator
      query:
        attributes:
        - name: package_path
          type: Path
      result:
        attributes:
        - name: package_spec
          type: PackageSpec
    - name: GenerateSchemaJson
      kind: command
      dependencies:
      - name: file_system_port
        type: FileSystemPort
    - name: GeneratePackage
      kind: command
      dependencies:
      - name: file_system_port
        type: FileSystemPort
      - name: translator
        type: PythonSyntaxTranslator
      - name: code_formatter
        type: CodeFormatter
      command:
        attributes:
        - name: package_spec
          type: PackageSpec
        - name: overwrite
          type: boolean
        - name: node
          type: string
          optional: true
        - name: root_path
          type: string
          default: ''''''
      result:
        attributes:
        - name: result
          type: BuildResult
  infrastructure:
    implementations:
    - name: AstTranslator
      implements: SourceCodePort
      technology: ast
      description: AST-based implementation of SourceCodePort.
    - name: BlackCodeFormatter
      implements: CodeFormatter
      technology: black
- name: DomainDefinition
  domain:
    enums:
    - name: PortType
      members:
      - name: ADAPTER
        value: adapter
      - name: REPOSITORY
        value: repository
      - name: CLIENT
        value: client
      - name: PROVIDER
        value: provider
    - name: MappingDirection
      members:
      - name: ONE_WAY
        value: one_way
      - name: TWO_WAY
        value: two_way
    - name: UseCaseKind
      members:
      - name: COMMAND
        value: command
      - name: QUERY
        value: query
    - name: TestMockStrategy
      members:
      - name: TEST
        value: 0
      - name: UNITTEST
        value: unittest
      - name: PYTEST
        value: pytest
    value_objects:
    - name: UseCaseSpec
      description: Specification of a use case to be generated.
      attributes:
      - name: name
        type: PascalString
      - name: kind
        type: UseCaseKind
      - name: dependencies
        type: AttributeSpec
        container: list
        optional: true
      - name: description
        type: string
        optional: true
      - name: command
        type: DataContractSpec
        optional: true
      - name: query
        type: DataContractSpec
        optional: true
      - name: result
        type: DataContractSpec
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: name
          type: string
        - name: kind
          type: Any
          custom_type_string: Union[str, UseCaseKind]
        - name: dependencies
          type: AttributeSpec
          container: list
          optional: true
          default: None
        - name: description
          type: string
          default: ''''''
        - name: command
          type: DataContractSpec
          optional: true
          default: None
        - name: query
          type: DataContractSpec
          optional: true
          default: None
        - name: result
          type: DataContractSpec
          optional: true
          default: None
        output:
          type: Any
    - name: ApplicationSpec
      description: Specification of an application to be generated.
      attributes:
      - name: use_cases
        type: UseCaseSpec
        container: list
        optional: true
      - name: ports
        type: PortSpec
        container: list
        optional: true
      - name: services
        type: ServiceSpec
        container: list
        optional: true
    - name: EnumMemberSpec
      description: Specification of an enum member to be generated.
      attributes:
      - name: name
        type: MacroString
      - name: value
        type: Any
        optional: true
        custom_type_string: str | int | None
      - name: description
        type: string
        optional: true
    - name: ValueObjectSpec
      description: Specification of a value object to be generated.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: string
        optional: true
      - name: attributes
        type: AttributeSpec
        container: list
        optional: true
      - name: behaviors
        type: MethodSpec
        container: list
        optional: true
    - name: DataContractSpec
      description: Generic data contract specification for use case command/query/result.
      attributes:
      - name: name
        type: string
        optional: true
      - name: description
        type: string
        optional: true
      - name: attributes
        type: AttributeSpec
        container: list
        optional: true
    - name: InfrastructureSpec
      description: Specification of an infrastructure to be generated.
      attributes:
      - name: implementations
        type: ImplementationSpec
        container: list
        optional: true
    - name: ContainerSpec
      description: Specification for a container (dependency injection).
      attributes:
      - name: bindings
        type: PortBinding
        container: list
        optional: true
    - name: MethodOutput
      description: Specification of the output of a method.
      attributes:
      - name: type
        type: string
    - name: MapperSpec
      description: Base class for value object mappers.
      attributes:
      - name: source
        type: string
      - name: target
        type: string
      - name: direction
        type: MappingDirection
    - name: PortBinding
      description: Binding between a port and an adapter.
      attributes:
      - name: port
        type: string
      - name: implementation
        type: string
    - name: ConfigFieldSpec
      description: Specification for a single configuration field.
      attributes:
      - name: name
        type: SnakeString
      - name: type
        type: string
      - name: default
        type: string
        optional: true
      - name: description
        type: string
        default: ''''''
      - name: env_var
        type: string
        optional: true
    - name: ImplementationSpec
      description: Specification of an implementation to be generated.
      attributes:
      - name: name
        type: PascalString
        optional: true
      - name: implements
        type: PascalString
      - name: technology
        type: SnakeString
      - name: description
        type: string
        optional: true
      - name: attributes
        type: AttributeSpec
        container: list
        optional: true
      - name: private_methods
        type: MethodSpec
        container: list
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: name
          type: string
        - name: implements
          type: string
        - name: technology
          type: string
        - name: description
          type: string
          default: ''''''
        - name: attributes
          type: AttributeSpec
          container: list
          optional: true
          default: None
        - name: private_methods
          type: MethodSpec
          container: list
          optional: true
          default: None
        output:
          type: Any
    - name: Blueprint
      description: Root of the generation model. Represents the entire project definition.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: string
      - name: layout
        type: string
        optional: true
      - name: contexts
        type: BoundedContext
        container: list
        optional: true
      - name: bootstrap
        type: BootstrapSpec
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: name
          type: Any
          custom_type_string: Union[str, PascalString]
        - name: description
          type: string
        - name: layout
          type: string
          default: ''''''
        - name: contexts
          type: BoundedContext
          container: list
          optional: true
          default: None
        - name: bootstrap
          type: BootstrapSpec
          optional: true
          default: None
        output:
          type: Any
    - name: MethodSpec
      description: Standard specification for a class method.
      attributes:
      - name: name
        type: SnakeString
      - name: description
        type: string
        optional: true
      - name: inputs
        type: AttributeSpec
        container: list
        optional: true
      - name: output
        type: MethodOutput
      behaviors:
      - name: create
        inputs:
        - name: name
          type: string
        - name: inputs
          type: AttributeSpec
          container: list
        - name: output
          type: MethodOutput
        output:
          type: Any
    - name: DomainSpec
      description: Specification of a domain to be generated.
      attributes:
      - name: aggregates
        type: AggregateSpec
        container: list
        optional: true
      - name: enums
        type: EnumSpec
        container: list
        optional: true
      - name: value_objects
        type: ValueObjectSpec
        container: list
        optional: true
      - name: entities
        type: EntitySpec
        container: list
        optional: true
      - name: services
        type: ServiceSpec
        container: list
        optional: true
      - name: ports
        type: PortSpec
        container: list
        optional: true
    - name: BoundedContext
      description: A logical boundary within the system.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: string
        optional: true
      - name: domain
        type: DomainSpec
        optional: true
      - name: application
        type: ApplicationSpec
        optional: true
      - name: infrastructure
        type: InfrastructureSpec
        optional: true
      - name: config
        type: ConfigSpec
        optional: true
      - name: container
        type: ContainerSpec
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: name
          type: string
        - name: description
          type: string
          default: ''''''
        - name: domain
          type: DomainSpec
          optional: true
          default: None
        - name: application
          type: ApplicationSpec
          optional: true
          default: None
        - name: infrastructure
          type: InfrastructureSpec
          optional: true
          default: None
        - name: config
          type: ConfigSpec
          optional: true
          default: None
        - name: container
          type: ContainerSpec
          optional: true
          default: None
        output:
          type: Any
      - name: port_index
        output:
          type: dict[str, PortSpec]
      - name: get_port_spec
        inputs:
        - name: port_name
          type: string
        output:
          type: PortSpec
    - name: ServiceSpec
      description: Specification of a domain service to be generated.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: string
        optional: true
      - name: dependencies
        type: AttributeSpec
        container: list
        optional: true
      - name: operations
        type: MethodSpec
        container: list
        optional: true
    - name: EntitySpec
      description: Specification of an entity.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: string
        optional: true
      - name: attributes
        type: AttributeSpec
        container: list
        optional: true
      - name: behaviors
        type: MethodSpec
        container: list
        optional: true
    - name: AttributeSpec
      description: Standard specification for a class attribute.
      attributes:
      - name: name
        type: SnakeString
      - name: description
        type: string
        optional: true
      - name: type
        type: string
      - name: container
        type: ContainerType
        default: ContainerType.NONE
      - name: optional
        type: boolean
        optional: true
      - name: default
        type: string
        optional: true
      - name: custom_type_string
        type: string
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: name
          type: string
        - name: type
          type: string
        - name: optional
          type: boolean
          default: 'False'
        output:
          type: Any
    - name: PortSpec
      description: Specification of a domain port to be generated.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: string
        optional: true
      - name: kind
        type: PortType
      - name: aggregate
        type: PascalString
        optional: true
        default: None
      - name: operations
        type: MethodSpec
        container: list
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: name
          type: string
        - name: kind
          type: Any
          custom_type_string: Union[PortType, str]
        - name: description
          type: string
          default: ''''''
        - name: aggregate
          type: string
          optional: true
          default: None
        - name: operations
          type: MethodSpec
          container: list
          optional: true
          default: None
        output:
          type: PortSpec
      - name: get_final_operations
        output:
          type: list[MethodSpec]
      - name: get_save_method_spec
        output:
          type: MethodSpec | None
      - name: get_delete_method_spec
        output:
          type: MethodSpec | None
      - name: get_find_by_id_method_spec
        output:
          type: MethodSpec | None
    - name: EnumSpec
      description: Specification of an enum to be generated.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: string
        optional: true
      - name: members
        type: EnumMemberSpec
        container: list
    - name: AggregateSpec
      description: Specification of a domain aggregate to be generated.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: string
        optional: true
      - name: attributes
        type: AttributeSpec
        container: list
        optional: true
      - name: behaviors
        type: MethodSpec
        container: list
        optional: true
    - name: BootstrapSpec
      description: Specification of the bootstrap configuration.
      attributes:
      - name: config
        type: ConfigSpec
        optional: true
      - name: container
        type: ContainerSpec
        optional: true
    - name: ConfigSpec
      description: Specification for a configuration object (AppSettings or ContextSettings).
      attributes:
      - name: class_name
        type: PascalString
        optional: true
      - name: env_prefix
        type: string
        default: ''''''
      - name: env_file
        type: string
        optional: true
      - name: fields
        type: ConfigFieldSpec
        container: list
        optional: true
    services:
    - name: BlueprintPathResolver
      description: "Parses path expressions and resolves them against Blueprint/Pydantic\
        \ models.\n\nPath syntax:\n- Dot notation: \"contexts.sales\" \n- Index notation:\
        \ \"contexts[0]\"\n- Mixed: \"contexts[0].aggregates.Order\"\n- Field access\
        \ by name in list: \"contexts.DomainDefinition\" (finds by 'name' field)"
      dependencies:
      - name: _SEGMENT_PATTERN
        type: Any
        default: re.compile('([a-zA-Z_][a-zA-Z0-9_]*)?(?:\\[(\\d+)\\])?')
      operations:
      - name: parse
        inputs:
        - name: path
          type: string
        output:
          type: list[PathSegment]
      - name: resolve
        inputs:
        - name: obj
          type: any
        - name: path
          type: string
        output:
          type: Any
      - name: _resolve_segments
        inputs:
        - name: obj
          type: any
        - name: segments
          type: PathSegment
          container: list
        output:
          type: Any
      - name: _get_segment_value
        inputs:
        - name: obj
          type: any
        - name: segment
          type: PathSegment
        output:
          type: Any
      - name: _access_by_name
        inputs:
        - name: obj
          type: any
        - name: name
          type: string
        output:
          type: Any
      - name: _get_item_name
        inputs:
        - name: item
          type: any
        output:
          type: str | None
    - name: ComponentLocator
      description: Responsible for finding any component within a BoundedContext.
      dependencies:
      - name: _FIND_HANDLERS
        type: Any
        default: '{''aggregate'': lambda ctx, name: next((x for x in ctx.domain.aggregates
          if str(x.name) == name), None), ''entity'': lambda ctx, name: next((x for
          x in ctx.domain.entities if str(x.name) == name), None), ''value_object'':
          lambda ctx, name: next((x for x in ctx.domain.value_objects if str(x.name)
          == name), None), ''valueobject'': lambda ctx, name: next((x for x in ctx.domain.value_objects
          if str(x.name) == name), None), ''service'': lambda ctx, name: next((x for
          x in ctx.domain.services if str(x.name) == name), None), ''enum'': lambda
          ctx, name: next((x for x in ctx.domain.enums if str(x.name) == name), None),
          ''use_case'': lambda ctx, name: next((x for x in ctx.application.use_cases
          if str(x.name) == name), None), ''usecase'': lambda ctx, name: next((x for
          x in ctx.application.use_cases if str(x.name) == name), None), ''implementation'':
          lambda ctx, name: next((x for x in ctx.infrastructure.implementations if
          str(x.name) == name), None)}'
      operations:
      - name: _find_port_strategy
        inputs:
        - name: context
          type: BoundedContext
        - name: name
          type: string
        output:
          type: Any
      - name: find_parent_component
        inputs:
        - name: context
          type: BoundedContext
        - name: name
          type: string
        - name: type_hint
          type: string
        output:
          type: Any
    - name: BlueprintPathOperations
      description: 'Provides get/set/remove operations on Blueprint using path expressions.


        Uses Pydantic''s model_copy for immutable updates.'
      dependencies:
      - name: resolver
        type: BlueprintPathResolver
      operations:
      - name: get_value
        inputs:
        - name: obj
          type: any
        - name: path
          type: string
        output:
          type: Any
      - name: set_value
        inputs:
        - name: obj
          type: any
        - name: path
          type: string
        - name: value
          type: any
        - name: append
          type: boolean
          default: 'False'
        output:
          type: Any
      - name: remove_value
        inputs:
        - name: obj
          type: any
        - name: path
          type: string
        output:
          type: Any
      - name: _set_recursive
        inputs:
        - name: obj
          type: any
        - name: segments
          type: PathSegment
          container: list
        - name: value
          type: any
        - name: append
          type: boolean
        output:
          type: Any
      - name: _remove_recursive
        inputs:
        - name: obj
          type: any
        - name: segments
          type: PathSegment
          container: list
        output:
          type: Any
      - name: _get_segment_value
        inputs:
        - name: obj
          type: any
        - name: segment
          type: PathSegment
        output:
          type: Any
      - name: _access_by_name
        inputs:
        - name: obj
          type: any
        - name: name
          type: string
        output:
          type: Any
      - name: _get_item_name
        inputs:
        - name: item
          type: any
        output:
          type: str | None
      - name: _find_item_index
        inputs:
        - name: items
          type: list
        - name: name
          type: string
        output:
          type: int
      - name: _set_final_value
        inputs:
        - name: obj
          type: any
        - name: segment
          type: PathSegment
        - name: value
          type: any
        - name: append
          type: boolean
        output:
          type: Any
      - name: _remove_final_value
        inputs:
        - name: obj
          type: any
        - name: segment
          type: PathSegment
        output:
          type: Any
      - name: _update_segment
        inputs:
        - name: obj
          type: any
        - name: segment
          type: PathSegment
        - name: new_value
          type: any
        output:
          type: Any
      - name: _update_field
        inputs:
        - name: obj
          type: any
        - name: field_name
          type: string
        - name: new_value
          type: any
        output:
          type: Any
      - name: parse_value
        inputs:
        - name: value_str
          type: string
        output:
          type: Any
    - name: PathSegment
      description: Represents a single segment in a path expression.
      dependencies:
      - name: name
        type: string
      - name: index
        type: integer
        optional: true
        default: None
      operations:
      - name: is_index_access
        output:
          type: bool
    ports:
    - name: BlueprintStorage
      description: Loads the blueprint from a file.
      kind: adapter
      operations:
      - name: load
        output:
          type: Blueprint | None
      - name: save
        inputs:
        - name: blueprint
          type: Blueprint
        output:
          type: None
  application:
    use_cases:
    - name: SetValue
      kind: command
      dependencies:
      - name: storage
        type: BlueprintStorage
      - name: operations
        type: BlueprintPathOperations
      command:
        attributes:
        - name: path
          type: string
        - name: value
          type: any
        - name: append
          type: boolean
          default: 'False'
    - name: RemoveValue
      kind: command
      dependencies:
      - name: storage
        type: BlueprintStorage
      - name: operations
        type: BlueprintPathOperations
      command:
        attributes:
        - name: path
          type: string
    - name: GetValue
      kind: command
      dependencies:
      - name: storage
        type: BlueprintStorage
      - name: operations
        type: BlueprintPathOperations
      command:
        attributes:
        - name: path
          type: string
    - name: LoadBlueprint
      kind: command
      dependencies:
      - name: blueprint_loader
        type: BlueprintStorage
      command:
        attributes:
        - name: node
          type: string
          optional: true
          default: None
      result:
        attributes:
        - name: blueprint
          type: Blueprint
  infrastructure:
    implementations:
    - name: YamlBlueprintStorage
      implements: BlueprintStorage
      technology: yaml
      description: Blueprint loader that reads from a YAML file.
