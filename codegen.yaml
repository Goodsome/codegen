# yaml-language-server: $schema=./codegen.schema.json
name: Codegen
contexts:
- name: Shared
  domain:
    core:
    - name: ValueObject
      description: 值对象基类 特征： 1. 不可变（frozen=True） 2. 相等性基于所有属性值 3. 无唯一标识
      base_types:
      - BaseModel
      attributes:
      - type: Any
        name: model_config
    - name: AggregateRoot
      description: 聚合根基类 特征： 1. 继承 Entity 的所有特性 2. 管理领域事件的发布和收集 3. 确保聚合边界内的一致性
      base_types:
      - BaseModel
      attributes:
      - type: Any
        name: model_config
      - type: DomainEvent
        container: list
        name: _domain_events
      behaviors:
      - name: add_domain_event
        description: "添加领域事件\nArgs:\n    event: 要添加的领域事件实例\nRaises:\n    TypeError:\
          \ 如果 event 不是 DomainEvent 的实例"
        inputs:
        - type: Self
          name: self
        - type: DomainEvent
          name: event
        output:
          type: None
      - name: collect_events
        description: "收集并清空领域事件\nReturns:\n    收集到的所有领域事件列表（副本）"
        inputs:
        - type: Self
          name: self
        output:
          type: DomainEvent
          container: list
      - name: clear_events
        description: 清空领域事件
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: has_events
        description: "检查是否有未处理的领域事件\n\nReturns:\n    如果有事件返回 True，否则返回 False"
        inputs:
        - type: Self
          name: self
        output:
          type: boolean
    - name: Entity
      description: 实体基类 特征： 1. 具有唯一标识（ID） 2. 相等性基于 ID 判断 3. 可变（但应通过行为方法修改） 4. 使用 UTC
        时区记录时间
      base_types:
      - BaseModel
      attributes:
      - type: Any
        name: model_config
    - name: DomainEvent
      description: 领域事件基类 所有领域事件必须： 1. 不可变（frozen=True） 2. 包含唯一标识和时间戳 3. 使用 UTC 时区
        4. 携带事件类型标识
      base_types:
      - BaseModel
      attributes:
      - type: uuid
        name: event_id
        default: uuid4
      - type: datetime
        name: occurred_at
        default: 'lambda: datetime.now(timezone.utc)'
      - type: string
        name: event_type
        default: ''
      - type: integer
        name: version
        default: 1
      - type: Any
        name: model_config
      behaviors:
      - name: __init__
        inputs:
        - type: Self
          name: self
        output:
          type: any
    enums:
    - name: ContainerType
      members:
      - name: NONE
        value: none
      - name: LIST
        value: list
      - name: SET
        value: set
      - name: MAP
        value: map
      - name: ITERABLE
        value: iterable
      - name: CALLABLE
        value: callable
      - name: TYPE
        value: type
      - name: CLASS_VAR
        value: class_var
    - name: PrimitiveType
      description: 通用原语类型，不依赖具体语言。
      members:
      - name: STRING
        value: string
      - name: INTEGER
        value: integer
      - name: FLOAT
        value: float
      - name: BOOLEAN
        value: boolean
      - name: DATETIME
        value: datetime
      - name: UUID
        value: uuid
      - name: ANY
        value: any
    value_objects:
    - name: SnakeString
      description: ''
      base_types:
      - NamingString
      behaviors:
      - name: __new__
        inputs:
        - type: any
          name: cls
        - type: string
          name: value
        output:
          type: any
    - name: PascalString
      description: ''
      base_types:
      - NamingString
      behaviors:
      - name: __new__
        inputs:
        - type: any
          name: cls
        - type: string
          name: value
        output:
          type: any
    - name: KebabString
      description: ''
      base_types:
      - NamingString
      behaviors:
      - name: __new__
        inputs:
        - type: any
          name: cls
        - type: string
          name: value
        output:
          type: any
    - name: NamingString
      description: 基于 case-converter 的增强型字符串
      base_types:
      - str
      behaviors:
      - name: to_pascal
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: to_snake
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: to_kebab
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: to_camel
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: to_macro
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: __get_pydantic_core_schema__
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: source_type
        - type: GetCoreSchemaHandler
          name: handler
        output:
          type: CoreSchema
    - name: MacroString
      description: ''
      base_types:
      - NamingString
      behaviors:
      - name: __new__
        inputs:
        - type: any
          name: cls
        - type: string
          name: value
        output:
          type: any
    ports:
    - name: FileSystemPort
      description: Port for interacting with the file system.
      kind: adapter
      operations:
      - name: read_file
        inputs:
        - type: Self
          name: self
        - type: Path
          name: path
        output:
          type: string
      - name: write_file
        description: 'Writes content to file.

          Returns True if written, False if skipped (due to overwrite=False).'
        inputs:
        - type: Self
          name: self
        - type: Path
          name: path
        - type: string
          name: content
        - type: boolean
          name: overwrite
          default: false
        output:
          type: boolean
      - name: list_directory_recursively
        inputs:
        - type: Self
          name: self
        - type: Path
          name: path
        output:
          type: Path
          container: iterable
      - name: list_directory_flat
        inputs:
        - type: Self
          name: self
        - type: Path
          name: path
        output:
          type: Path
          container: iterable
      - name: is_directory
        inputs:
        - type: Self
          name: self
        - type: Path
          name: path
        output:
          type: boolean
      - name: is_file
        inputs:
        - type: Self
          name: self
        - type: Path
          name: path
        output:
          type: boolean
      - name: exists
        inputs:
        - type: Self
          name: self
        - type: Path
          name: path
        output:
          type: boolean
  infrastructure:
    implementations:
    - name: OsFileSystem
      implements: FileSystemPort
      technology: os
      description: OS file system adapter for reading/writing files.
      attributes:
      - type: Path
        name: root
      - type: string
        name: encoding
        default: utf-8
- name: Orchestration
  domain:
    enums:
    - name: BuildStatus
      members:
      - name: SUCCESS
        value: SUCCESS
      - name: FAILURE
        value: FAILURE
      - name: WARNING
        value: WARNING
    - name: FileStatus
      members:
      - name: CREATED
        value: CREATED
      - name: UPDATED
        value: UPDATED
      - name: SKIPPED
        value: SKIPPED
      - name: FAILED
        value: FAILED
    value_objects:
    - name: BuildResult
      description: Top-level result object returned by generation use cases.
      attributes:
      - type: Any
        name: model_config
      - type: BuildStatus
        name: status
      - type: FileResult
        container: list
        name: files
        default: list
      - type: BuildStats
        name: stats
        default: BuildStats
      - type: string
        container: list
        name: messages
        default: list
      behaviors:
      - name: add_file_result
        inputs:
        - type: Self
          name: self
        - type: FileResult
          name: result
        output:
          type: any
    - name: FileResult
      description: Represents the outcome for a single file generation.
      attributes:
      - type: string
        name: path
      - type: FileStatus
        name: status
      - type: string
        name: message
        default: str
      - type: string
        name: diff
        default: str
    - name: BuildStats
      description: Aggregated statistics for a build operation.
      attributes:
      - type: Any
        name: model_config
      - type: integer
        name: total_files
        default: 0
      - type: integer
        name: created_count
        default: 0
      - type: integer
        name: updated_count
        default: 0
      - type: integer
        name: skipped_count
        default: 0
      - type: integer
        name: failed_count
        default: 0
      - type: integer
        name: duration_ms
        default: 0
      behaviors:
      - name: add_result
        inputs:
        - type: Self
          name: self
        - type: FileResult
          name: result
        output:
          type: any
  application:
    use_cases:
    - name: GenerateProject
      kind: command
      inputs:
      - type: string
        container: list
        optional: true
        name: nodes
      - type: boolean
        name: generate_tests
        default: false
      outputs:
      - type: BuildResult
        name: result
      - type: BuildResult
        name: tests_result
      dependencies:
      - type: LoadBlueprint
        name: loader
      - type: GeneratePackage
        name: generator
    - name: GenerateBlueprint
      kind: command
      inputs:
      - type: Path
        name: path
      outputs:
      - type: string
        name: result
      dependencies:
      - type: ParsePackage
        name: parser
      - type: BlueprintStorage
        name: storage
  interfaces:
    cli_commands:
    - name: build
      use_case: GenerateProject
    - name: reverse
      use_case: GenerateBlueprint
- name: PythonGen
  domain:
    enums:
    - name: AssignmentFlavor
      members:
      - name: NONE
        value: none
      - name: LITERAL
        value: literal
      - name: SYMBOL
        value: symbol
      - name: CALL
        value: call
      - name: DICT
        value: dict
      - name: LIST
        value: list
      - name: RAW_CODE
        value: raw_code
      - name: CODE
        value: code
      - name: SUBSCRIPT
        value: subscript
    - name: FunctionType
      members:
      - name: CLASS_METHOD
        value: class_method
      - name: STATIC_METHOD
        value: static_method
      - name: INSTANCE_METHOD
        value: instance_method
      - name: FUNCTION
        value: function
    - name: FieldFlavor
      members:
      - name: PYDANTIC
        value: pydantic
      - name: DATACLASS
        value: dataclass
    value_objects:
    - name: ModuleAssignmentSpec
      description: Represents a top-level assignment in a module.
      attributes:
      - type: string
        name: name
      - type: string
        name: value
      - type: string
        optional: true
        name: type_annotation
      - type: string
        container: list
        name: require_types
        default: list
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        - type: string
          name: value
        - type: string
          optional: true
          name: type_annotation
        output:
          type: ModuleAssignmentSpec
      - name: get_required_types
        inputs:
        - type: Self
          name: self
        output:
          type: string
          container: set
    - name: RawCodeSpec
      description: Represents a block of raw source code.
      attributes:
      - type: string
        name: code
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: code
        output:
          type: RawCodeSpec
    - name: ClassSpec
      description: Represents a class in a Python module.
      attributes:
      - type: PascalString
        name: name
      - type: string
        name: description
        default: ''
      - type: string
        container: list
        name: decorators
        default: list
      - type: string
        container: list
        name: inheritance
        default: list
      - type: VariableSpec
        container: list
        name: attributes
        default: list
      - type: FunctionSpec
        container: list
        name: methods
        default: list
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        - type: string
          name: description
          default: ''
        - type: string
          container: list
          optional: true
          name: decorators
        - type: string
          container: list
          optional: true
          name: inheritance
        - type: VariableSpec
          container: list
          optional: true
          name: attributes
        - type: FunctionSpec
          container: list
          optional: true
          name: methods
        output:
          type: ClassSpec
      - name: get_required_types
        inputs:
        - type: Self
          name: self
        output:
          type: string
          container: set
      - name: get_method
        description: 获取指定名称的方法，不存在则 raise error
        inputs:
        - type: Self
          name: self
        - type: string
          name: method_name
        output:
          type: FunctionSpec
      - name: merge
        inputs:
        - type: Self
          name: self
        - type: ClassSpec
          name: other
        output:
          type: ClassSpec
    - name: FunctionSpec
      description: Represents a function in a Python module.
      attributes:
      - type: SnakeString
        name: name
      - type: string
        container: list
        name: decorators
        default: list
      - type: VariableSpec
        container: list
        name: parameters
        default: list
      - type: TypeAnnotationSpec
        name: return_annotation
      - type: string
        name: suite
        default: ''
      - type: FunctionType
        name: function_type
        default: FunctionType.FUNCTION
      - type: string
        optional: true
        name: description
      behaviors:
      - name: validate_parameter_order
        inputs:
        - type: Self
          name: self
        output:
          type: Self
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        - type: TypeAnnotationSpec
          name: return_annotation
        - type: string
          container: list
          optional: true
          name: decorators
        - type: VariableSpec
          container: list
          optional: true
          name: parameters
        - type: string
          name: suite
          default: ''
        - type: FunctionType
          name: function_type
          default: FunctionType.FUNCTION
        - type: string
          optional: true
          name: description
        output:
          type: any
      - name: get_required_types
        inputs:
        - type: Self
          name: self
        output:
          type: string
          container: set
      - name: is_instance_method
        inputs:
        - type: Self
          name: self
        output:
          type: boolean
      - name: merge
        inputs:
        - type: Self
          name: self
        - type: FunctionSpec
          name: other
        output:
          type: FunctionSpec
      - name: is_init_method
        inputs:
        - type: Self
          name: self
        output:
          type: boolean
    - name: TypeAnnotationSpec
      description: Represents a type annotation.
      attributes:
      - type: string
        name: name
      - type: TypeAnnotationSpec | AssignmentSpec
        container: list
        name: args
        default: list
      behaviors:
      - name: render
        description: 递归渲染类型字符串
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: get_all_referenced_names
        description: 递归获取所有引用的类型名称
        inputs:
        - type: Self
          name: self
        output:
          type: string
          container: set
    - name: ReferenceSpec
      description: 引用一个已存在的变量或符号 (对应 AST Name节点)。
      attributes:
      - type: string
        name: name
    - name: LiteralSpec
      description: 基础类型的字面量值 (对应 AST Constant节点)。
      attributes:
      - type: any
        name: value
    - name: PythonEnumMemberSpec
      description: Represents an enum member in a Python module.
      attributes:
      - type: MacroString
        name: name
      - type: Any
        custom_type_string: str | int | None
        name: value
      - type: string
        name: description
        default: str
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        - type: Any
          custom_type_string: str | int | None
          name: value
        - type: string
          name: description
          default: ''
        output:
          type: PythonEnumMemberSpec
    - name: AssignmentSpec
      description: 描述变量的赋值结构 (RHS)。 对应 AST 中的 value 节点。
      attributes:
      - type: AssignmentFlavor
        name: flavor
      - type: LiteralSpec
        optional: true
        name: literal
      - type: ReferenceSpec
        optional: true
        name: reference
      - type: CallSpec
        optional: true
        name: call
      - type: AssignmentSpec
        container: list
        optional: true
        name: list_items
      - type: AssignmentSpec
        container: map
        optional: true
        name: dict_items
      - type: string
        optional: true
        name: code
      - type: SubscriptSpec
        optional: true
        name: subscript
      behaviors:
      - name: from_code
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: code
        output:
          type: AssignmentSpec
      - name: from_literal
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: value
        output:
          type: AssignmentSpec
      - name: from_symbol
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: symbol
        output:
          type: AssignmentSpec
      - name: from_call
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: func_name
        - type: AssignmentSpec
          container: list
          optional: true
          name: args
        - type: AssignmentSpec
          container: map
          optional: true
          name: kwargs
        output:
          type: AssignmentSpec
      - name: from_subscript
        inputs:
        - type: Self
          container: type
          name: cls
        - type: AssignmentSpec
          name: value
        - type: AssignmentSpec
          name: slice
        output:
          type: AssignmentSpec
      - name: get_required_types
        inputs:
        - type: Self
          name: self
        output:
          type: string
          container: set
    - name: SubscriptSpec
      description: 下标访问语法 obj[key]，对应 AST Subscript 节点。
      attributes:
      - type: AssignmentSpec
        name: value
      - type: AssignmentSpec
        name: slice
      behaviors:
      - name: get_required_types
        description: 收集 subscript.value 和 subscript.slice 中的所有类型标记。
        inputs:
        - type: Self
          name: self
        output:
          type: string
          container: set
    - name: CallSpec
      description: 函数调用或类实例化 (对应 AST Call节点)。
      attributes:
      - type: string
        name: callee
      - type: AssignmentSpec
        container: list
        name: args
      - type: AssignmentSpec
        container: map
        name: kwargs
    - name: TypeSpec
      description: 描述变量的类型注解结构 (LHS)。 对应 AST 中的 annotation 节点。
      attributes:
      - type: string
        name: core_type
      - type: ContainerType
        name: container
      - type: boolean
        name: nullable
    - name: ImportedName
      description: Represents a name imported from another module.
      attributes:
      - type: string
        name: name
      - type: string
        optional: true
        name: alias
      behaviors:
      - name: render
        inputs:
        - type: Self
          name: self
        output:
          type: string
    - name: ModuleSpec
      description: Represents a Python module.
      attributes:
      - type: SnakeString
        name: name
      - type: FunctionSpec
        container: list
        name: functions
        default: list
      - type: ClassSpec
        container: list
        name: classes
        default: list
      - type: ImportFromSpec
        container: list
        name: imports
        default: list
      - type: PythonEnumSpec
        container: list
        name: enums
        default: list
      - type: ModuleAssignmentSpec
        container: list
        name: assignments
        default: list
      - type: RawCodeSpec
        container: list
        name: extra_code
        default: list
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        - type: FunctionSpec
          container: list
          optional: true
          name: functions
        - type: ClassSpec
          container: list
          optional: true
          name: classes
        - type: ImportFromSpec
          container: list
          optional: true
          name: imports
        - type: PythonEnumSpec
          container: list
          optional: true
          name: enums
        - type: ModuleAssignmentSpec
          container: list
          optional: true
          name: assignments
        - type: RawCodeSpec
          container: list
          optional: true
          name: extra_code
        output:
          type: ModuleSpec
      - name: get_init_module
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: ModuleSpec
      - name: filename
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: is_init_module
        inputs:
        - type: Self
          name: self
        output:
          type: boolean
      - name: is_match_name
        inputs:
        - type: Self
          name: self
        - type: string
          name: name
        output:
          type: boolean
      - name: is_match_any_name
        description: Check if module name matches any of the provided names.
        inputs:
        - type: Self
          name: self
        - type: string
          container: list
          name: names
        output:
          type: boolean
      - name: get_required_types
        description: 收集本模块所有需要的类型名称
        inputs:
        - type: Self
          name: self
        output:
          type: string
          container: set
      - name: has_class
        description: 检查模块中是否存在指定名称的类
        inputs:
        - type: Self
          name: self
        - type: string
          name: class_name
        output:
          type: boolean
      - name: get_class
        description: 获取模块中指定名称的类，不存在则 raise error
        inputs:
        - type: Self
          name: self
        - type: string
          name: class_name
        output:
          type: ClassSpec
      - name: has_function
        description: 检查模块中是否存在指定名称的函数
        inputs:
        - type: Self
          name: self
        - type: string
          name: function_name
        output:
          type: boolean
      - name: has_class_or_function
        inputs:
        - type: Self
          name: self
        - type: string
          name: name
        output:
          type: boolean
      - name: collect_class_spec
        inputs:
        - type: Self
          name: self
        output:
          type: ClassSpec
          container: map
      - name: merge
        inputs:
        - type: Self
          name: self
        - type: ModuleSpec
          name: other
        output:
          type: ModuleSpec
    - name: PackageSpec
      description: Represents a Python package.
      attributes:
      - type: SnakeString
        name: name
      - type: ModuleSpec
        container: list
        name: modules
        default: list
      - type: PackageSpec
        container: list
        name: sub_packages
        default: list
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        - type: ModuleSpec
          container: list
          optional: true
          name: modules
        - type: PackageSpec
          container: list
          optional: true
          name: sub_packages
        output:
          type: any
      - name: is_empty
        inputs:
        - type: Self
          name: self
        output:
          type: boolean
      - name: get_global_registry
        inputs:
        - type: Self
          name: self
        output:
          type: string
          container: map
      - name: _build_symbol_table
        description: 递归扫描所有模块，记录每个类属于哪个绝对路径
        inputs:
        - type: Self
          name: self
        - type: string
          name: root_path
        - type: string
          container: map
          name: table
        output:
          type: any
      - name: collect_class_spec
        inputs:
        - type: Self
          name: self
        output:
          type: ClassSpec
          container: map
      - name: merge
        inputs:
        - type: Self
          name: self
        - type: PackageSpec
          name: other
        output:
          type: PackageSpec
    - name: ImportFromSpec
      description: Represents an import statement from another module.
      attributes:
      - type: string
        name: module
      - type: Any
        custom_type_string: frozenset[ImportedName]
        name: names
      - type: boolean
        name: type_checking
        default: false
      - type: integer
        name: level
        default: 0
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: module
        - type: string
          container: iterable
          name: names
        - type: boolean
          name: type_checking
          default: false
        - type: integer
          name: level
          default: 0
        output:
          type: ImportFromSpec
      - name: has_name
        inputs:
        - type: Self
          name: self
        - type: string
          name: name
        output:
          type: boolean
      - name: add_name
        inputs:
        - type: Self
          name: self
        - type: string
          name: name
        output:
          type: ImportFromSpec
      - name: render
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: render_from_expression
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: render_names
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: merge
        inputs:
        - type: Self
          name: self
        - type: ImportFromSpec
          name: other
        output:
          type: ImportFromSpec
    - name: VariableSpec
      description: '对应 Python 代码中的 name: type_spec = assignment_spec'
      attributes:
      - type: SnakeString
        name: name
      - type: TypeAnnotationSpec
        optional: true
        name: type_spec
      - type: AssignmentSpec
        optional: true
        name: assignment
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        - type: TypeAnnotationSpec
          optional: true
          name: type_spec
        - type: AssignmentSpec
          optional: true
          name: assignment
        output:
          type: VariableSpec
      - name: get_required_types
        inputs:
        - type: Self
          name: self
        output:
          type: string
          container: set
    - name: PythonEnumSpec
      description: Represents an enum in a Python module.
      attributes:
      - type: PascalString
        name: name
      - type: string
        name: description
        default: str
      - type: string
        container: list
        name: decorators
        default: list
      - type: string
        name: base_class
        default: str
      - type: PythonEnumMemberSpec
        container: list
        name: members
        default: list
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        - type: string
          name: description
          default: ''
        - type: string
          container: list
          optional: true
          name: decorators
        - type: string
          name: base_class
          default: Enum
        - type: PythonEnumMemberSpec
          container: list
          optional: true
          name: members
        output:
          type: PythonEnumSpec
      - name: get_required_types
        description: 收集本 Enum 需要的类型名称
        inputs:
        - type: Self
          name: self
        output:
          type: string
          container: set
    services:
    - name: DependencyResolver
      dependencies:
      - type: string
        container: map
        name: global_registry
      operations:
      - name: build_from_package_spec
        inputs:
        - type: Self
          container: type
          name: cls
        - type: PackageSpec
          name: package_spec
        output:
          type: DependencyResolver
      - name: resolve_module
        inputs:
        - type: Self
          name: self
        - type: ModuleSpec
          name: module_spec
        output:
          type: ImportFromSpec
          container: iterable
    - name: PythonSyntaxTranslator
      description: Bidirectional translator between Python source code and PackageSpec.
      dependencies:
      - type: SourceCodePort
        name: source_code_port
      - type: FileSystemPort
        name: file_system_port
      operations:
      - name: to_package_spec
        description: Reconstruct a PackageSpec from a dictionary of file paths and
          their contents.
        inputs:
        - type: Self
          name: self
        - type: Path
          name: package_path
        output:
          type: PackageSpec
      - name: to_code
        inputs:
        - type: Self
          name: self
        - type: ModuleSpec
          name: module_spec
        - type: ImportFromSpec
          container: iterable
          name: imports
        output:
          type: string
      - name: generate_source_tree
        description: '核心方法：将 PackageSpec 转换为虚拟文件树。

          返回格式: { Path(''relative/path/to/file.py''): ''source code content'' }'
        inputs:
        - type: Self
          name: self
        - type: PackageSpec
          name: package_spec
        - type: string
          container: list
          optional: true
          name: target_nodes
        output:
          type: Any
          custom_type_string: dict[Path, str]
      - name: _collect_files_recursively
        inputs:
        - type: Self
          name: self
        - type: PackageSpec
          name: current_spec
        - type: DependencyResolver
          name: resolver
        - type: Any
          custom_type_string: dict[Path, str]
          name: output_dict
        - type: Path
          name: current_path
        - type: string
          container: list
          optional: true
          name: target_nodes
        output:
          type: None
    ports:
    - name: SourceCodePort
      description: Port for bidirectional translation between Spec objects and Python
        source code.
      kind: adapter
      operations:
      - name: render_module
        inputs:
        - type: Self
          name: self
        - type: ModuleSpec
          name: module_spec
        - type: ImportFromSpec
          container: list
          name: imports
        output:
          type: string
      - name: parse_module
        inputs:
        - type: Self
          name: self
        - type: string
          name: source_code
        - type: string
          name: module_name
        output:
          type: ModuleSpec
    - name: CodeFormatter
      description: Formats Python source code.
      kind: adapter
      operations:
      - name: format_code
        inputs:
        - type: Self
          name: self
        - type: string
          name: code
        output:
          type: string
  application:
    use_cases:
    - name: ParsePackage
      kind: query
      inputs:
      - type: Path
        name: package_path
      outputs:
      - type: PackageSpec
        name: package_spec
      description: Parses Python package to PackageSpec.
      dependencies:
      - type: PythonSyntaxTranslator
        name: translator
    - name: GenerateSchemaJson
      kind: command
      dependencies:
      - type: FileSystemPort
        name: file_system_port
    - name: GeneratePackage
      kind: command
      inputs:
      - type: PackageSpec
        name: package_spec
      - type: boolean
        name: overwrite
        default: false
      - type: string
        container: list
        optional: true
        name: nodes
      outputs:
      - type: BuildResult
        name: result
      dependencies:
      - type: FileSystemPort
        name: file_system_port
      - type: PythonSyntaxTranslator
        name: translator
      - type: CodeFormatter
        name: code_formatter
  infrastructure:
    implementations:
    - name: AstTranslator
      implements: SourceCodePort
      technology: ast
      description: AST-based implementation of SourceCodePort.
    - name: BlackCodeFormatter
      implements: CodeFormatter
      technology: black
  interfaces:
    cli_commands:
    - name: schema
      use_case: GenerateSchemaJson
- name: DomainDefinition
  domain:
    core:
    - name: MethodSpecList
      description: ''
      base_types:
      - RootModel[list[MethodSpec]]
      attributes:
      - type: MethodSpec
        container: list
        name: root
        default: list
      behaviors:
      - name: __iter__
        inputs:
        - type: Self
          name: self
        output:
          type: MethodSpec
          container: iterable
      - name: add
        inputs:
        - type: Self
          name: self
        - type: MethodSpec
          name: method_spec
        output:
          type: Self
      - name: get
        inputs:
        - type: Self
          name: self
        - type: SnakeString
          name: name
        output:
          type: MethodSpec
      - name: update
        inputs:
        - type: Self
          name: self
        - type: MethodSpec
          name: method_spec
        output:
          type: Self
      - name: remove
        inputs:
        - type: Self
          name: self
        - type: SnakeString
          name: name
        output:
          type: Self
      - name: to_function_specs
        description: Convert behaviors to a list of FunctionSpecs.
        inputs:
        - type: Self
          name: self
        output:
          type: FunctionSpec
          container: list
      - name: from_function_specs
        description: 将 FunctionSpec 列表逆向解析为 MethodSpec 列表
        inputs:
        - type: Self
          container: type
          name: cls
        - type: FunctionSpec
          container: iterable
          name: methods
        output:
          type: Self
      - name: to_test_modules
        description: Create test package for entity with behaviors that have rules.
        inputs:
        - type: Self
          name: self
        output:
          type: ModuleSpec
          container: list
    - name: AttributeSpecList
      description: ''
      base_types:
      - RootModel[list[AttributeSpec]]
      attributes:
      - type: AttributeSpec
        container: list
        name: root
        default: list
      behaviors:
      - name: __iter__
        inputs:
        - type: Self
          name: self
        output:
          type: AttributeSpec
          container: iterable
      - name: add
        inputs:
        - type: Self
          name: self
        - type: AttributeSpec
          name: attribute_spec
        output:
          type: Self
      - name: get
        inputs:
        - type: Self
          name: self
        - type: SnakeString
          name: name
        output:
          type: AttributeSpec
      - name: update
        inputs:
        - type: Self
          name: self
        - type: AttributeSpec
          name: attribute_spec
        output:
          type: Self
      - name: remove
        inputs:
        - type: Self
          name: self
        - type: SnakeString
          name: name
        output:
          type: Self
      - name: to_variable_specs
        description: Convert attributes to a list of VariableSpecs.
        inputs:
        - type: Self
          name: self
        - type: FieldFlavor
          optional: true
          name: flavor
        output:
          type: VariableSpec
          container: list
      - name: from_variable_specs
        description: Convert VariableSpec list to AttributeSpecList.
        inputs:
        - type: Self
          container: type
          name: cls
        - type: VariableSpec
          container: iterable
          name: specs
        output:
          type: Self
    - name: DomainConcept
      description: Specification of a core entity to be generated.
      base_types:
      - BaseModel
      attributes:
      - type: PascalString
        name: name
      - type: string
        name: description
      - type: string
        container: list
        name: base_types
        default: list
      - type: AttributeSpecList
        name: attributes
        default: AttributeSpecList
      - type: MethodSpecList
        name: behaviors
        default: MethodSpecList
      - type: string
        container: class_var
        name: __concept_name__
      - type: string
        container: class_var
        name: __pkg_name__
      behaviors:
      - name: entity_name
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: to_module_spec
        description: 将 DomainConcept 转换为 ModuleSpec
        inputs:
        - type: Self
          name: self
        output:
          type: ModuleSpec
      - name: from_module_spec
        description: 将 ModuleSpec 逆向解析为 DomainConcept
        inputs:
        - type: Self
          container: type
          name: cls
        - type: ModuleSpec
          name: module
        output:
          type: Self
      - name: to_package_spec
        description: 将多个 DomainConcept 转换为一个 'core' 包
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Self
          container: iterable
          name: domain_concept
        output:
          type: PackageSpec
      - name: from_package_spec
        description: 将 PackageSpec 包逆向解析为 DomainConcept 列表
        inputs:
        - type: Self
          container: type
          name: cls
        - type: PackageSpec
          name: package
        output:
          type: Self
          container: list
      - name: to_test_package_spec
        description: Create test package for entity with behaviors that have rules.
        inputs:
        - type: Self
          name: self
        output:
          type: PackageSpec
      - name: update
        description: Update scalar metadata fields. Preserves internal structure.
        inputs:
        - type: Self
          name: self
        - type: string
          optional: true
          name: description
        - type: string
          container: list
          optional: true
          name: base_types
        output:
          type: None
    aggregates:
    - name: Blueprint
      description: Root of the generation model. Represents the entire project definition.
      attributes:
      - type: PascalString
        name: name
      - type: BoundedContext
        container: list
        name: contexts
        default: list
      - type: BootstrapSpec
        name: bootstrap
        default: BootstrapSpec
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: Union[str, PascalString]
          name: name
        - type: BoundedContext
          container: list
          optional: true
          name: contexts
        - type: BootstrapSpec
          optional: true
          name: bootstrap
        output:
          type: Self
      - name: to_package_spec
        description: Convert this Blueprint to a PackageSpec.
        inputs:
        - type: Self
          name: self
        output:
          type: PackageSpec
      - name: from_package_spec
        description: Create a Blueprint from a PackageSpec.
        inputs:
        - type: Self
          container: type
          name: cls
        - type: PackageSpec
          name: package_spec
        output:
          type: Self
      - name: remove_context
        description: Remove a BoundedContext by name. Returns self for chaining.
        inputs:
        - type: Self
          name: self
        - type: string
          name: name
        output:
          type: Self
      - name: get_context
        description: Get a BoundedContext by name. Raises ValueError if not found.
        inputs:
        - type: Self
          name: self
        - type: string
          name: name
        output:
          type: BoundedContext
      - name: to_test_package_spec
        description: Create top-level tests package with unit subpackage containing
          all context tests.
        inputs:
        - type: Self
          name: self
        output:
          type: PackageSpec
    enums:
    - name: PortType
      members:
      - name: ADAPTER
        value: adapter
      - name: REPOSITORY
        value: repository
      - name: CLIENT
        value: client
      - name: PROVIDER
        value: provider
    - name: UseCaseKind
      members:
      - name: COMMAND
        value: command
      - name: QUERY
        value: query
    - name: ElementType
      members:
      - name: AGGREGATE
        value: aggregate
      - name: ENTITY
        value: entity
      - name: VALUE_OBJECT
        value: value_object
      - name: ENUM
        value: enum
      - name: DOMAIN_SERVICE
        value: domain_service
      - name: DOMAIN_PORT
        value: domain_port
      - name: USE_CASE
        value: use_case
      - name: APP_PORT
        value: app_port
      - name: APP_SERVICE
        value: app_service
      - name: IMPLEMENTATION
        value: implementation
      - name: CLI_COMMAND
        value: cli_command
      - name: MCP_TOOL
        value: mcp_tool
      - name: HTTP_ENDPOINT
        value: http_endpoint
    - name: AttributeKind
      members:
      - name: ATTRIBUTE
        value: attribute
      - name: DEPENDENCY
        value: dependency
      - name: INPUT
        value: input
      - name: OUTPUT
        value: output
    - name: MethodKind
      members:
      - name: BEHAVIOR
        value: behavior
      - name: OPERATION
        value: operation
      - name: PRIVATE
        value: private
    value_objects:
    - name: EnumMemberSpec
      description: Specification of an enum member to be generated.
      attributes:
      - type: MacroString
        name: name
      - type: Any
        custom_type_string: str | int | None
        name: value
      - type: string
        name: description
        default: str
    - name: MethodOutput
      description: Specification of the output of a method.
      base_types:
      - TypeDefinition
    - name: PortBinding
      description: Binding between a port and an adapter.
      attributes:
      - type: string
        name: port
      - type: string
        name: implementation
    - name: ConfigFieldSpec
      description: Specification for a single configuration field.
      base_types:
      - TypeDefinition
      attributes:
      - type: SnakeString
        name: name
      - type: string
        name: type
      - type: any
        optional: true
        name: default
      - type: string
        name: description
        default: ''
      - type: string
        optional: true
        name: env_var
      behaviors:
      - name: to_variable_spec
        description: 将 ConfigFieldSpec 转换为 VariableSpec
        inputs:
        - type: Self
          name: self
        output:
          type: VariableSpec
    - name: CliCommandSpec
      description: CLI 命令规范
      attributes:
      - type: KebabString
        name: name
      - type: PascalString
        name: use_case
      - type: string
        name: description
        default: str
      behaviors:
      - name: to_module_spec
        description: "生成单个 CLI 命令模块\n\nArgs:\n    context_name: 上下文名称\n    use_case:\
          \ UseCase 规范\n\nReturns:\n    ModuleSpec for CLI command"
        inputs:
        - type: Self
          name: self
        - type: string
          name: context_name
        - type: UseCaseSpec
          name: use_case
        output:
          type: ModuleSpec
      - name: from_module_spec
        description: "从 ModuleSpec 逆向解析为 CliCommandSpec\n\nArgs:\n    module: CLI\
          \ 命令模块\n    use_case_index: UseCase 名称索引\n\nReturns:\n    CliCommandSpec\
          \ or None if无法解析"
        inputs:
        - type: Self
          container: type
          name: cls
        - type: ModuleSpec
          name: module
        - type: UseCaseSpec
          container: map
          name: use_case_index
        output:
          type: Self
          optional: true
      - name: update
        description: Update scalar metadata fields. Preserves internal structure.
        inputs:
        - type: Self
          name: self
        - type: string
          optional: true
          name: use_case
        - type: string
          optional: true
          name: description
        output:
          type: None
      - name: commands_to_package_spec
        description: "将 CLI 命令列表转换为 PackageSpec\n\nArgs:\n    commands: CLI 命令列表\n\
          \    context_name: 上下文名称\n    use_cases: UseCase 列表，用于解析类型\n    project_name:\
          \ 项目名称\n\nReturns:\n    PackageSpec for cli package"
        inputs:
        - type: Self
          container: type
          name: cls
        - type: CliCommandSpec
          container: list
          name: commands
        - type: string
          name: context_name
        - type: UseCaseSpec
          container: list
          name: use_cases
        - type: string
          name: project_name
          default: ''
        output:
          type: PackageSpec
      - name: commands_from_package_spec
        description: "从 PackageSpec 逆向解析为 CLI 命令列表\n\nArgs:\n    cli_pkg: cli 包的 PackageSpec\n\
          \    use_cases: UseCase 列表，用于索引\n\nReturns:\n    list of CliCommandSpec"
        inputs:
        - type: Self
          container: type
          name: cls
        - type: PackageSpec
          name: cli_pkg
        - type: UseCaseSpec
          container: list
          name: use_cases
        output:
          type: Self
          container: list
    - name: MethodSpec
      description: Standard specification for a class method.
      attributes:
      - type: SnakeString
        name: name
      - type: string
        optional: true
        name: description
      - type: AttributeSpec
        container: list
        name: inputs
        default: list
      - type: MethodOutput
        name: output
      - type: RuleSpec
        container: list
        name: rules
        default: list
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        - type: AttributeSpec
          container: list
          name: inputs
        - type: MethodOutput
          name: output
        output:
          type: Self
      - name: function_type
        inputs:
        - type: Self
          name: self
        output:
          type: FunctionType
      - name: to_function_spec
        description: 将 MethodSpec 转换为 PythonGen FunctionSpec
        inputs:
        - type: Self
          name: self
        output:
          type: FunctionSpec
      - name: from_function_spec
        description: 从 PythonGen FunctionSpec 逆向解析为 MethodSpec
        inputs:
        - type: Self
          container: type
          name: cls
        - type: FunctionSpec
          name: function_spec
        output:
          type: Self
      - name: to_test_module_spec
        description: Generate test module with test functions for each rule.
        inputs:
        - type: Self
          name: self
        output:
          type: ModuleSpec
      - name: to_bindings_module_spec
        description: Generate bindings module with match-case routing for given/when/then.
        inputs:
        - type: Self
          name: self
        output:
          type: ModuleSpec
      - name: _get_match_semantic_function
        inputs:
        - type: Self
          name: self
        - type: string
          name: name
        output:
          type: FunctionSpec
      - name: _get_bindings_fixture
        inputs:
        - type: Self
          name: self
        output:
          type: FunctionSpec
    - name: TypeDefinition
      description: 类型定义的公共部分，被 AttributeSpec 和 MethodOutput 共同继承。
      attributes:
      - type: string
        name: type
      - type: ContainerType
        name: container
        default: ContainerType.NONE
      - type: boolean
        name: optional
        default: bool
      - type: string
        optional: true
        name: custom_type_string
      behaviors:
      - name: to_python_annotation
        description: 将 TypeDefinition 转换为 Python 类型注解
        inputs:
        - type: Self
          name: self
        output:
          type: TypeAnnotationSpec
      - name: _apply_container
        description: 根据 container 类型包装核心类型
        inputs:
        - type: Self
          name: self
        - type: string
          name: core_type
        output:
          type: TypeAnnotationSpec
      - name: _make_optional
        description: 将类型包装为可选类型 (Union[T, None])
        inputs:
        - type: Self
          name: self
        - type: TypeAnnotationSpec
          name: annotation
        output:
          type: TypeAnnotationSpec
      - name: from_python_annotation
        description: 从 Python 类型注解逆向解析为 TypeDefinition
        inputs:
        - type: Self
          container: type
          name: cls
        - type: TypeAnnotationSpec
          optional: true
          name: annotation
        output:
          type: TypeDefinition
      - name: _extract_optional
        description: 如果是 Union[T, None] 或 Optional[T] 形式，返回 (True, T)
        inputs:
        - type: Self
          container: type
          name: cls
        - type: TypeAnnotationSpec
          name: annotation
        output:
          type: Any
          custom_type_string: tuple[bool, TypeAnnotationSpec]
