# yaml-language-server: $schema=codegen.schema.json
name: Codegen
layout: ddd_standard
description: "DDD-based Code Generator that generates itself."

contexts:
  - name: core
    description: "Core Code Generation Logic"

    domain:
      aggregates:
        - name: Blueprint
          description: "Root of the generation model. Represents the entire project definition."
          attributes:
            - { name: name, type: str, description: "Project Name" }
            - { name: description, type: str }
            - { name: layout, type: str, description: "Layout strategy name" }
            - { name: contexts, type: "list[BoundedContext]" }
            - { name: bootstrap, type: MetaBootstrap }

      value_objects:
        - name: Attribute
          description: "Standard specification for a class attribute."
          attributes:
            - { name: name, type: str }
            - { name: type, type: str }
            - { name: description, type: str, default: "" }
            - { name: optional, type: bool, default: "False" }
            - { name: default, type: str, optional: true }

        - name: MethodOutput
          description: "Specification of the output of a method."
          attributes:
            - { name: type, type: str }

        - name: MethodSpec
          description: "Standard specification for a class method."
          attributes:
            - { name: name, type: str }
            - { name: description, type: str, default: "" }
            - { name: inputs, type: "list[Attribute]" }
            - { name: output, type: MethodOutput, optional: true }

        - name: MetaAggregate
          description: "Specification of a domain aggregate to be generated."
          attributes:
            - { name: name, type: str }
            - { name: description, type: str, default: "" }
            - { name: attributes, type: "list[Attribute]" }
            - { name: behaviors, type: "list[MethodSpec]", default: "[]" }

        - name: MetaValueObject
          description: "Specification of a value object to be generated."
          attributes:
            - { name: name, type: str }
            - { name: description, type: str, default: "" }
            - { name: attributes, type: "list[Attribute]" }

        - name: MetaService
          description: "Specification of a domain service to be generated."
          attributes:
            - { name: name, type: str }
            - { name: description, type: str, default: "" }
            - { name: operations, type: "list[MethodSpec]" }

        - name: MetaDomainPort
          description: "Specification of a domain port to be generated."
          attributes:
            - { name: name, type: str }
            - { name: description, type: str, default: "" }
            - { name: kind, type: str }
            - { name: operations, type: "list[MethodSpec]" }

        - name: MetaDomain
          description: "Specification of a domain to be generated."
          attributes:
            - { name: aggregates, type: "list[MetaAggregate]" }
            - { name: value_objects, type: "list[MetaValueObject]" }
            - { name: services, type: "list[MetaService]" }
            - { name: ports, type: "list[MetaDomainPort]" }

        - name: MetaUseCaseCommand
          description: "Specification of a use case command to be generated."
          attributes:
            - { name: name, type: str }
            - { name: attributes, type: "list[Attribute]" }

        - name: MetaUseCaseResult
          description: "Specification of a use case result to be generated."
          attributes:
            - { name: name, type: str }
            - { name: attributes, type: "list[Attribute]" }

        - name: MetaUseCase
          description: "Specification of a use case to be generated."
          attributes:
            - { name: name, type: str }
            - { name: attributes, type: "list[Attribute]" }
            - { name: kind, type: str }
            - { name: description, type: str }
            - { name: command, type: MetaUseCaseCommand }
            - { name: result, type: MetaUseCaseResult }

        - name: MetaApplication
          description: "Specification of an application to be generated."
          attributes:
            - { name: use_cases, type: "list[MetaUseCase]" }

        - name: MetaInfrastructureAdapter
          description: "Specification of an infrastructure adapter to be generated."
          attributes:
            - { name: name, type: str }
            - { name: description, type: str, default: "" }
            - { name: implements, type: str }
            - { name: config, type: "Dict[str, Any]" }

        - name: MetaInfrastructure
          description: "Specification of an infrastructure to be generated."
          attributes:
            - { name: adapters, type: "list[MetaInfrastructureAdapter]" }

        - name: BoundedContext
          description: "A logical boundary within the system."
          attributes:
            - { name: name, type: str }
            - { name: description, type: str }
            - { name: domain, type: MetaDomain }
            - { name: application, type: MetaApplication }
            - { name: infrastructure, type: MetaInfrastructure }

        - name: PortBinding
          description: "Binding between a port and an adapter."
          attributes:
            - { name: port, type: str }
            - { name: implementation, type: str }

        - name: MetaBootstrap
          description: "Specification of the bootstrap configuration."
          attributes:
            - { name: bindings, type: "list[PortBinding]" }

        - name: RenderTask
          description: "Task for rendering templates with context data."
          attributes:
            - { name: target_path, type: str }
            - { name: template_name, type: str }
            - { name: context_data, type: "Dict[str, Any]" }

      services:
        - name: NamingService
          description: "Provide naming conversions used during code generation."
          operations:
            - name: to_snake
              description: "Convert to snake_case"
              inputs:
                - { name: text, type: str }
              output: { type: str }
            - name: to_pascal
              description: "Convert to PascalCase"
              inputs:
                - { name: text, type: str }
              output: { type: str }
            - name: to_kebab
              description: "Convert to kebab-case"
              inputs:
                - { name: text, type: str }
              output: { type: str }

        - name: TemplateContextBuilder
          description: "Build the template rendering context from the blueprint."
          operations:
            - name: build_registry
              inputs:
                - { name: blueprint, type: Blueprint }
              output: { type: None }
            - name: extract_types
              inputs:
                - { name: type_strs, type: "list[str]" }
              output: { type: "Set[str]" }
            - name: resolve_imports
              inputs:
                - { name: types_used, type: "Set[str]" }
                - { name: current_name, type: str }
                - { name: force_dataclass, type: bool }
              output: { type: "list[str]" }
            - name: build_context
              inputs:
                - { name: blueprint, type: Blueprint }
              output: { type: "Dict[str, Any]" }

        - name: ScaffoldService
          description: "Converts the Blueprint into a flat list of render tasks."
          operations:
            - name: plan_generation
              inputs:
                - { name: blueprint, type: Blueprint }
              output: { type: "list[RenderTask]" }

            - name: plan_paths
              inputs:
                - { name: blueprint, type: Blueprint }
              output: { type: "list[Path]" }

            - name: get_component_paths
              description: "get path for a specific component"
              inputs:
                - { name: component_type, type: str }
                - { name: name, type: str}
              output: { type: "Path" }

      ports:
        - name: TemplatePort
          description: "Render templates with a given context."
          kind: gateway
          operations:
            - name: render
              inputs:
                - { name: template, type: str }
                - { name: context, type: "Dict[str, Any]" }
              output: { type: str }
        - name: FileSystemPort
          description: "File system operations used by the generator."
          kind: repository
          operations:
            - name: read_text
              inputs:
                - { name: path, type: str }
              output: { type: str }
            - name: write_text
              inputs:
                - { name: path, type: str }
                - { name: content, type: str }
                - { name: overwrite, type: bool, default: "False" }
              output: { type: None }
            - name: makedirs
              inputs:
                - { name: path, type: str }
                - { name: exist_ok, type: bool }
              output: { type: None }
        - name: BlueprintLoaderPort
          description: "Loads the blueprint from a file."
          kind: repository
          operations:
            - name: load
              inputs:
                - { name: source, type: str }
              output: { type: Blueprint | None }

    application:
      use_cases:
        - name: GenerateCode
          kind: command
          description: "Generate project code from the blueprint. "
          command:
            name: GenerateCodeCommand
            attributes:
              - { name: overwrite, type: bool }
              - { name: node, type: str, optional: true }
          result:
            name: GenerateCodeResult
            attributes:
              - { name: files_written, type: "list[str]" }
          attributes:
            - { name: scaffold_service, type: ScaffoldService }
            - { name: template_port, type: TemplatePort }
            - { name: file_system_port, type: FileSystemPort }
            - { name: blueprint_loader, type: BlueprintLoaderPort }

    infrastructure:
      adapters:
        - name: JinjaAdapter
          implements: TemplatePort
          description: "Jinja-based template rendering adapter."
          config:
            template_root: "src/codegen/templates"
            autoescape: false

        - name: OSFileSystem
          implements: FileSystemPort
          description: "OS file system adapter for reading/writing files."
          config:
            output_root: "out"
            encoding: "utf-8"

        - name: YamlFileBlueprintLoader
          implements: BlueprintLoaderPort
          description: "Blueprint loader that reads from a YAML file."


bootstrap:
  bindings:
    - { port: TemplatePort, implementation: JinjaAdapter }
    - { port: FileSystemPort, implementation: OSFileSystem }
