# yaml-language-server: $schema=./codegen.schema.json
name: Codegen
description: ''
contexts:
- name: Shared
  domain:
    enums:
    - name: ContainerType
      members:
      - name: NONE
        value: none
      - name: LIST
        value: list
      - name: SET
        value: set
      - name: MAP
        value: map
      - name: ITERABLE
        value: iterable
      - name: CALLABLE
        value: callable
      - name: TYPE
        value: type
    - name: PrimitiveType
      description: 通用原语类型，不依赖具体语言。
      members:
      - name: STRING
        value: string
      - name: INTEGER
        value: integer
      - name: FLOAT
        value: float
      - name: BOOLEAN
        value: boolean
      - name: DATETIME
        value: datetime
      - name: UUID
        value: uuid
      - name: ANY
        value: any
    value_objects:
    - name: SnakeString
      behaviors:
      - name: __new__
        inputs:
        - type: any
          name: cls
        - type: string
          name: value
        output:
          type: any
    - name: PascalString
      behaviors:
      - name: __new__
        inputs:
        - type: any
          name: cls
        - type: string
          name: value
        output:
          type: any
    - name: KebabString
      behaviors:
      - name: __new__
        inputs:
        - type: any
          name: cls
        - type: string
          name: value
        output:
          type: any
    - name: NamingString
      description: 基于 case-converter 的增强型字符串
      behaviors:
      - name: to_pascal
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: to_snake
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: to_kebab
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: to_camel
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: to_macro
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: __get_pydantic_core_schema__
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: source_type
        - type: GetCoreSchemaHandler
          name: handler
        output:
          type: core_schema.CoreSchema
    - name: MacroString
      behaviors:
      - name: __new__
        inputs:
        - type: any
          name: cls
        - type: string
          name: value
        output:
          type: any
    ports:
    - name: FileSystemPort
      description: Port for interacting with the file system.
      kind: adapter
      operations:
      - name: read_file
        inputs:
        - type: Self
          name: self
        - type: Path
          name: path
        output:
          type: string
      - name: write_file
        inputs:
        - type: Self
          name: self
        - type: Path
          name: path
        - type: string
          name: content
        - type: boolean
          name: overwrite
          default: false
        output:
          type: boolean
      - name: list_directory_recursively
        inputs:
        - type: Self
          name: self
        - type: Path
          name: path
        output:
          type: Path
          container: iterable
      - name: list_directory_flat
        inputs:
        - type: Self
          name: self
        - type: Path
          name: path
        output:
          type: Path
          container: iterable
      - name: is_directory
        inputs:
        - type: Self
          name: self
        - type: Path
          name: path
        output:
          type: boolean
      - name: is_file
        inputs:
        - type: Self
          name: self
        - type: Path
          name: path
        output:
          type: boolean
      - name: exists
        inputs:
        - type: Self
          name: self
        - type: Path
          name: path
        output:
          type: boolean
  infrastructure:
    implementations:
    - name: OsFileSystem
      implements: FileSystemPort
      technology: os
      description: OS file system adapter for reading/writing files.
      attributes:
      - type: Path
        name: root
      - type: string
        name: encoding
        default: utf-8
- name: Orchestration
  domain:
    enums:
    - name: BuildStatus
      members:
      - name: SUCCESS
        value: SUCCESS
      - name: FAILURE
        value: FAILURE
      - name: WARNING
        value: WARNING
    - name: FileStatus
      members:
      - name: CREATED
        value: CREATED
      - name: UPDATED
        value: UPDATED
      - name: SKIPPED
        value: SKIPPED
      - name: FAILED
        value: FAILED
    value_objects:
    - name: BuildResult
      description: Top-level result object returned by generation use cases.
      attributes:
      - type: Any
        name: model_config
      - type: BuildStatus
        name: status
      - type: FileResult
        container: list
        optional: true
        name: files
      - type: BuildStats
        optional: true
        name: stats
      - type: string
        container: list
        optional: true
        name: messages
      behaviors:
      - name: add_file_result
        inputs:
        - type: Self
          name: self
        - type: FileResult
          name: result
        output:
          type: any
    - name: FileResult
      description: Represents the outcome for a single file generation.
      attributes:
      - type: string
        name: path
      - type: FileStatus
        name: status
      - type: string
        optional: true
        name: message
      - type: string
        optional: true
        name: diff
    - name: BuildStats
      description: Aggregated statistics for a build operation.
      attributes:
      - type: Any
        name: model_config
      - type: integer
        name: total_files
        default: 0
      - type: integer
        name: created_count
        default: 0
      - type: integer
        name: updated_count
        default: 0
      - type: integer
        name: skipped_count
        default: 0
      - type: integer
        name: failed_count
        default: 0
      - type: integer
        name: duration_ms
        default: 0
      behaviors:
      - name: add_result
        inputs:
        - type: Self
          name: self
        - type: FileResult
          name: result
        output:
          type: any
  application:
    use_cases:
    - name: GenerateProject
      kind: command
      dependencies:
      - type: LoadBlueprint
        name: loader
      - type: GeneratePackage
        name: generator
      command:
        attributes:
        - type: string
          container: list
          optional: true
          name: nodes
        - type: boolean
          name: generate_tests
          default: false
      result:
        attributes:
        - type: BuildResult
          name: result
    - name: GenerateBlueprint
      kind: command
      dependencies:
      - type: ParsePackage
        name: parser
      - type: BlueprintStorage
        name: storage
      command:
        attributes:
        - type: Path
          name: path
      result:
        attributes:
        - type: string
          name: result
  interfaces:
    cli:
      commands:
      - name: build
        use_case: GenerateProject
      - name: reverse
        use_case: GenerateBlueprint
- name: PythonGen
  domain:
    enums:
    - name: AssignmentFlavor
      members:
      - name: NONE
        value: none
      - name: LITERAL
        value: literal
      - name: SYMBOL
        value: symbol
      - name: CALL
        value: call
      - name: DICT
        value: dict
      - name: LIST
        value: list
      - name: RAW_CODE
        value: raw_code
      - name: CODE
        value: code
      - name: SUBSCRIPT
        value: subscript
    - name: FunctionType
      members:
      - name: CLASS_METHOD
        value: class_method
      - name: STATIC_METHOD
        value: static_method
      - name: INSTANCE_METHOD
        value: instance_method
      - name: FUNCTION
        value: function
    - name: FieldFlavor
      members:
      - name: PYDANTIC
        value: pydantic
      - name: DATACLASS
        value: dataclass
    value_objects:
    - name: ModuleAssignmentSpec
      description: Represents a top-level assignment in a module.
      attributes:
      - type: string
        name: name
      - type: string
        name: value
      - type: string
        optional: true
        name: type_annotation
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        - type: string
          name: value
        - type: string
          optional: true
          name: type_annotation
        output:
          type: ModuleAssignmentSpec
    - name: RawCodeSpec
      description: Represents a block of raw source code.
      attributes:
      - type: string
        name: code
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: code
        output:
          type: RawCodeSpec
    - name: ClassSpec
      description: Represents a class in a Python module.
      attributes:
      - type: PascalString
        name: name
      - type: string
        name: description
        default: ''
      - type: string
        container: list
        optional: true
        name: decorators
      - type: string
        container: list
        optional: true
        name: inheritance
      - type: VariableSpec
        container: list
        optional: true
        name: attributes
      - type: FunctionSpec
        container: list
        optional: true
        name: methods
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        - type: string
          name: description
          default: ''
        - type: string
          container: list
          optional: true
          name: decorators
        - type: string
          container: list
          optional: true
          name: inheritance
        - type: VariableSpec
          container: list
          optional: true
          name: attributes
        - type: FunctionSpec
          container: list
          optional: true
          name: methods
        output:
          type: ClassSpec
      - name: create_value_object
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: ClassSpec
      - name: create_aggregate
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: ClassSpec
      - name: create_entity
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: ClassSpec
      - name: create_event
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: ClassSpec
      - name: _create_base_model
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        output:
          type: ClassSpec
      - name: get_required_types
        inputs:
        - type: Self
          name: self
        output:
          type: string
          container: set
      - name: merge
        inputs:
        - type: Self
          name: self
        - type: ClassSpec
          name: other
        output:
          type: ClassSpec
    - name: FunctionSpec
      description: Represents a function in a Python module.
      attributes:
      - type: SnakeString
        name: name
      - type: string
        container: list
        optional: true
        name: decorators
      - type: VariableSpec
        container: list
        optional: true
        name: parameters
      - type: TypeAnnotationSpec
        name: return_annotation
      - type: string
        name: suite
        default: ''
      - type: FunctionType
        name: function_type
        default: FunctionType.FUNCTION
      - type: boolean
        name: is_private
        default: false
      - type: string
        optional: true
        name: description
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        - type: TypeAnnotationSpec
          name: return_annotation
        - type: string
          container: list
          optional: true
          name: decorators
        - type: VariableSpec
          container: list
          optional: true
          name: parameters
        - type: string
          name: suite
          default: ''
        - type: FunctionType
          name: function_type
          default: FunctionType.FUNCTION
        - type: boolean
          name: is_private
          default: false
        - type: string
          optional: true
          name: description
        output:
          type: any
      - name: get_required_types
        inputs:
        - type: Self
          name: self
        output:
          type: string
          container: set
      - name: is_instance_method
        inputs:
        - type: Self
          name: self
        output:
          type: boolean
      - name: merge
        inputs:
        - type: Self
          name: self
        - type: FunctionSpec
          name: other
        output:
          type: FunctionSpec
      - name: is_init_method
        inputs:
        - type: Self
          name: self
        output:
          type: boolean
    - name: TypeAnnotationSpec
      description: Represents a type annotation.
      attributes:
      - type: string
        name: name
      - type: TypeAnnotationSpec | AssignmentSpec
        container: list
        optional: true
        name: args
      behaviors:
      - name: render
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: get_all_referenced_names
        inputs:
        - type: Self
          name: self
        output:
          type: string
          container: set
    - name: ReferenceSpec
      description: 引用一个已存在的变量或符号 (对应 AST Name节点)。
      attributes:
      - type: string
        name: name
    - name: LiteralSpec
      description: 基础类型的字面量值 (对应 AST Constant节点)。
      attributes:
      - type: any
        name: value
    - name: PythonEnumMemberSpec
      description: Represents an enum member in a Python module.
      attributes:
      - type: MacroString
        name: name
      - type: Any
        optional: true
        custom_type_string: str | int | None
        name: value
      - type: string
        optional: true
        name: description
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        - type: Any
          custom_type_string: str | int | None
          name: value
        - type: string
          name: description
          default: ''
        output:
          type: PythonEnumMemberSpec
    - name: AssignmentSpec
      description: 描述变量的赋值结构 (RHS)。 对应 AST 中的 value 节点。
      attributes:
      - type: AssignmentFlavor
        name: flavor
      - type: LiteralSpec
        optional: true
        name: literal
      - type: ReferenceSpec
        optional: true
        name: reference
      - type: CallSpec
        optional: true
        name: call
      - type: AssignmentSpec
        container: list
        optional: true
        name: list_items
      - type: AssignmentSpec
        container: map
        optional: true
        name: dict_items
      - type: string
        optional: true
        name: code
      - type: SubscriptSpec
        optional: true
        name: subscript
      behaviors:
      - name: from_code
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: code
        output:
          type: AssignmentSpec
      - name: from_literal
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: value
        output:
          type: AssignmentSpec
      - name: from_symbol
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: symbol
        output:
          type: AssignmentSpec
      - name: from_call
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: func_name
        - type: AssignmentSpec
          container: list
          optional: true
          name: args
        - type: AssignmentSpec
          container: map
          optional: true
          name: kwargs
        output:
          type: AssignmentSpec
      - name: from_subscript
        inputs:
        - type: Self
          container: type
          name: cls
        - type: AssignmentSpec
          name: value
        - type: AssignmentSpec
          name: slice
        output:
          type: AssignmentSpec
      - name: get_required_types
        inputs:
        - type: Self
          name: self
        output:
          type: string
          container: set
    - name: SubscriptSpec
      description: 下标访问语法 obj[key]，对应 AST Subscript 节点。
      attributes:
      - type: AssignmentSpec
        name: value
      - type: AssignmentSpec
        name: slice
      behaviors:
      - name: get_required_types
        inputs:
        - type: Self
          name: self
        output:
          type: string
          container: set
    - name: CallSpec
      description: 函数调用或类实例化 (对应 AST Call节点)。
      attributes:
      - type: string
        name: callee
      - type: AssignmentSpec
        container: list
        name: args
      - type: AssignmentSpec
        container: map
        name: kwargs
    - name: TypeSpec
      description: 描述变量的类型注解结构 (LHS)。 对应 AST 中的 annotation 节点。
      attributes:
      - type: string
        name: core_type
      - type: ContainerType
        name: container
      - type: boolean
        name: nullable
    - name: ImportedName
      description: Represents a name imported from another module.
      attributes:
      - type: string
        name: name
      - type: string
        optional: true
        name: alias
      behaviors:
      - name: render
        inputs:
        - type: Self
          name: self
        output:
          type: string
    - name: ModuleSpec
      description: Represents a Python module.
      attributes:
      - type: SnakeString
        name: name
      - type: FunctionSpec
        container: list
        optional: true
        name: functions
      - type: ClassSpec
        container: list
        optional: true
        name: classes
      - type: ImportFromSpec
        container: list
        optional: true
        name: imports
      - type: PythonEnumSpec
        container: list
        optional: true
        name: enums
      - type: ModuleAssignmentSpec
        container: list
        optional: true
        name: assignments
      - type: RawCodeSpec
        container: list
        optional: true
        name: extra_code
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        - type: FunctionSpec
          container: list
          optional: true
          name: functions
        - type: ClassSpec
          container: list
          optional: true
          name: classes
        - type: ImportFromSpec
          container: list
          optional: true
          name: imports
        - type: PythonEnumSpec
          container: list
          optional: true
          name: enums
        - type: ModuleAssignmentSpec
          container: list
          optional: true
          name: assignments
        - type: RawCodeSpec
          container: list
          optional: true
          name: extra_code
        output:
          type: ModuleSpec
      - name: create_shared_models
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: ModuleSpec
      - name: create_shared_events
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: ModuleSpec
      - name: get_init_module
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: ModuleSpec
      - name: filename
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: is_init_module
        inputs:
        - type: Self
          name: self
        output:
          type: boolean
      - name: is_match_name
        inputs:
        - type: Self
          name: self
        - type: string
          name: name
        output:
          type: boolean
      - name: is_match_any_name
        inputs:
        - type: Self
          name: self
        - type: string
          container: list
          name: names
        output:
          type: boolean
      - name: get_required_types
        inputs:
        - type: Self
          name: self
        output:
          type: string
          container: set
      - name: has_class
        inputs:
        - type: Self
          name: self
        - type: string
          name: class_name
        output:
          type: boolean
      - name: has_function
        inputs:
        - type: Self
          name: self
        - type: string
          name: function_name
        output:
          type: boolean
      - name: has_class_or_function
        inputs:
        - type: Self
          name: self
        - type: string
          name: name
        output:
          type: boolean
      - name: collect_class_spec
        inputs:
        - type: Self
          name: self
        output:
          type: ClassSpec
          container: map
      - name: merge
        inputs:
        - type: Self
          name: self
        - type: ModuleSpec
          name: other
        output:
          type: ModuleSpec
    - name: PackageSpec
      description: Represents a Python package.
      attributes:
      - type: SnakeString
        name: name
      - type: ModuleSpec
        container: list
        optional: true
        name: modules
      - type: PackageSpec
        container: list
        optional: true
        name: sub_packages
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        - type: ModuleSpec
          container: list
          optional: true
          name: modules
        - type: PackageSpec
          container: list
          optional: true
          name: sub_packages
        output:
          type: any
      - name: is_empty
        inputs:
        - type: Self
          name: self
        output:
          type: boolean
      - name: get_global_registry
        inputs:
        - type: Self
          name: self
        - type: string
          name: root_path
          default: ''
        output:
          type: string
          container: map
      - name: _build_symbol_table
        inputs:
        - type: Self
          name: self
        - type: string
          name: root_path
        - type: string
          container: map
          name: table
        output:
          type: any
      - name: collect_class_spec
        inputs:
        - type: Self
          name: self
        output:
          type: ClassSpec
          container: map
      - name: merge
        inputs:
        - type: Self
          name: self
        - type: PackageSpec
          name: other
        output:
          type: PackageSpec
    - name: ImportFromSpec
      description: Represents an import statement from another module.
      attributes:
      - type: string
        name: module
      - type: Any
        custom_type_string: frozenset[ImportedName]
        name: names
      - type: boolean
        name: type_checking
        default: false
      - type: integer
        name: level
        default: 0
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: module
        - type: string
          container: iterable
          name: names
        - type: boolean
          name: type_checking
          default: false
        - type: integer
          name: level
          default: 0
        output:
          type: ImportFromSpec
      - name: has_name
        inputs:
        - type: Self
          name: self
        - type: string
          name: name
        output:
          type: boolean
      - name: add_name
        inputs:
        - type: Self
          name: self
        - type: string
          name: name
        output:
          type: ImportFromSpec
      - name: render
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: render_from_expression
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: render_names
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: merge
        inputs:
        - type: Self
          name: self
        - type: ImportFromSpec
          name: other
        output:
          type: ImportFromSpec
    - name: VariableSpec
      description: '对应 Python 代码中的 name: type_spec = assignment_spec'
      attributes:
      - type: SnakeString
        name: name
      - type: TypeAnnotationSpec
        optional: true
        name: type_spec
      - type: AssignmentSpec
        optional: true
        name: assignment
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        - type: TypeAnnotationSpec
          optional: true
          name: type_spec
        - type: AssignmentSpec
          optional: true
          name: assignment
        output:
          type: VariableSpec
      - name: get_required_types
        inputs:
        - type: Self
          name: self
        output:
          type: string
          container: set
    - name: PythonEnumSpec
      description: Represents an enum in a Python module.
      attributes:
      - type: PascalString
        name: name
      - type: string
        optional: true
        name: description
