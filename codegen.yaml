# yaml-language-server: $schema=codegen.schema.json
name: Codegen
layout: ddd_standard
description: "DDD-based Code Generator that generates itself."

contexts:
  - name: domain_definition
    description: "Parses the codegen.yaml blueprint."

    domain:
      value_objects:
        - name: Attribute
          description: "Standard specification for a class attribute."
          attributes:
            - { name: name, type: str }
            - { name: type, type: str }
            - { name: description, type: str, optional: true }
            - { name: optional, type: bool, optional: true }

        - name: MethodOutput
          description: "Specification of the output of a method."
          attributes:
            - { name: type, type: str }

        - name: MethodSpec
          description: "Standard specification for a class method."
          attributes:
            - { name: name, type: str }
            - { name: description, type: str, optional: true }
            - { name: inputs, type: "list[Attribute]" }
            - { name: output, type: MethodOutput }

        - name: MetaAggregate
          description: "Specification of a domain aggregate to be generated."
          attributes:
            - { name: name, type: str }
            - { name: description, type: str, optional: true }
            - { name: attributes, type: "list[Attribute]", optional: true }
            - { name: behaviors, type: "list[MethodSpec]", optional: true }

        - name: MetaValueObject
          description: "Specification of a value object to be generated."
          attributes:
            - { name: name, type: str }
            - { name: description, type: str, optional: true }
            - { name: attributes, type: "list[Attribute]", optional: true }

        - name: MetaService
          description: "Specification of a domain service to be generated."
          attributes:
            - { name: name, type: str }
            - { name: description, type: str, optional: true }
            - { name: attributes, type: "list[Attribute]", optional: true }
            - { name: operations, type: "list[MethodSpec]", optional: true }

        - name: MetaDomainPort
          description: "Specification of a domain port to be generated."
          attributes:
            - { name: name, type: str }
            - { name: description, type: str, optional: true }
            - { name: kind, type: str }
            - { name: operations, type: "list[MethodSpec]", optional: true }

        - name: MetaDomain
          description: "Specification of a domain to be generated."
          attributes:
            - { name: aggregates, type: "list[MetaAggregate]", optional: true }
            - { name: value_objects, type: "list[MetaValueObject]", optional: true }
            - { name: services, type: "list[MetaService]", optional: true }
            - { name: ports, type: "list[MetaDomainPort]", optional: true }

        - name: MetaUseCaseCommand
          description: "Specification of a use case command to be generated."
          attributes:
            - { name: name, type: str, optional: true }
            - { name: attributes, type: "list[Attribute]", optional: true }

        - name: MetaUseCaseQuery
          description: "Specification of a use case command to be generated."
          attributes:
            - { name: name, type: str, optional: true }
            - { name: attributes, type: "list[Attribute]", optional: true }

        - name: MetaUseCaseResult
          description: "Specification of a use case result to be generated."
          attributes:
            - { name: name, type: str, optional: true }
            - { name: attributes, type: "list[Attribute]", optional: true }

        - name: MetaUseCase
          description: "Specification of a use case to be generated."
          attributes:
            - { name: name, type: str }
            - { name: kind, type: str }
            - { name: attributes, type: "list[Attribute]", optional: true }
            - { name: description, type: str, optional: true }
            - { name: command, type: MetaUseCaseCommand, optional: true }
            - { name: query, type: MetaUseCaseQuery, optional: true }
            - { name: result, type: MetaUseCaseResult, optional: true }

        - name: MetaApplication
          description: "Specification of an application to be generated."
          attributes:
            - { name: use_cases, type: "list[MetaUseCase]", optional: true }

        - name: MetaInfrastructureAdapter
          description: "Specification of an infrastructure adapter to be generated."
          attributes:
            - { name: name, type: str }
            - { name: description, type: str, optional: true }
            - { name: implements, type: str}
            - { name: config, type: "dict[str, Any]", optional: true }
        - name: MetaInfrastructure
          description: "Specification of an infrastructure to be generated."
          attributes:
            - { name: adapters, type: "list[MetaInfrastructureAdapter]", optional: true }
        - name: BoundedContext
          description: "A logical boundary within the system."
          attributes:
            - { name: name, type: str }
            - { name: description, type: str, optional: true }
            - { name: domain, type: MetaDomain, optional: true }
            - { name: application, type: MetaApplication, optional: true }
            - { name: infrastructure, type: MetaInfrastructure, optional: true }
        - name: PortBinding
          description: "Binding between a port and an adapter."
          attributes:
            - { name: port, type: str }
            - { name: implementation, type: str }
        - name: MetaBootstrap
          description: "Specification of the bootstrap configuration."
          attributes:
            - { name: bindings, type: "list[PortBinding]" }
        - name: Blueprint
          description: "Root of the generation model. Represents the entire project definition."
          attributes:
            - { name: name, type: str, description: "Project Name" }
            - { name: description, type: str }
            - { name: layout, type: str, description: "Layout strategy name" }
            - { name: contexts, type: "list[BoundedContext]" }
            - { name: bootstrap, type: MetaBootstrap }

      ports:
        - name: BlueprintLoaderPort
          description: "Loads the blueprint from a file."
          kind: repository
          operations:
            - name: load
              inputs:
                - { name: source, type: str }
              output: { type: Blueprint | None }

    application:
      use_cases:
        - name: LoadBlueprint
          kind: command
          description: "Loads the blueprint from a file."
          command:
            attributes:
              - { name: node, type: str, optional: true }
          result:
            attributes:
              - { name: blueprint, type: "Blueprint | None", optional: true }
          attributes:
            - { name: blueprint_loader, type: BlueprintLoaderPort }

    infrastructure:
      adapters:
        - name: YamlBlueprintLoader
          implements: BlueprintLoaderPort
          description: "Blueprint loader that reads from a YAML file."

  - name: python_gen
    description: "Models the structure of Python code."
    domain:
      value_objects:
        - name: ImportedName
          description: "Represents a name imported from another module."
          attributes:
            - { name: name, type: str }
            - { name: alias, type: str | None, optional: true }
        - name: ImportFromSpec
          description: "Represents an import statement from another module."
          attributes:
            - { name: module, type: str }
            - { name: names, type: "list[ImportedName]" }
        - name: TypeAnnotationSpec
          description: "Represents a type annotation."
          attributes:
          - { name: name, type: str }
          - { name: sub_annotations, type: "list[TypeAnnotationSpec]", optional: true }
        - name: ParameterSpec
          description: "Represents a parameter in a Python function."
          attributes:
            - { name: name, type: str }
            - { name: annotation, type: TypeAnnotationSpec }
            - { name: default, type: str, optional: true }
            - { name: optional, type: bool, optional: true}
        - name: FunctionSpec
          description: "Represents a function in a Python module."
          attributes:
            - { name: decorators, type: "list[str]", optional: true }
            - { name: name, type: str }
            - { name: parameters, type: "list[ParameterSpec]", optional: true }
            - { name: return_annotation, type: TypeAnnotationSpec }
            - { name: suite, type: str }
        - name: ClassSpec
          description: "Represents a class in a Python module."
          attributes:
            - { name: name, type: str }
            - { name: description, type: str, optional: true }
            - { name: decorators, type: "list[str]", optional: true }
            - { name: inheritance, type: "list[str]", optional: true }
            - { name: attributes, type: "list[ParameterSpec]", optional: true }
            - { name: methods, type: "list[FunctionSpec]", optional: true }
        - name: ModuleSpec
          description: "Represents a Python module."
          attributes:
            - { name: name, type: str }
            - { name: directory, type: Path }
            - { name: functions, type: "list[FunctionSpec]", optional: true }
            - { name: classes, type: "list[ClassSpec]", optional: true }
            - { name: imports, type: "list[ImportFromSpec]", optional: true }
        - name: PackageSpec
          description: "Represents a Python package."
          attributes:
            - { name: path, type: Path }
            - { name: modules, type: "list[ModuleSpec]" }
            - { name: sub_packages, type: "list[PackageSpec]"}
      services:
        - name: DependencyResolver
          description: "Resolves dependencies between modules."
        - name: PythonSyntaxTranslator
          description: "Bidirectional translator between Python source code and PackageSpec."
          attributes:
            - { name: template_port, type: TemplatePort }
          operations:
            - name: to_spec
              description: "Parses source code into a ModuleSpec."
              inputs:
                - { name: source_code, type: str }
                - { name: module_name, type: str }
              output: { type: ModuleSpec }
            - name: to_code
              description: "Generates source code from a ModuleSpec."
              inputs:
                - { name: module_spec, type: ModuleSpec }
                - { name: imports, type: "Iterable[ImportFromSpec]" }
              output: { type: str }
            - name: generate_source_tree
              description: "Generates a virtual file tree from a PackageSpec. returns: { Path('relative/path/to/file.py'): 'source code content' }"
              inputs:
                - { name: package_spec, type: PackageSpec }
                - { name: target_node, type: str | None, optional: true }
              output: { type: "dict[Path, str]" }
            - name: _collect_files_recursively
              description: "Recursively collects all files in a directory tree."
              inputs:
                - { name: current_spec, type: PackageSpec }
                - { name: resolver, type: DependencyResolver }
                - { name: output_dict, type: "dict[Path, str]" }
                - { name: current_path, type: Path }
                - { name: target_node, type: str | None, optional: true }
              output: { type: None }
    application:
      use_cases:
        - name: GeneratePackage
          kind: command
          description: "Generate Python package."
          command:
            name: GeneratePackageCommand
            attributes:
              - { name: package_spec, type: PackageSpec }
              - { name: overwrite, type: bool, optional: true }
          result:
            name: GeneratePackageResult
            attributes:
              - { name: result, type: str }
          attributes:
            - { name: translator, type: PythonSyntaxTranslator }
            - { name: file_system_port, type: FileSystemPort }
        - name: ParsePackage
          kind: query
          description: "Parses Python package to PackageSpec."
          attributes:
            - { name: translator, type: PythonSyntaxTranslator }
            - { name: file_system_port, type: FileSystemPort }
          query:
            attributes:
              - { name: package_path, type: Path }
          result:
            attributes:
              - { name: package_spec, type: PackageSpec }

  - name: shared
    description: "Shared between contexts."
    domain:
      ports:
        - name: TemplatePort
          description: "Port for generating templates."
          kind: gateway
          operations:
            - name: render
              inputs:
                - { name: template_path, type: str }
                - { name: context, type: "Dict[str, Any]" }
              output: { type: str }
        - name: FileSystemPort
          description: "Port for interacting with the file system."
          kind: repository
          operations:
            - name: read_file
              inputs:
                - { name: path, type: str }
              output: { type: str }
            - name: write_file
              inputs:
                - { name: path, type: str }
                - { name: content, type: str }
                - { name: overwrite, type: bool, optional: true }
              output: { type: None }

    infrastructure:
      adapters:
        - name: JinjaAdapter
          implements: TemplatePort
          description: "Jinja-based template rendering adapter."
          config:
            template_root: "src/codegen/templates"
            autoescape: false

        - name: OSFileSystem
          implements: FileSystemPort
          description: "OS file system adapter for reading/writing files."
          config:
            output_root: "out"
            encoding: "utf-8"

#orchestration:
#  workflows:
#    - name: GenerateProject
#  translators:
#    - name: BlueprintToPackageSpec

bootstrap:
  bindings:
    - { port: TemplatePort, implementation: JinjaAdapter }
    - { port: FileSystemPort, implementation: OSFileSystem }
