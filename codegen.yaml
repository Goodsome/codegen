        inputs:
        - type: Self
          name: self
        - type: ModuleSpec
          name: module_spec
        output:
          type: ImportFromSpec
          container: iterable
    - name: PythonSyntaxTranslator
      description: Bidirectional translator between Python source code and PackageSpec.
      dependencies:
      - type: SourceCodePort
        name: source_code_port
      - type: FileSystemPort
        name: file_system_port
      operations:
      - name: to_package_spec
        inputs:
        - type: Self
          name: self
        - type: Path
          name: package_path
        output:
          type: PackageSpec
      - name: to_code
        inputs:
        - type: Self
          name: self
        - type: ModuleSpec
          name: module_spec
        - type: ImportFromSpec
          container: iterable
          name: imports
        output:
          type: string
      - name: generate_source_tree
        inputs:
        - type: Self
          name: self
        - type: PackageSpec
          name: package_spec
        - type: string
          container: list
          optional: true
          name: target_nodes
        - type: string
          name: root_path
          default: ''
        output:
          type: Any
          custom_type_string: dict[Path, str]
      - name: _collect_files_recursively
        inputs:
        - type: Self
          name: self
        - type: PackageSpec
          name: current_spec
        - type: DependencyResolver
          name: resolver
        - type: Any
          custom_type_string: dict[Path, str]
          name: output_dict
        - type: Path
          name: current_path
        - type: string
          container: list
          optional: true
          name: target_nodes
        output:
          type: None
    ports:
    - name: SourceCodePort
      description: Port for bidirectional translation between Spec objects and Python
        source code.
      kind: adapter
      operations:
      - name: render_module
        inputs:
        - type: Self
          name: self
        - type: ModuleSpec
          name: module_spec
        - type: ImportFromSpec
          container: list
          name: imports
        output:
          type: string
      - name: parse_module
        inputs:
        - type: Self
          name: self
        - type: string
          name: source_code
        - type: string
          name: module_name
        output:
          type: ModuleSpec
    - name: CodeFormatter
      description: Formats Python source code.
      kind: adapter
      operations:
      - name: format_code
        inputs:
        - type: Self
          name: self
        - type: string
          name: code
        output:
          type: string
