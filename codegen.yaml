    - name: BoundedContext
      description: A logical boundary within the system.
      attributes:
      - type: PascalString
        name: name
      - type: DomainSpec
        name: domain
        default: DomainSpec
      - type: ApplicationSpec
        name: application
        default: ApplicationSpec
      - type: InfrastructureSpec
        name: infrastructure
        default: InfrastructureSpec
      - type: InterfaceSpec
        name: interfaces
        default: InterfaceSpec
      - type: ConfigSpec
        name: config
        default: ConfigSpec
      - type: ContainerSpec
        name: container
        default: ContainerSpec
      behaviors:
      - name: to_package_spec
        description: Convert this BoundedContext to a PackageSpec.
        inputs:
        - type: Self
          name: self
        - type: string
          name: project_name
          default: ''
        output:
          type: PackageSpec
      - name: _collect_class_specs_in_ports
        description: Recursively collect class specs from ports packages.
        inputs:
        - type: Self
          name: self
        - type: ClassSpec
          container: map
          name: class_specs
        - type: PackageSpec
          name: package_spec
        output:
          type: None
      - name: from_package_spec
        description: Create a BoundedContext from a PackageSpec.
        inputs:
        - type: Self
          container: type
          name: cls
        - type: PackageSpec
          name: package_spec
        output:
          type: Self
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        - type: string
          name: description
          default: ''
        - type: DomainSpec
          optional: true
          name: domain
        - type: ApplicationSpec
          optional: true
          name: application
        - type: InfrastructureSpec
          optional: true
          name: infrastructure
        - type: ConfigSpec
          optional: true
          name: config
        - type: ContainerSpec
          optional: true
          name: container
        - type: InterfaceSpec
          optional: true
          name: interfaces
        output:
          type: Self
      - name: port_index
        inputs:
        - type: Self
          name: self
        output:
          type: PortSpec
          container: map
      - name: update
        description: Update scalar metadata fields. Preserves internal structure.
        inputs:
        - type: Self
          name: self
        - type: string
          optional: true
          name: description
        output:
          type: None
      - name: get_port_spec
        inputs:
        - type: Self
          name: self
        - type: string
          name: port_name
        output:
          type: PortSpec
      - name: to_test_package_spec
        description: Create test package for bounded context.
        inputs:
        - type: Self
          name: self
        output:
          type: PackageSpec
    - name: ServiceSpec
      description: Specification of a domain service to be generated.
      attributes:
      - type: PascalString
        name: name
      - type: string
        name: description
        default: ''
      - type: AttributeSpecList
        name: dependencies
        default: AttributeSpecList
      - type: MethodSpecList
        name: operations
        default: MethodSpecList
      behaviors:
      - name: to_module_spec
        description: 将 ServiceSpec 转换为 ModuleSpec
        inputs:
        - type: Self
          name: self
        output:
          type: ModuleSpec
      - name: to_package_spec
        description: 将多个 ServiceSpec 转换为一个 'services' 包
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Self
          container: iterable
          name: services
        output:
          type: PackageSpec
      - name: from_module_spec
        description: 将 ModuleSpec 逆向解析为 ServiceSpec
        inputs:
        - type: Self
          container: type
          name: cls
        - type: ModuleSpec
          name: module
        output:
          type: Self
      - name: from_package_spec
        description: 将 'services' 包逆向解析为 ServiceSpec 列表
        inputs:
        - type: Self
          container: type
          name: cls
        - type: PackageSpec
          name: package
        output:
          type: Self
          container: list
      - name: update
        description: Update scalar metadata fields. Preserves internal structure.
        inputs:
        - type: Self
          name: self
        - type: string
          optional: true
          name: description
        output:
          type: None
      - name: to_test_package_spec
        description: Create test package for service with operations that have rules.
        inputs:
        - type: Self
          name: self
        output:
          type: PackageSpec
    - name: EntitySpec
