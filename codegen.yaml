# yaml-language-server: $schema=./codegen.schema.json
name: Codegen
description: ''
contexts:
- name: Shared
  domain:
    enums:
    - name: ContainerType
      members:
      - name: NONE
        value: none
      - name: LIST
        value: list
      - name: SET
        value: set
      - name: MAP
        value: map
      - name: ITERABLE
        value: iterable
      - name: CALLABLE
        value: callable
    - name: PrimitiveType
      description: 通用原语类型，不依赖具体语言。
      members:
      - name: STRING
        value: string
      - name: INTEGER
        value: integer
      - name: FLOAT
        value: float
      - name: BOOLEAN
        value: boolean
      - name: DATETIME
        value: datetime
      - name: UUID
        value: uuid
      - name: ANY
        value: any
    value_objects:
    - name: SnakeString
      behaviors:
      - name: __new__
        inputs:
        - type: any
          name: cls
        - type: string
          name: value
        output:
          type: any
    - name: PascalString
      behaviors:
      - name: __new__
        inputs:
        - type: any
          name: cls
        - type: string
          name: value
        output:
          type: any
    - name: NamingString
      description: 基于 case-converter 的增强型字符串
      behaviors:
      - name: to_pascal
        output:
          type: string
      - name: to_snake
        output:
          type: string
      - name: to_kebab
        output:
          type: string
      - name: to_camel
        output:
          type: string
      - name: to_macro
        output:
          type: string
      - name: __get_pydantic_core_schema__
        inputs:
        - type: any
          name: source_type
        - type: GetCoreSchemaHandler
          name: handler
        output:
          type: core_schema.CoreSchema
    - name: MacroString
      behaviors:
      - name: __new__
        inputs:
        - type: any
          name: cls
        - type: string
          name: value
        output:
          type: any
    ports:
    - name: TemplatePort
      description: Port for generating templates.
      kind: adapter
      operations:
      - name: render
        inputs:
        - type: string
          name: template_path
        - type: any
          container: map
          name: context
        output:
          type: string
    - name: FileSystemPort
      description: Port for interacting with the file system.
      kind: adapter
      operations:
      - name: read_file
        inputs:
        - type: Path
          name: path
        output:
          type: string
      - name: write_file
        inputs:
        - type: Path
          name: path
        - type: string
          name: content
        - type: boolean
          name: overwrite
          default: 'False'
        output:
          type: None
      - name: list_directory_recursively
        inputs:
        - type: Path
          name: path
        output:
          type: Path
          container: iterable
      - name: list_directory_flat
        inputs:
        - type: Path
          name: path
        output:
          type: Path
          container: iterable
      - name: is_directory
        inputs:
        - type: Path
          name: path
        output:
          type: boolean
      - name: is_file
        inputs:
        - type: Path
          name: path
        output:
          type: boolean
      - name: exists
        inputs:
        - type: Path
          name: path
        output:
          type: boolean
  infrastructure:
    implementations:
    - name: OsFileSystem
      implements: FileSystemPort
      technology: os
      description: OS file system adapter for reading/writing files.
- name: Orchestration
  domain:
    enums:
    - name: BuildStatus
      members:
      - name: SUCCESS
        value: SUCCESS
      - name: FAILURE
        value: FAILURE
      - name: WARNING
        value: WARNING
    - name: FileStatus
      members:
      - name: CREATED
        value: CREATED
      - name: UPDATED
        value: UPDATED
      - name: SKIPPED
        value: SKIPPED
      - name: FAILED
        value: FAILED
    value_objects:
    - name: BuildResult
      description: Top-level result object returned by generation use cases.
      attributes:
      - type: Any
        name: model_config
        default: ConfigDict(frozen=False)
      - type: BuildStatus
        name: status
      - type: FileResult
        container: list
        optional: true
        name: files
      - type: BuildStats
        optional: true
        name: stats
      - type: string
        container: list
        optional: true
        name: messages
      behaviors:
      - name: add_file_result
        inputs:
        - type: FileResult
          name: result
        output:
          type: any
    - name: FileResult
      description: Represents the outcome for a single file generation.
      attributes:
      - type: string
        name: path
      - type: FileStatus
        name: status
      - type: string
        optional: true
        name: message
      - type: string
        optional: true
        name: diff
    - name: BuildStats
      description: Aggregated statistics for a build operation.
      attributes:
      - type: Any
        name: model_config
        default: ConfigDict(frozen=False)
      - type: integer
        name: total_files
        default: '0'
      - type: integer
        name: created_count
        default: '0'
      - type: integer
        name: updated_count
        default: '0'
      - type: integer
        name: skipped_count
        default: '0'
      - type: integer
        name: failed_count
        default: '0'
      - type: integer
        name: duration_ms
        default: '0'
      behaviors:
      - name: add_result
        inputs:
        - type: FileResult
          name: result
        output:
          type: any
    services:
    - name: ImplementationMapper
      dependencies:
      - type: AttributeMapper
        optional: true
        name: attribute_mapper
      - type: MethodMapper
        optional: true
        name: method_mapper
      operations:
      - name: to_module_spec
        inputs:
        - type: ImplementationSpec
          name: implementation
        - type: PortSpec
          name: port
        output:
          type: ModuleSpec
      - name: to_implementation
        inputs:
        - type: ModuleSpec
          name: module_spec
        - type: string
          name: technology
        output:
          type: ImplementationSpec
      - name: _get_class_name
        inputs:
        - type: ImplementationSpec
          name: implementation
        output:
          type: string
    - name: EnumMapper
      operations:
      - name: to_python_enum_spec
        inputs:
        - type: EnumSpec
          name: meta_enum
        output:
          type: PythonEnumSpec
      - name: to_enum_spec
        inputs:
        - type: PythonEnumSpec
          name: enum_spec
        output:
          type: EnumSpec
      - name: to_module_spec
        inputs:
        - type: EnumSpec
          container: iterable
          name: enums
        output:
          type: ModuleSpec
      - name: to_meta_enums
        inputs:
        - type: ModuleSpec
          name: module_spec
        output:
          type: EnumSpec
          container: iterable
    - name: ValueObjectMapper
      dependencies:
      - type: AttributeMapper
        optional: true
        name: attribute_mapper
      - type: MethodMapper
        optional: true
        name: method_mapper
      operations:
      - name: to_module_spec
        inputs:
        - type: ValueObjectSpec
          name: value_object
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - type: ValueObjectSpec
          container: iterable
          name: value_objects
        output:
          type: PackageSpec
      - name: module_spec_to_value_objects
        inputs:
        - type: ModuleSpec
          name: module_spec
        output:
          type: ValueObjectSpec
          container: list
      - name: to_value_objects
        inputs:
        - type: PackageSpec
          name: package_spec
        output:
          type: ValueObjectSpec
          container: list
    - name: EntityMapper
      dependencies:
      - type: AttributeMapper
        optional: true
        name: attribute_mapper
      - type: MethodMapper
        optional: true
        name: method_mapper
      operations:
      - name: to_module_spec
        inputs:
        - type: EntitySpec
          name: entity
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - type: EntitySpec
          container: iterable
          name: entities
        output:
          type: PackageSpec
      - name: to_entity
        inputs:
        - type: ModuleSpec
          name: module
        output:
          type: EntitySpec
      - name: to_entities
        inputs:
        - type: PackageSpec
          name: package
        output:
          type: EntitySpec
          container: list
    - name: ContainerMapper
      description: Maps ContainerSpec to PythonGen ClassSpec for generating dependency_injector
        containers.
      operations:
      - name: to_class_spec
        inputs:
        - type: ContainerSpec
          name: container_spec
        - type: BoundedContext
          name: context
        - type: string
          name: class_name
          default: '''Container'''
        output:
          type: ClassSpec
      - name: _create_provider_variable
        inputs:
        - type: PortBinding
          name: binding
        - type: BoundedContext
          name: context
        output:
          type: VariableSpec
          optional: true
      - name: _create_use_case_provider_variable
        inputs:
        - type: UseCaseSpec
          name: use_case
        - type: PortBinding
          container: list
          name: bindings
        output:
          type: VariableSpec
          optional: true
      - name: _create_provider_assignment
        inputs:
        - type: string
          name: implementation_class
        output:
          type: AssignmentSpec
      - name: _to_snake_case
        inputs:
        - type: string
          name: name
        output:
          type: string
      - name: to_module_spec
        inputs:
        - type: ContainerSpec
          name: container_spec
        - type: BoundedContext
          name: context
        - type: string
          name: class_name
          default: '''Container'''
        - type: string
          name: project_name
          default: ''''''
        output:
          type: ModuleSpec
    - name: InterfaceMapper
      description: Interfaces 层代码生成器
      operations:
      - name: to_package_spec
        inputs:
        - type: InterfaceSpec
          name: interfaces
        - type: string
          name: context_name
        - type: UseCaseSpec
          container: list
          name: use_cases
        - type: string
          name: project_name
          default: ''''''
        output:
          type: PackageSpec
      - name: _map_cli_interface
        inputs:
        - type: any
          name: cli_spec
        - type: string
          name: context_name
        - type: UseCaseSpec
          container: map
          name: use_case_index
        - type: string
          name: project_name
          default: ''''''
        output:
          type: PackageSpec
      - name: _map_cli_command
        inputs:
        - type: CliCommandSpec
          name: cmd
        - type: string
          name: context_name
        - type: UseCaseSpec
          container: map
          name: use_case_index
        - type: string
          name: project_name
          default: ''''''
        output:
          type: ModuleSpec
      - name: _create_cli_init_module
        inputs:
        - type: string
          name: context_name
        - type: string
          container: list
          name: function_names
        - type: string
          name: project_name
          default: ''''''
        output:
          type: ModuleSpec
      - name: _map_mcp_interface
        inputs:
        - type: any
          name: mcp_spec
        - type: string
          name: context_name
        - type: UseCaseSpec
          container: map
          name: use_case_index
        - type: string
          name: project_name
          default: ''''''
        output:
          type: PackageSpec
      - name: _map_mcp_tool
        inputs:
        - type: McpToolSpec
          name: tool
        - type: string
          name: context_name
        - type: UseCaseSpec
          container: map
          name: use_case_index
        - type: string
          name: project_name
          default: ''''''
        output:
          type: ModuleSpec
      - name: _create_mcp_init_module
        inputs:
        - type: string
          name: context_name
        - type: string
          container: list
          name: function_names
        - type: string
          name: project_name
          default: ''''''
        output:
          type: ModuleSpec
      - name: _map_http_interface
        inputs:
        - type: any
          name: http_spec
        - type: string
          name: context_name
        - type: UseCaseSpec
          container: map
          name: use_case_index
        - type: string
          name: project_name
          default: ''''''
        output:
          type: PackageSpec
      - name: _map_http_endpoint
        inputs:
        - type: HttpEndpointSpec
          name: endpoint
        - type: string
          name: context_name
        - type: UseCaseSpec
          container: map
          name: use_case_index
        - type: string
          name: project_name
          default: ''''''
        output:
          type: ModuleSpec
      - name: _create_http_init_module
        inputs:
        - type: string
          name: context_name
        - type: string
          container: list
          name: module_names
        - type: string
          name: project_name
          default: ''''''
        output:
          type: ModuleSpec
      - name: _sanitize_identifier
        inputs:
        - type: string
          name: name
        output:
          type: string
      - name: _to_snake_case
        inputs:
        - type: string
          name: name
        output:
          type: string
    - name: DomainMapper
      dependencies:
      - type: AggregateMapper
        optional: true
        name: aggregate_mapper
      - type: EntityMapper
        optional: true
        name: entity_mapper
      - type: ValueObjectMapper
        optional: true
        name: value_object_mapper
      - type: ServiceMapper
        optional: true
        name: service_mapper
      - type: PortMapper
        optional: true
        name: port_mapper
      - type: EnumMapper
        optional: true
        name: enum_mapper
      operations:
      - name: to_package_spec
        inputs:
        - type: DomainSpec
          name: domain
        output:
          type: PackageSpec
      - name: to_domain
        inputs:
        - type: PackageSpec
          name: package_spec
        output:
          type: DomainSpec
    - name: ContextMapper
      dependencies:
      - type: DomainMapper
        optional: true
        name: domain_mapper
      - type: ApplicationMapper
        optional: true
        name: application_mapper
      - type: InfrastructureMapper
        optional: true
        name: infrastructure_mapper
      - type: ConfigMapper
        optional: true
        name: config_mapper
      - type: ContainerMapper
        optional: true
        name: container_mapper
      - type: InterfaceMapper
        optional: true
        name: interface_mapper
      operations:
      - name: to_package_spec
        inputs:
        - type: BoundedContext
          name: context
        - type: string
          name: project_name
          default: ''''''
        output:
          type: PackageSpec
      - name: to_context
        inputs:
        - type: PackageSpec
          name: package_spec
        output:
          type: BoundedContext
      - name: _collect_class_specs_in_ports
        inputs:
        - type: ClassSpec
          container: map
          name: class_specs
        - type: PackageSpec
          name: package_spec
        output:
          type: None
    - name: EntrypointMapper
      description: Entrypoints 代码生成器，聚合所有 Context 的接口
      operations:
      - name: to_package_spec
        inputs:
        - type: BoundedContext
          container: list
          name: contexts
        - type: string
          name: project_name
        output:
          type: PackageSpec
      - name: _create_cli_main
        inputs:
        - type: BoundedContext
          container: list
          name: contexts
        - type: string
          name: project_name
        output:
          type: ModuleSpec
      - name: _create_mcp_main
        inputs:
        - type: BoundedContext
          container: list
          name: contexts
        - type: string
          name: project_name
        output:
          type: ModuleSpec
      - name: _create_http_main
        inputs:
        - type: BoundedContext
          container: list
          name: contexts
        - type: string
          name: project_name
        output:
          type: ModuleSpec
      - name: _to_snake_case
        inputs:
        - type: string
          name: name
        output:
          type: string
    - name: InfrastructureMapper
      dependencies:
      - type: ImplementationMapper
        optional: true
        name: implementation_mapper
      operations:
      - name: to_package_spec
        inputs:
        - type: InfrastructureSpec
          name: infrastructure
        - type: PortSpec
          container: callable
          name: port_finder
        output:
          type: PackageSpec
      - name: to_infrastructure
        inputs:
        - type: PackageSpec
          name: package_spec
        output:
          type: InfrastructureSpec
    - name: AggregateMapper
      dependencies:
      - type: AttributeMapper
        optional: true
        name: attribute_mapper
      - type: MethodMapper
        optional: true
        name: method_mapper
      operations:
      - name: to_module_spec
        inputs:
        - type: AggregateSpec
          name: aggregate
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - type: AggregateSpec
          container: iterable
          name: aggregates
        output:
          type: PackageSpec
      - name: to_aggregate
        inputs:
        - type: ModuleSpec
          name: module
        output:
          type: AggregateSpec
      - name: to_aggregates
        inputs:
        - type: PackageSpec
          name: package
        output:
          type: AggregateSpec
          container: list
    - name: BlueprintMapper
      dependencies:
      - type: ContextMapper
        optional: true
        name: context_mapper
      - type: BootstrapMapper
        optional: true
        name: bootstrap_mapper
      - type: EntrypointMapper
        optional: true
        name: entrypoint_mapper
      operations:
      - name: to_package_spec
        inputs:
        - type: Blueprint
          name: blueprint
        output:
          type: PackageSpec
      - name: to_blueprint
        inputs:
        - type: PackageSpec
          name: package_spec
        output:
          type: Blueprint
    - name: AttributeMapper
      dependencies:
      - type: TypeSystemConverter
        optional: true
        name: type_system_converter
      operations:
      - name: _default_to_assignment
        inputs:
        - type: string
          name: default_value
        output:
          type: AssignmentSpec
      - name: to_variable_spec
        inputs:
        - type: AttributeSpec
          name: attribute
        - type: FieldFlavor
          optional: true
          name: default_field_flavor
          default: None
        output:
          type: VariableSpec
      - name: to_attribute
        inputs:
        - type: VariableSpec
          name: variable_spec
        output:
          type: AttributeSpec
      - name: to_variable_specs
        inputs:
        - type: AttributeSpec
          container: list
          name: attributes
        - type: FieldFlavor
          optional: true
          name: default_field_flavor
          default: None
        output:
          type: VariableSpec
          container: list
      - name: to_attributes
        inputs:
        - type: VariableSpec
          container: list
          name: variable_specs
        output:
          type: AttributeSpec
          container: list
    - name: MethodMapper
      dependencies:
      - type: AttributeMapper
        optional: true
        name: attribute_mapper
      operations:
      - name: to_function_spec
        inputs:
        - type: MethodSpec
          name: method
        - type: FunctionType
          name: function_type
          default: FunctionType.FUNCTION
        - type: boolean
          name: is_abstract
          default: 'False'
        - type: boolean
          name: is_private
          default: 'False'
        - type: string
          optional: true
          name: class_name
          default: None
        output:
          type: FunctionSpec
      - name: to_method
        inputs:
        - type: FunctionSpec
          name: function_spec
        output:
          type: MethodSpec
    - name: BootstrapMapper
      description: Maps BootstrapSpec to PythonGen PackageSpec for generating bootstrap
        code.
      dependencies:
      - type: ConfigMapper
        optional: true
        name: config_mapper
      - type: ContainerMapper
        optional: true
        name: container_mapper
      operations:
      - name: to_package_spec
        inputs:
        - type: Blueprint
          name: blueprint
        output:
          type: PackageSpec
          optional: true
      - name: _create_app_config_module
        inputs:
        - type: ConfigSpec
          name: bootstrap_config
        - type: BoundedContext
          container: list
          name: contexts
        output:
          type: ModuleSpec
      - name: _create_app_container_module
        inputs:
        - type: ContainerSpec
          name: bootstrap_container
        - type: BoundedContext
          container: list
          name: contexts
        output:
          type: ModuleSpec
      - name: _to_snake_case
        inputs:
        - type: string
          name: name
        output:
          type: string
    - name: PortMapper
      dependencies:
      - type: AttributeMapper
        optional: true
        name: attribute_mapper
      - type: MethodMapper
        optional: true
        name: method_mapper
      operations:
      - name: to_module_spec
        inputs:
        - type: PortSpec
          name: port
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - type: PortSpec
          container: iterable
          name: ports
        output:
          type: PackageSpec
      - name: to_port
        inputs:
        - type: ModuleSpec
          name: module_spec
        output:
          type: PortSpec
      - name: to_ports
        inputs:
        - type: PackageSpec
          name: package_spec
        output:
          type: PortSpec
          container: list
    - name: TypeSystemConverter
      description: 通用类型系统与 Python 类型系统的双向转换器
      operations:
      - name: to_python_annotation
        inputs:
        - type: TypeDefinition
          name: type_def
        output:
          type: TypeAnnotationSpec
      - name: from_python_annotation
        inputs:
        - type: TypeAnnotationSpec
          optional: true
          name: annotation
        output:
          type: Any
          custom_type_string: tuple[str, ContainerType, bool, str | None]
      - name: _apply_container
        inputs:
        - type: string
          name: core_type
        - type: ContainerType
          name: container
        output:
          type: TypeAnnotationSpec
      - name: _make_optional
        inputs:
        - type: TypeAnnotationSpec
          name: annotation
        output:
          type: TypeAnnotationSpec
      - name: _extract_optional
        inputs:
        - type: TypeAnnotationSpec
          name: annotation
        output:
          type: Any
          custom_type_string: tuple[bool, TypeAnnotationSpec]
      - name: _extract_container_and_type
        inputs:
        - type: TypeAnnotationSpec
          name: annotation
        output:
          type: Any
          custom_type_string: tuple[ContainerType, str]
    - name: UseCaseMapper
      dependencies:
      - type: AttributeMapper
        optional: true
        name: attribute_mapper
      - type: MethodMapper
        optional: true
        name: method_mapper
      operations:
      - name: to_module_spec
        inputs:
        - type: UseCaseSpec
          name: use_case
        output:
          type: ModuleSpec
      - name: to_use_case
        inputs:
        - type: ModuleSpec
          name: module_spec
        output:
          type: UseCaseSpec
    - name: InterfaceReverseMapper
      description: Interfaces Reverse 解析器，从目录和文件名推断接口定义
      operations:
      - name: to_interface_spec
        inputs:
        - type: PackageSpec
          name: interfaces_pkg
        - type: UseCaseSpec
          container: list
          name: use_cases
        output:
          type: InterfaceSpec
      - name: _parse_cli_interface
        inputs:
        - type: PackageSpec
          name: cli_pkg
        - type: UseCaseSpec
          container: map
          name: use_case_index
        output:
          type: CliInterfaceSpec
      - name: _parse_mcp_interface
        inputs:
        - type: PackageSpec
          name: mcp_pkg
        - type: UseCaseSpec
          container: map
          name: use_case_index
        output:
          type: McpInterfaceSpec
      - name: _parse_http_interface
        inputs:
        - type: PackageSpec
          name: http_pkg
        - type: UseCaseSpec
          container: map
          name: use_case_index
        output:
          type: HttpInterfaceSpec
      - name: _infer_use_case_from_suite
        inputs:
        - type: string
          name: suite
        - type: UseCaseSpec
          container: map
          name: use_case_index
        output:
          type: string
          optional: true
      - name: _parse_route_decorator
        inputs:
        - type: string
          container: list
          name: decorators
        output:
          type: Any
          custom_type_string: tuple[str | None, str | None]
    - name: ApplicationMapper
      dependencies:
      - type: UseCaseMapper
        optional: true
        name: use_case_mapper
      - type: PortMapper
        optional: true
        name: port_mapper
      operations:
      - name: to_package_spec
        inputs:
        - type: ApplicationSpec
          name: application
        output:
          type: PackageSpec
      - name: to_application
        inputs:
        - type: PackageSpec
          name: package_spec
        output:
          type: ApplicationSpec
    - name: ServiceMapper
      dependencies:
      - type: AttributeMapper
        optional: true
        name: attribute_mapper
      - type: MethodMapper
        optional: true
        name: method_mapper
      operations:
      - name: to_module_spec
        inputs:
        - type: ServiceSpec
          name: service
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - type: ServiceSpec
          container: iterable
          name: services
        output:
          type: PackageSpec
      - name: to_service
        inputs:
        - type: ModuleSpec
          name: module_spec
        output:
          type: ServiceSpec
      - name: to_services
        inputs:
        - type: PackageSpec
          name: package_spec
        output:
          type: ServiceSpec
          container: list
    - name: ConfigMapper
      description: Maps ConfigSpec to PythonGen ClassSpec for generating Pydantic
        BaseSettings classes.
      operations:
      - name: to_class_spec
        inputs:
        - type: ConfigSpec
          name: config_spec
        - type: string
          optional: true
          name: class_name
          default: None
        output:
          type: ClassSpec
      - name: _map_field_to_variable
        inputs:
        - type: ConfigFieldSpec
          name: field_spec
        output:
          type: VariableSpec
      - name: _create_model_config_attribute
        inputs:
        - type: ConfigSpec
          name: config_spec
        output:
          type: VariableSpec
      - name: to_module_spec
        inputs:
        - type: ConfigSpec
          name: config_spec
        - type: string
          optional: true
          name: class_name
          default: None
        output:
          type: ModuleSpec
  application:
    use_cases:
    - name: GenerateProject
      kind: command
      dependencies:
      - type: LoadBlueprint
        name: loader
      - type: GeneratePackage
        name: generator
      - type: BlueprintMapper
        optional: true
        name: mapper
      command:
        attributes:
        - type: boolean
          name: overwrite
        - type: string
          optional: true
          name: node
        - type: string
          name: root_path
          default: ''''''
        - type: boolean
          name: generate_tests
          default: 'False'
      result:
        attributes:
        - type: BuildResult
          name: result
    - name: GenerateBlueprint
      kind: command
      dependencies:
      - type: ParsePackage
        name: parser
      - type: BlueprintStorage
        name: storage
      - type: BlueprintMapper
        optional: true
        name: mapper
      command:
        attributes:
        - type: Path
          name: path
      result:
        attributes:
        - type: string
          name: result
- name: Entrypoints
- name: PythonGen
  domain:
    enums:
    - name: AssignmentFlavor
      members:
      - name: NONE
        value: none
      - name: LITERAL
        value: literal
      - name: SYMBOL
        value: symbol
      - name: CALL
        value: call
      - name: DICT
        value: dict
      - name: LIST
        value: list
      - name: RAW_CODE
        value: raw_code
      - name: CODE
        value: code
    - name: FunctionType
      members:
      - name: CLASS_METHOD
        value: class_method
      - name: STATIC_METHOD
        value: static_method
      - name: INSTANCE_METHOD
        value: instance_method
      - name: FUNCTION
        value: function
    - name: FieldFlavor
      members:
      - name: PYDANTIC
        value: pydantic
      - name: DATACLASS
        value: dataclass
    value_objects:
    - name: ModuleAssignmentSpec
      description: Represents a top-level assignment in a module.
      attributes:
      - type: string
        name: name
      - type: string
        name: value
      - type: string
        optional: true
        name: type_annotation
        default: None
      behaviors:
      - name: create
        inputs:
        - type: string
          name: name
        - type: string
          name: value
        - type: string
          optional: true
          name: type_annotation
          default: None
        output:
          type: ModuleAssignmentSpec
    - name: RawCodeSpec
      description: Represents a block of raw source code.
      attributes:
      - type: string
        name: code
      behaviors:
      - name: create
        inputs:
        - type: string
          name: code
        output:
          type: RawCodeSpec
    - name: ClassSpec
      description: Represents a class in a Python module.
      attributes:
      - type: PascalString
        name: name
      - type: string
        name: description
        default: ''''''
      - type: string
        container: list
        optional: true
        name: decorators
      - type: string
        container: list
        optional: true
        name: inheritance
      - type: VariableSpec
        container: list
        optional: true
        name: attributes
      - type: FunctionSpec
        container: list
        optional: true
        name: methods
      behaviors:
      - name: create
        inputs:
        - type: string
          name: name
        - type: string
          name: description
          default: ''''''
        - type: string
          container: list
          optional: true
          name: decorators
          default: None
        - type: string
          container: list
          optional: true
          name: inheritance
          default: None
        - type: VariableSpec
          container: list
          optional: true
          name: attributes
          default: None
        - type: FunctionSpec
          container: list
          optional: true
          name: methods
          default: None
        output:
          type: ClassSpec
      - name: create_value_object
        output:
          type: ClassSpec
      - name: create_aggregate
        output:
          type: ClassSpec
      - name: create_entity
        output:
          type: ClassSpec
      - name: create_event
        output:
          type: ClassSpec
      - name: _create_base_model
        inputs:
        - type: string
          name: name
        output:
          type: ClassSpec
      - name: get_required_types
        output:
          type: string
          container: set
      - name: merge
        inputs:
        - type: ClassSpec
          name: other
        output:
          type: ClassSpec
    - name: FunctionSpec
      description: Represents a function in a Python module.
      attributes:
      - type: SnakeString
        name: name
      - type: string
        container: list
        optional: true
        name: decorators
      - type: VariableSpec
        container: list
        optional: true
        name: parameters
      - type: TypeAnnotationSpec
        name: return_annotation
      - type: string
        name: suite
        default: ''''''
      - type: FunctionType
        name: function_type
        default: FunctionType.FUNCTION
      - type: boolean
        name: is_private
        default: 'False'
      - type: string
        optional: true
        name: description
        default: None
      behaviors:
      - name: create
        inputs:
        - type: string
          name: name
        - type: TypeAnnotationSpec
          name: return_annotation
        - type: string
          container: list
          optional: true
          name: decorators
          default: None
        - type: VariableSpec
          container: list
          optional: true
          name: parameters
          default: None
        - type: string
          name: suite
          default: ''''''
        - type: FunctionType
          name: function_type
          default: FunctionType.FUNCTION
        - type: boolean
          name: is_private
          default: 'False'
        - type: string
          optional: true
          name: description
          default: None
        output:
          type: any
      - name: get_required_types
        output:
          type: string
          container: set
      - name: is_instance_method
        output:
          type: boolean
      - name: merge
        inputs:
        - type: FunctionSpec
          name: other
        output:
          type: FunctionSpec
      - name: is_init_method
        output:
          type: boolean
    - name: TypeAnnotationSpec
      description: Represents a type annotation.
      attributes:
      - type: string
        name: name
      - type: TypeAnnotationSpec
        container: list
        optional: true
        name: args
      behaviors:
      - name: render
        output:
          type: string
      - name: get_all_referenced_names
        output:
          type: string
          container: set
      - name: is_nullable
        output:
          type: boolean
      - name: from_raw
        inputs:
        - type: string
          name: raw_type
        output:
          type: TypeAnnotationSpec
    - name: ReferenceSpec
      description: 引用一个已存在的变量或符号 (对应 AST Name节点)。
      attributes:
      - type: string
        name: name
    - name: LiteralSpec
      description: 基础类型的字面量值 (对应 AST Constant节点)。
      attributes:
      - type: any
        name: value
    - name: PythonEnumMemberSpec
      description: Represents an enum member in a Python module.
      attributes:
      - type: MacroString
        name: name
      - type: Any
        optional: true
        custom_type_string: str | int | None
        name: value
      - type: string
        optional: true
        name: description
      behaviors:
      - name: create
        inputs:
        - type: string
          name: name
        - type: Any
          custom_type_string: str | int | None
          name: value
          default: None
        - type: string
          name: description
          default: ''''''
        output:
          type: PythonEnumMemberSpec
    - name: AssignmentSpec
      description: 描述变量的赋值结构 (RHS)。 对应 AST 中的 value 节点。
      attributes:
      - type: AssignmentFlavor
        name: flavor
      - type: LiteralSpec
        optional: true
        name: literal
      - type: ReferenceSpec
        optional: true
        name: reference
      - type: CallSpec
        optional: true
        name: call
      - type: AssignmentSpec
        container: list
        optional: true
        name: list_items
      - type: AssignmentSpec
        container: map
        optional: true
        name: dict_items
      - type: string
        optional: true
        name: code
      behaviors:
      - name: from_code
        inputs:
        - type: string
          name: code
        output:
          type: AssignmentSpec
      - name: from_literal
        inputs:
        - type: any
          name: value
        output:
          type: AssignmentSpec
      - name: from_symbol
        inputs:
        - type: string
          name: symbol
        output:
          type: AssignmentSpec
      - name: from_call
        inputs:
        - type: string
          name: func_name
        - type: AssignmentSpec
          container: list
          optional: true
          name: args
          default: None
        - type: AssignmentSpec
          container: map
          optional: true
          name: kwargs
          default: None
        output:
          type: AssignmentSpec
      - name: get_required_types
        output:
          type: string
          container: set
    - name: CallSpec
      description: 函数调用或类实例化 (对应 AST Call节点)。
      attributes:
      - type: string
        name: callee
      - type: AssignmentSpec
        container: list
        name: args
      - type: AssignmentSpec
        container: map
        name: kwargs
    - name: TypeSpec
      description: 描述变量的类型注解结构 (LHS)。 对应 AST 中的 annotation 节点。
      attributes:
      - type: string
        name: core_type
      - type: ContainerType
        name: container
      - type: boolean
        name: nullable
    - name: ImportedName
      description: Represents a name imported from another module.
      attributes:
      - type: string
        name: name
      - type: string
        optional: true
        name: alias
        default: None
      behaviors:
      - name: render
        output:
          type: string
    - name: ModuleSpec
      description: Represents a Python module.
      attributes:
      - type: SnakeString
        name: name
      - type: FunctionSpec
        container: list
        optional: true
        name: functions
      - type: ClassSpec
        container: list
        optional: true
        name: classes
      - type: ImportFromSpec
        container: list
        optional: true
        name: imports
      - type: PythonEnumSpec
        container: list
        optional: true
        name: enums
      - type: ModuleAssignmentSpec
        container: list
        optional: true
        name: assignments
      - type: RawCodeSpec
        container: list
        optional: true
        name: extra_code
      behaviors:
      - name: create
        inputs:
        - type: string
          name: name
        - type: FunctionSpec
          container: list
          optional: true
          name: functions
          default: None
        - type: ClassSpec
          container: list
          optional: true
          name: classes
          default: None
        - type: ImportFromSpec
          container: list
          optional: true
          name: imports
          default: None
        - type: PythonEnumSpec
          container: list
          optional: true
          name: enums
          default: None
        - type: ModuleAssignmentSpec
          container: list
          optional: true
          name: assignments
          default: None
        - type: RawCodeSpec
          container: list
          optional: true
          name: extra_code
          default: None
        output:
          type: ModuleSpec
      - name: create_shared_models
        output:
          type: ModuleSpec
      - name: create_shared_events
        output:
          type: ModuleSpec
      - name: get_init_module
        output:
          type: ModuleSpec
      - name: filename
        output:
          type: string
      - name: is_init_module
        output:
          type: boolean
      - name: is_match_name
        inputs:
        - type: string
          name: name
        output:
          type: boolean
      - name: get_required_types
        output:
          type: string
          container: set
      - name: has_class
        inputs:
        - type: string
          name: class_name
        output:
          type: boolean
      - name: has_function
        inputs:
        - type: string
          name: function_name
        output:
          type: boolean
      - name: has_class_or_function
        inputs:
        - type: string
          name: name
        output:
          type: boolean
      - name: collect_class_spec
        output:
          type: ClassSpec
          container: map
      - name: merge
        inputs:
        - type: ModuleSpec
          name: other
        output:
          type: ModuleSpec
    - name: PackageSpec
      description: Represents a Python package.
      attributes:
      - type: SnakeString
        name: name
      - type: ModuleSpec
        container: list
        optional: true
        name: modules
      - type: PackageSpec
        container: list
        optional: true
        name: sub_packages
      behaviors:
      - name: create
        inputs:
        - type: string
          name: name
        - type: ModuleSpec
          container: list
          optional: true
          name: modules
          default: None
        - type: PackageSpec
          container: list
          optional: true
          name: sub_packages
          default: None
        output:
          type: any
      - name: is_empty
        output:
          type: boolean
      - name: get_global_registry
        inputs:
        - type: string
          name: root_path
          default: ''''''
        output:
          type: string
          container: map
      - name: _build_symbol_table
        inputs:
        - type: string
          name: root_path
        - type: string
          container: map
          name: table
        output:
          type: any
      - name: collect_class_spec
        output:
          type: ClassSpec
          container: map
      - name: merge
        inputs:
        - type: PackageSpec
          name: other
        output:
          type: PackageSpec
    - name: ImportFromSpec
      description: Represents an import statement from another module.
      attributes:
      - type: string
        name: module
      - type: Any
        custom_type_string: frozenset[ImportedName]
        name: names
      - type: boolean
        name: type_checking
        default: 'False'
      - type: integer
        name: level
        default: '0'
      behaviors:
      - name: create
        inputs:
        - type: string
          name: module
        - type: string
          container: iterable
          name: names
        - type: boolean
          name: type_checking
          default: 'False'
        - type: integer
          name: level
          default: '0'
        output:
          type: ImportFromSpec
      - name: has_name
        inputs:
        - type: string
          name: name
        output:
          type: boolean
      - name: add_name
        inputs:
        - type: string
          name: name
        output:
          type: ImportFromSpec
      - name: render
        output:
          type: string
      - name: render_from_expression
        output:
          type: string
      - name: render_names
        output:
          type: string
      - name: merge
        inputs:
        - type: ImportFromSpec
          name: other
        output:
          type: ImportFromSpec
    - name: VariableSpec
      description: '对应 Python 代码中的 name: type_spec = assignment_spec'
      attributes:
      - type: SnakeString
        name: name
      - type: TypeAnnotationSpec
        optional: true
        name: type_spec
      - type: AssignmentSpec
        optional: true
        name: assignment
      behaviors:
      - name: create
        inputs:
        - type: string
          name: name
        - type: TypeAnnotationSpec
          optional: true
          name: type_spec
        - type: AssignmentSpec
          optional: true
          name: assignment
          default: None
        output:
          type: VariableSpec
      - name: get_required_types
        output:
          type: string
          container: set
    - name: PythonEnumSpec
      description: Represents an enum in a Python module.
      attributes:
      - type: PascalString
        name: name
      - type: string
        optional: true
        name: description
      - type: string
        container: list
        optional: true
        name: decorators
      - type: string
        optional: true
        name: base_class
      - type: PythonEnumMemberSpec
        container: list
        optional: true
        name: members
      behaviors:
      - name: create
        inputs:
        - type: string
          name: name
        - type: string
          name: description
          default: ''''''
        - type: string
          container: list
          optional: true
          name: decorators
          default: None
        - type: string
          name: base_class
          default: '''Enum'''
        - type: PythonEnumMemberSpec
          container: list
          optional: true
          name: members
          default: None
        output:
          type: PythonEnumSpec
      - name: get_required_types
        output:
          type: string
          container: set
    services:
    - name: DependencyResolver
      dependencies:
      - type: string
        container: map
        name: global_registry
      operations:
      - name: build_from_package_spec
        inputs:
        - type: PackageSpec
          name: package_spec
        - type: string
          name: root_path
          default: ''''''
        output:
          type: DependencyResolver
      - name: resolve_module
        inputs:
        - type: ModuleSpec
          name: module_spec
        output:
          type: ImportFromSpec
          container: iterable
    - name: PythonSyntaxTranslator
      description: Bidirectional translator between Python source code and PackageSpec.
      dependencies:
      - type: SourceCodePort
        name: source_code_port
      - type: FileSystemPort
        name: file_system_port
      operations:
      - name: to_package_spec
        inputs:
        - type: Path
          name: package_path
        output:
          type: PackageSpec
      - name: to_code
        inputs:
        - type: ModuleSpec
          name: module_spec
        - type: ImportFromSpec
          container: iterable
          name: imports
        output:
          type: string
      - name: generate_source_tree
        inputs:
        - type: PackageSpec
          name: package_spec
        - type: string
          optional: true
          name: target_node
        - type: string
          name: root_path
          default: ''''''
        output:
          type: Any
          custom_type_string: dict[Path, str]
      - name: _collect_files_recursively
        inputs:
        - type: PackageSpec
          name: current_spec
        - type: DependencyResolver
          name: resolver
        - type: Any
          custom_type_string: dict[Path, str]
          name: output_dict
        - type: Path
          name: current_path
        - type: string
          optional: true
          name: target_node
        output:
          type: None
    ports:
    - name: SourceCodePort
      description: Port for bidirectional translation between Spec objects and Python
        source code.
      kind: adapter
      operations:
      - name: render_module
        inputs:
        - type: ModuleSpec
          name: module_spec
        - type: ImportFromSpec
          container: list
          name: imports
        output:
          type: string
      - name: parse_module
        inputs:
        - type: string
          name: source_code
        - type: string
          name: module_name
        output:
          type: ModuleSpec
    - name: CodeFormatter
      description: Formats Python source code.
      kind: adapter
      operations:
      - name: format_code
        inputs:
        - type: string
          name: code
        output:
          type: string
  application:
    use_cases:
    - name: ParsePackage
      kind: query
      dependencies:
      - type: PythonSyntaxTranslator
        name: translator
      query:
        attributes:
        - type: Path
          name: package_path
      result:
        attributes:
        - type: PackageSpec
          name: package_spec
    - name: GenerateSchemaJson
      kind: command
      dependencies:
      - type: FileSystemPort
        name: file_system_port
    - name: GeneratePackage
      kind: command
      dependencies:
      - type: FileSystemPort
        name: file_system_port
      - type: PythonSyntaxTranslator
        name: translator
      - type: CodeFormatter
        name: code_formatter
      command:
        attributes:
        - type: PackageSpec
          name: package_spec
        - type: boolean
          name: overwrite
        - type: string
          optional: true
          name: node
        - type: string
          name: root_path
          default: ''''''
      result:
        attributes:
        - type: BuildResult
          name: result
  infrastructure:
    implementations:
    - name: AstTranslator
      implements: SourceCodePort
      technology: ast
      description: AST-based implementation of SourceCodePort.
    - name: BlackCodeFormatter
      implements: CodeFormatter
      technology: black
- name: DomainDefinition
  domain:
    enums:
    - name: PortType
      members:
      - name: ADAPTER
        value: adapter
      - name: REPOSITORY
        value: repository
      - name: CLIENT
        value: client
      - name: PROVIDER
        value: provider
    - name: MappingDirection
      members:
      - name: ONE_WAY
        value: one_way
      - name: TWO_WAY
        value: two_way
    - name: UseCaseKind
      members:
      - name: COMMAND
        value: command
      - name: QUERY
        value: query
    - name: TestMockStrategy
      members:
      - name: TEST
        value: 0
      - name: UNITTEST
        value: unittest
      - name: PYTEST
        value: pytest
    value_objects:
    - name: UseCaseSpec
      description: Specification of a use case to be generated.
      attributes:
      - type: PascalString
        name: name
      - type: UseCaseKind
        name: kind
      - type: AttributeSpec
        container: list
        optional: true
        name: dependencies
      - type: string
        optional: true
        name: description
      - type: DataContractSpec
        optional: true
        name: command
      - type: DataContractSpec
        optional: true
        name: query
      - type: DataContractSpec
        optional: true
        name: result
      behaviors:
      - name: create
        inputs:
        - type: string
          name: name
        - type: Any
          custom_type_string: Union[str, UseCaseKind]
          name: kind
        - type: AttributeSpec
          container: list
          optional: true
          name: dependencies
          default: None
        - type: string
          name: description
          default: ''''''
        - type: DataContractSpec
          optional: true
          name: command
          default: None
        - type: DataContractSpec
          optional: true
          name: query
          default: None
        - type: DataContractSpec
          optional: true
          name: result
          default: None
        output:
          type: any
    - name: ApplicationSpec
      description: Specification of an application to be generated.
      attributes:
      - type: UseCaseSpec
        container: list
        optional: true
        name: use_cases
      - type: PortSpec
        container: list
        optional: true
        name: ports
      - type: ServiceSpec
        container: list
        optional: true
        name: services
    - name: InterfaceSpec
      description: 接口层总规范
      attributes:
      - type: CliInterfaceSpec
        optional: true
        name: cli
        default: None
      - type: McpInterfaceSpec
        optional: true
        name: mcp
        default: None
      - type: HttpInterfaceSpec
        optional: true
        name: http
        default: None
    - name: EnumMemberSpec
      description: Specification of an enum member to be generated.
      attributes:
      - type: MacroString
        name: name
      - type: Any
        optional: true
        custom_type_string: str | int | None
        name: value
      - type: string
        optional: true
        name: description
    - name: ValueObjectSpec
      description: Specification of a value object to be generated.
      attributes:
      - type: PascalString
        name: name
      - type: string
        optional: true
        name: description
      - type: AttributeSpec
        container: list
        optional: true
        name: attributes
      - type: MethodSpec
        container: list
        optional: true
        name: behaviors
    - name: DataContractSpec
      description: Generic data contract specification for use case command/query/result.
      attributes:
      - type: string
        optional: true
        name: name
      - type: string
        optional: true
        name: description
      - type: AttributeSpec
        container: list
        optional: true
        name: attributes
    - name: InfrastructureSpec
      description: Specification of an infrastructure to be generated.
      attributes:
      - type: ImplementationSpec
        container: list
        optional: true
        name: implementations
    - name: ContainerSpec
      description: Specification for a container (dependency injection).
      attributes:
      - type: PortBinding
        container: list
        optional: true
        name: bindings
    - name: MethodOutput
      description: Specification of the output of a method.
    - name: MapperSpec
      description: Base class for value object mappers.
      attributes:
      - type: string
        name: source
      - type: string
        name: target
      - type: MappingDirection
        name: direction
    - name: PortBinding
      description: Binding between a port and an adapter.
      attributes:
      - type: string
        name: port
      - type: string
        name: implementation
    - name: ConfigFieldSpec
      description: Specification for a single configuration field.
      attributes:
      - type: SnakeString
        name: name
      - type: string
        name: type
      - type: string
        optional: true
        name: default
      - type: string
        name: description
        default: ''''''
      - type: string
        optional: true
        name: env_var
    - name: ImplementationSpec
      description: Specification of an implementation to be generated.
      attributes:
      - type: PascalString
        optional: true
        name: name
      - type: PascalString
        name: implements
      - type: SnakeString
        name: technology
      - type: string
        optional: true
        name: description
      - type: AttributeSpec
        container: list
        optional: true
        name: attributes
      - type: MethodSpec
        container: list
        optional: true
        name: private_methods
      behaviors:
      - name: create
        inputs:
        - type: string
          name: name
        - type: string
          name: implements
        - type: string
          name: technology
        - type: string
          name: description
          default: ''''''
        - type: AttributeSpec
          container: list
          optional: true
          name: attributes
          default: None
        - type: MethodSpec
          container: list
          optional: true
          name: private_methods
          default: None
        output:
          type: any
    - name: Blueprint
      description: Root of the generation model. Represents the entire project definition.
      attributes:
      - type: PascalString
        name: name
      - type: string
        name: description
      - type: string
        optional: true
        name: layout
      - type: BoundedContext
        container: list
        optional: true
        name: contexts
      - type: BootstrapSpec
        optional: true
        name: bootstrap
      behaviors:
      - name: create
        inputs:
        - type: Any
          custom_type_string: Union[str, PascalString]
          name: name
        - type: string
          name: description
        - type: string
          name: layout
          default: ''''''
        - type: BoundedContext
          container: list
          optional: true
          name: contexts
          default: None
        - type: BootstrapSpec
          optional: true
          name: bootstrap
          default: None
        output:
          type: any
    - name: CliCommandSpec
      description: CLI 命令规范
      attributes:
      - type: string
        name: name
      - type: string
        name: use_case
      - type: string
        optional: true
        name: description
    - name: MethodSpec
      description: Standard specification for a class method.
      attributes:
      - type: SnakeString
        name: name
      - type: string
        optional: true
        name: description
      - type: AttributeSpec
        container: list
        optional: true
        name: inputs
      - type: MethodOutput
        name: output
      behaviors:
      - name: create
        inputs:
        - type: string
          name: name
        - type: AttributeSpec
          container: list
          name: inputs
        - type: MethodOutput
          name: output
        output:
          type: any
    - name: McpInterfaceSpec
      description: MCP 接口层规范
      attributes:
      - type: McpToolSpec
        container: list
        optional: true
        name: tools
    - name: DomainSpec
      description: Specification of a domain to be generated.
      attributes:
      - type: AggregateSpec
        container: list
        optional: true
        name: aggregates
      - type: EnumSpec
        container: list
        optional: true
        name: enums
      - type: ValueObjectSpec
        container: list
        optional: true
        name: value_objects
      - type: EntitySpec
        container: list
        optional: true
        name: entities
      - type: ServiceSpec
        container: list
        optional: true
        name: services
      - type: PortSpec
        container: list
        optional: true
        name: ports
    - name: BoundedContext
      description: A logical boundary within the system.
      attributes:
      - type: PascalString
        name: name
      - type: string
        optional: true
        name: description
      - type: DomainSpec
        optional: true
        name: domain
      - type: ApplicationSpec
        optional: true
        name: application
      - type: InfrastructureSpec
        optional: true
        name: infrastructure
      - type: ConfigSpec
        optional: true
        name: config
      - type: ContainerSpec
        optional: true
        name: container
      - type: InterfaceSpec
        optional: true
        name: interfaces
      behaviors:
      - name: create
        inputs:
        - type: string
          name: name
        - type: string
          name: description
          default: ''''''
        - type: DomainSpec
          optional: true
          name: domain
          default: None
        - type: ApplicationSpec
          optional: true
          name: application
          default: None
        - type: InfrastructureSpec
          optional: true
          name: infrastructure
          default: None
        - type: ConfigSpec
          optional: true
          name: config
          default: None
        - type: ContainerSpec
          optional: true
          name: container
          default: None
        - type: InterfaceSpec
          optional: true
          name: interfaces
          default: None
        output:
          type: any
      - name: port_index
        output:
          type: PortSpec
          container: map
      - name: get_port_spec
        inputs:
        - type: string
          name: port_name
        output:
          type: PortSpec
    - name: TypeDefinition
      description: 类型定义的公共部分，被 AttributeSpec 和 MethodOutput 共同继承。
      attributes:
      - type: string
        name: type
      - type: ContainerType
        name: container
        default: ContainerType.NONE
      - type: boolean
        optional: true
        name: optional
      - type: string
        optional: true
        name: custom_type_string
    - name: ServiceSpec
      description: Specification of a domain service to be generated.
      attributes:
      - type: PascalString
        name: name
      - type: string
        optional: true
        name: description
      - type: AttributeSpec
        container: list
        optional: true
        name: dependencies
      - type: MethodSpec
        container: list
        optional: true
        name: operations
    - name: CliInterfaceSpec
      description: CLI 接口层规范
      attributes:
      - type: CliCommandSpec
        container: list
        optional: true
        name: commands
    - name: HttpEndpointSpec
      description: HTTP Endpoint 规范
      attributes:
      - type: string
        name: path
      - type: string
        name: method
      - type: string
        name: use_case
      - type: string
        optional: true
        name: description
    - name: EntitySpec
      description: Specification of an entity.
      attributes:
      - type: PascalString
        name: name
      - type: string
        optional: true
        name: description
      - type: AttributeSpec
        container: list
        optional: true
        name: attributes
      - type: MethodSpec
        container: list
        optional: true
        name: behaviors
    - name: AttributeSpec
      description: Standard specification for a class attribute.
      attributes:
      - type: SnakeString
        name: name
      - type: string
        optional: true
        name: description
      - type: string
        optional: true
        name: default
      behaviors:
      - name: create
        inputs:
        - type: string
          name: name
        - type: string
          name: type
        - type: boolean
          name: optional
          default: 'False'
        output:
          type: any
    - name: PortSpec
      description: Specification of a domain port to be generated.
      attributes:
      - type: PascalString
        name: name
      - type: string
        optional: true
        name: description
      - type: PortType
        name: kind
      - type: PascalString
        optional: true
        name: aggregate
        default: None
      - type: MethodSpec
        container: list
        optional: true
        name: operations
      behaviors:
      - name: create
        inputs:
        - type: string
          name: name
        - type: Any
          custom_type_string: Union[PortType, str]
          name: kind
        - type: string
          name: description
          default: ''''''
        - type: string
          optional: true
          name: aggregate
          default: None
        - type: MethodSpec
          container: list
          optional: true
          name: operations
          default: None
        output:
          type: PortSpec
      - name: get_final_operations
        output:
          type: MethodSpec
          container: list
      - name: get_save_method_spec
        output:
          type: MethodSpec
          optional: true
      - name: get_delete_method_spec
        output:
          type: MethodSpec
          optional: true
      - name: get_find_by_id_method_spec
        output:
          type: MethodSpec
          optional: true
    - name: EnumSpec
      description: Specification of an enum to be generated.
      attributes:
      - type: PascalString
        name: name
      - type: string
        optional: true
        name: description
      - type: EnumMemberSpec
        container: list
        name: members
    - name: AggregateSpec
      description: Specification of a domain aggregate to be generated.
      attributes:
      - type: PascalString
        name: name
      - type: string
        optional: true
        name: description
      - type: AttributeSpec
        container: list
        optional: true
        name: attributes
      - type: MethodSpec
        container: list
        optional: true
        name: behaviors
    - name: BootstrapSpec
      description: Specification of the bootstrap configuration.
      attributes:
      - type: ConfigSpec
        optional: true
        name: config
      - type: ContainerSpec
        optional: true
        name: container
    - name: HttpInterfaceSpec
      description: HTTP 接口层规范
      attributes:
      - type: HttpEndpointSpec
        container: list
        optional: true
        name: endpoints
    - name: ConfigSpec
      description: Specification for a configuration object (AppSettings or ContextSettings).
      attributes:
      - type: PascalString
        optional: true
        name: class_name
      - type: string
        name: env_prefix
        default: ''''''
      - type: string
        optional: true
        name: env_file
      - type: ConfigFieldSpec
        container: list
        optional: true
        name: fields
    - name: McpToolSpec
      description: MCP Tool 规范
      attributes:
      - type: string
        name: name
      - type: string
        name: use_case
      - type: string
        optional: true
        name: description
    services:
    - name: BlueprintPathResolver
      description: "Parses path expressions and resolves them against Blueprint/Pydantic\
        \ models.\n\nPath syntax:\n- Dot notation: \"contexts.sales\" \n- Index notation:\
        \ \"contexts[0]\"\n- Mixed: \"contexts[0].aggregates.Order\"\n- Field access\
        \ by name in list: \"contexts.DomainDefinition\" (finds by 'name' field)"
      dependencies:
      - type: Any
        name: _SEGMENT_PATTERN
        default: re.compile('([a-zA-Z_][a-zA-Z0-9_]*)?(?:\\[(\\d+)\\])?')
      operations:
      - name: parse
        inputs:
        - type: string
          name: path
        output:
          type: PathSegment
          container: list
      - name: resolve
        inputs:
        - type: any
          name: obj
        - type: string
          name: path
        output:
          type: any
      - name: _resolve_segments
        inputs:
        - type: any
          name: obj
        - type: PathSegment
          container: list
          name: segments
        output:
          type: any
      - name: _get_segment_value
        inputs:
        - type: any
          name: obj
        - type: PathSegment
          name: segment
        output:
          type: any
      - name: _access_by_name
        inputs:
        - type: any
          name: obj
        - type: string
          name: name
        output:
          type: any
      - name: _get_item_name
        inputs:
        - type: any
          name: item
        output:
          type: string
          optional: true
    - name: ComponentLocator
      description: Responsible for finding any component within a BoundedContext.
      dependencies:
      - type: Any
        name: _FIND_HANDLERS
        default: '{''aggregate'': lambda ctx, name: next((x for x in ctx.domain.aggregates
          if str(x.name) == name), None), ''entity'': lambda ctx, name: next((x for
          x in ctx.domain.entities if str(x.name) == name), None), ''value_object'':
          lambda ctx, name: next((x for x in ctx.domain.value_objects if str(x.name)
          == name), None), ''valueobject'': lambda ctx, name: next((x for x in ctx.domain.value_objects
          if str(x.name) == name), None), ''service'': lambda ctx, name: next((x for
          x in ctx.domain.services if str(x.name) == name), None), ''enum'': lambda
          ctx, name: next((x for x in ctx.domain.enums if str(x.name) == name), None),
          ''use_case'': lambda ctx, name: next((x for x in ctx.application.use_cases
          if str(x.name) == name), None), ''usecase'': lambda ctx, name: next((x for
          x in ctx.application.use_cases if str(x.name) == name), None), ''implementation'':
          lambda ctx, name: next((x for x in ctx.infrastructure.implementations if
          str(x.name) == name), None)}'
      operations:
      - name: _find_port_strategy
        inputs:
        - type: BoundedContext
          name: context
        - type: string
          name: name
        output:
          type: any
      - name: find_parent_component
        inputs:
        - type: BoundedContext
          name: context
        - type: string
          name: name
        - type: string
          name: type_hint
        output:
          type: any
    - name: BlueprintPathOperations
      description: 'Provides get/set/remove operations on Blueprint using path expressions.


        Uses Pydantic''s model_copy for immutable updates.'
      dependencies:
      - type: BlueprintPathResolver
        name: resolver
      operations:
      - name: get_value
        inputs:
        - type: any
          name: obj
        - type: string
          name: path
        output:
          type: any
      - name: set_value
        inputs:
        - type: any
          name: obj
        - type: string
          name: path
        - type: any
          name: value
        - type: boolean
          name: append
          default: 'False'
        output:
          type: any
      - name: remove_value
        inputs:
        - type: any
          name: obj
        - type: string
          name: path
        output:
          type: any
      - name: _set_recursive
        inputs:
        - type: any
          name: obj
        - type: PathSegment
          container: list
          name: segments
        - type: any
          name: value
        - type: boolean
          name: append
        output:
          type: any
      - name: _remove_recursive
        inputs:
        - type: any
          name: obj
        - type: PathSegment
          container: list
          name: segments
        output:
          type: any
      - name: _get_segment_value
        inputs:
        - type: any
          name: obj
        - type: PathSegment
          name: segment
        output:
          type: any
      - name: _access_by_name
        inputs:
        - type: any
          name: obj
        - type: string
          name: name
        output:
          type: any
      - name: _get_item_name
        inputs:
        - type: any
          name: item
        output:
          type: string
          optional: true
      - name: _find_item_index
        inputs:
        - type: list
          name: items
        - type: string
          name: name
        output:
          type: integer
      - name: _set_final_value
        inputs:
        - type: any
          name: obj
        - type: PathSegment
          name: segment
        - type: any
          name: value
        - type: boolean
          name: append
        output:
          type: any
      - name: _remove_final_value
        inputs:
        - type: any
          name: obj
        - type: PathSegment
          name: segment
        output:
          type: any
      - name: _update_segment
        inputs:
        - type: any
          name: obj
        - type: PathSegment
          name: segment
        - type: any
          name: new_value
        output:
          type: any
      - name: _update_field
        inputs:
        - type: any
          name: obj
        - type: string
          name: field_name
        - type: any
          name: new_value
        output:
          type: any
      - name: parse_value
        inputs:
        - type: string
          name: value_str
        output:
          type: any
    - name: PathSegment
      description: Represents a single segment in a path expression.
      dependencies:
      - type: string
        name: name
      - type: integer
        optional: true
        name: index
        default: None
      operations:
      - name: is_index_access
        output:
          type: boolean
    ports:
    - name: BlueprintStorage
      description: Loads the blueprint from a file.
      kind: adapter
      operations:
      - name: load
        output:
          type: Blueprint
          optional: true
      - name: save
        inputs:
        - type: Blueprint
          name: blueprint
        output:
          type: None
  application:
    use_cases:
    - name: SetValue
      kind: command
      dependencies:
      - type: BlueprintStorage
        name: storage
      - type: BlueprintPathOperations
        name: operations
      command:
        attributes:
        - type: string
          name: path
        - type: any
          name: value
        - type: boolean
          name: append
          default: 'False'
    - name: RemoveValue
      kind: command
      dependencies:
      - type: BlueprintStorage
        name: storage
      - type: BlueprintPathOperations
        name: operations
      command:
        attributes:
        - type: string
          name: path
    - name: GetValue
      kind: command
      dependencies:
      - type: BlueprintStorage
        name: storage
      - type: BlueprintPathOperations
        name: operations
      command:
        attributes:
        - type: string
          name: path
    - name: LoadBlueprint
      kind: command
      dependencies:
      - type: BlueprintStorage
        name: blueprint_loader
      command:
        attributes:
        - type: string
          optional: true
          name: node
          default: None
      result:
        attributes:
        - type: Blueprint
          name: blueprint
  infrastructure:
    implementations:
    - name: YamlBlueprintStorage
      implements: BlueprintStorage
      technology: yaml
      description: Blueprint loader that reads from a YAML file.
