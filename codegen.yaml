    - name: GeneratePackage
      kind: command
      dependencies:
      - type: FileSystemPort
        name: file_system_port
      - type: PythonSyntaxTranslator
        name: translator
      - type: CodeFormatter
        name: code_formatter
      command:
        attributes:
        - type: PackageSpec
          name: package_spec
        - type: boolean
          name: overwrite
        - type: string
          container: list
          optional: true
          name: nodes
        - type: string
          name: root_path
          default: ''
      result:
        attributes:
        - type: BuildResult
          name: result
  infrastructure:
    implementations:
    - name: AstTranslator
      implements: SourceCodePort
      technology: ast
      description: AST-based implementation of SourceCodePort.
    - name: BlackCodeFormatter
