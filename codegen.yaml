    services:
    - name: BlueprintPathResolver
      description: "Parses path expressions and resolves them against Blueprint/Pydantic\
        \ models.\n\nPath syntax:\n- Dot notation: \"contexts.sales\" \n- Index notation:\
        \ \"contexts[0]\"\n- Mixed: \"contexts[0].aggregates.Order\"\n- Field access\
        \ by name in list: \"contexts.DomainDefinition\" (finds by 'name' field)"
      dependencies:
      - type: Any
        name: _SEGMENT_PATTERN
      operations:
      - name: parse
        inputs:
        - type: Self
          name: self
        - type: string
          name: path
        output:
          type: PathSegment
          container: list
      - name: resolve
        inputs:
        - type: Self
          name: self
        - type: any
          name: obj
        - type: string
          name: path
        output:
          type: any
      - name: _resolve_segments
        inputs:
        - type: Self
          name: self
        - type: any
          name: obj
        - type: PathSegment
          container: list
          name: segments
        output:
          type: any
      - name: _get_segment_value
        inputs:
        - type: Self
          name: self
        - type: any
          name: obj
        - type: PathSegment
          name: segment
        output:
          type: any
      - name: _access_by_name
        inputs:
        - type: Self
          name: self
        - type: any
          name: obj
        - type: string
          name: name
        output:
          type: any
      - name: _get_item_name
        inputs:
        - type: Self
          name: self
        - type: any
          name: item
        output:
          type: string
          optional: true
    - name: ComponentLocator
      description: Responsible for finding any component within a BoundedContext.
      dependencies:
      - type: Any
        name: _FIND_HANDLERS
        default: '{''aggregate'': lambda ctx, name: next((x for x in ctx.domain.aggregates
          if str(x.name) == name), None), ''entity'': lambda ctx, name: next((x for
          x in ctx.domain.entities if str(x.name) == name), None), ''value_object'':
          lambda ctx, name: next((x for x in ctx.domain.value_objects if str(x.name)
          == name), None), ''valueobject'': lambda ctx, name: next((x for x in ctx.domain.value_objects
          if str(x.name) == name), None), ''service'': lambda ctx, name: next((x for
          x in ctx.domain.services if str(x.name) == name), None), ''enum'': lambda
          ctx, name: next((x for x in ctx.domain.enums if str(x.name) == name), None),
          ''use_case'': lambda ctx, name: next((x for x in ctx.application.use_cases
          if str(x.name) == name), None), ''usecase'': lambda ctx, name: next((x for
          x in ctx.application.use_cases if str(x.name) == name), None), ''implementation'':
          lambda ctx, name: next((x for x in ctx.infrastructure.implementations if
          str(x.name) == name), None)}'
      operations:
      - name: _find_port_strategy
        inputs:
        - type: Self
          name: self
        - type: BoundedContext
          name: context
        - type: string
          name: name
        output:
          type: any
      - name: find_parent_component
        inputs:
        - type: Self
          name: self
        - type: BoundedContext
          name: context
        - type: string
          name: name
        - type: string
          name: type_hint
        output:
          type: any
    - name: BlueprintPathOperations
      description: 'Provides get/set/remove operations on Blueprint using path expressions.


        Uses Pydantic''s model_copy for immutable updates.'
      dependencies:
      - type: BlueprintPathResolver
        name: resolver
      operations:
      - name: get_value
        inputs:
        - type: Self
          name: self
        - type: any
          name: obj
        - type: string
          name: path
        output:
          type: any
      - name: set_value
        inputs:
        - type: Self
          name: self
        - type: any
          name: obj
        - type: string
          name: path
        - type: any
          name: value
        - type: boolean
          name: append
          default: false
        output:
          type: any
      - name: remove_value
        inputs:
        - type: Self
          name: self
        - type: any
          name: obj
        - type: string
          name: path
        output:
          type: any
      - name: _set_recursive
        inputs:
        - type: Self
          name: self
        - type: any
          name: obj
        - type: PathSegment
          container: list
          name: segments
        - type: any
          name: value
        - type: boolean
          name: append
        output:
          type: any
      - name: _remove_recursive
        inputs:
        - type: Self
          name: self
        - type: any
          name: obj
        - type: PathSegment
          container: list
          name: segments
        output:
          type: any
      - name: _get_segment_value
        inputs:
        - type: Self
          name: self
        - type: any
          name: obj
        - type: PathSegment
          name: segment
        output:
          type: any
      - name: _access_by_name
        inputs:
        - type: Self
          name: self
        - type: any
          name: obj
        - type: string
          name: name
        output:
          type: any
      - name: _get_item_name
        inputs:
        - type: Self
          name: self
        - type: any
          name: item
        output:
          type: string
          optional: true
      - name: _find_item_index
        inputs:
        - type: Self
          name: self
        - type: list
          name: items
        - type: string
          name: name
        output:
          type: integer
      - name: _set_final_value
        inputs:
        - type: Self
          name: self
        - type: any
          name: obj
        - type: PathSegment
          name: segment
        - type: any
          name: value
        - type: boolean
          name: append
        output:
          type: any
      - name: _remove_final_value
        inputs:
        - type: Self
          name: self
        - type: any
          name: obj
        - type: PathSegment
          name: segment
        output:
          type: any
      - name: _update_segment
        inputs:
        - type: Self
          name: self
        - type: any
          name: obj
        - type: PathSegment
          name: segment
        - type: any
          name: new_value
        output:
          type: any
      - name: _update_field
        inputs:
        - type: Self
          name: self
        - type: any
          name: obj
        - type: string
          name: field_name
        - type: any
          name: new_value
        output:
          type: any
      - name: parse_value
        inputs:
        - type: Self
          name: self
        - type: string
          name: value_str
        output:
          type: any
    - name: PathSegment
      description: Represents a single segment in a path expression.
      dependencies:
      - type: string
        name: name
      - type: integer
        optional: true
        name: index
      operations:
      - name: is_index_access
        inputs:
        - type: Self
          name: self
        output:
          type: boolean
    ports:
    - name: BlueprintStorage
      description: Loads the blueprint from a file.
      kind: adapter
      operations:
      - name: load
        inputs:
        - type: Self
          name: self
        output:
          type: Blueprint
          optional: true
      - name: save
        inputs:
        - type: Self
          name: self
        - type: Blueprint
          name: blueprint
        output:
          type: None
  application:
    use_cases:
    - name: InitProject
      kind: command
      dependencies:
      - type: BlueprintStorage
        name: storage
      command:
        attributes:
        - type: string
          optional: true
          name: project_name
        - type: string
          optional: true
          name: project_description
      result:
        attributes:
        - type: Blueprint
          name: blueprint
    - name: RemoveContext
      kind: command
      dependencies:
      - type: BlueprintStorage
        name: storage
      command:
        attributes:
        - type: string
          name: name
      result:
        attributes:
        - type: Blueprint
          name: blueprint
    - name: SetValue
      kind: command
      dependencies:
      - type: BlueprintStorage
        name: storage
      - type: BlueprintPathOperations
        name: operations
      command:
        attributes:
        - type: string
          name: path
        - type: any
          name: value
        - type: boolean
          name: append
          default: false
    - name: UpsertContext
      kind: command
      dependencies:
      - type: BlueprintStorage
        name: storage
      command:
        attributes:
        - type: string
          name: name
        - type: string
          name: description
      result:
        attributes:
        - type: Blueprint
          name: blueprint
    - name: RemoveValue
      kind: command
      dependencies:
      - type: BlueprintStorage
        name: storage
