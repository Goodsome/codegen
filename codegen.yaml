# yaml-language-server: $schema=./codegen.schema.json
name: Codegen
description: ''
contexts:
- name: DomainDefinition
  domain:
    enums:
    - name: PortType
      members:
      - name: ADAPTER
        value: adapter
      - name: REPOSITORY
        value: repository
      - name: CLIENT
        value: client
      - name: PROVIDER
        value: provider
    - name: MappingDirection
      members:
      - name: ONE_WAY
        value: one_way
      - name: TWO_WAY
        value: two_way
    - name: UseCaseKind
      members:
      - name: COMMAND
        value: command
      - name: QUERY
        value: query
    value_objects:
    - name: AggregateSpec
      description: Specification of a domain aggregate to be generated.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: str
        optional: true
      - name: attributes
        type: list[AttributeSpec]
        optional: true
      - name: behaviors
        type: list[MethodSpec]
        optional: true
    - name: ApplicationSpec
      description: Specification of an application to be generated.
      attributes:
      - name: use_cases
        type: list[UseCaseSpec]
        optional: true
      - name: ports
        type: list[PortSpec]
        optional: true
    - name: AttributeSpec
      description: Standard specification for a class attribute.
      attributes:
      - name: name
        type: SnakeString
      - name: description
        type: str
        optional: true
      - name: type
        type: str
      - name: container
        type: ContainerType
        optional: true
      - name: optional
        type: bool
        optional: true
      - name: default
        type: str | None
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: cls
          type: Any
        - name: name
          type: str
        - name: type
          type: str
        - name: optional
          type: bool
        output:
          type: Any
    - name: Blueprint
      description: Root of the generation model. Represents the entire project definition.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: str
      - name: layout
        type: str
        optional: true
      - name: contexts
        type: list[BoundedContext]
        optional: true
      - name: bootstrap
        type: BootstrapSpec
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: cls
          type: Any
        - name: name
          type: Union[str, PascalString]
        - name: description
          type: str
        - name: layout
          type: str
        - name: contexts
          type: list[BoundedContext] | None
        - name: bootstrap
          type: BootstrapSpec | None
        output:
          type: Any
    - name: BootstrapSpec
      description: Specification of the bootstrap configuration.
      attributes:
      - name: bindings
        type: list[PortBinding]
        optional: true
    - name: BoundedContext
      description: A logical boundary within the system.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: str
        optional: true
      - name: domain
        type: DomainSpec
        optional: true
      - name: application
        type: ApplicationSpec
        optional: true
      - name: infrastructure
        type: InfrastructureSpec
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: cls
          type: Any
        - name: name
          type: str
        - name: description
          type: str
        - name: domain
          type: DomainSpec | None
        - name: application
          type: ApplicationSpec | None
        - name: infrastructure
          type: InfrastructureSpec | None
        output:
          type: Any
      - name: port_index
        output:
          type: dict[str, PortSpec]
      - name: get_port_spec
        inputs:
        - name: port_name
          type: str
        output:
          type: PortSpec
    - name: DataContractSpec
      description: Generic data contract specification for use case command/query/result.
      attributes:
      - name: name
        type: str
        optional: true
      - name: description
        type: str
        optional: true
      - name: attributes
        type: list[AttributeSpec]
        optional: true
    - name: DomainSpec
      description: Specification of a domain to be generated.
      attributes:
      - name: aggregates
        type: list[AggregateSpec]
        optional: true
      - name: enums
        type: list[EnumSpec]
        optional: true
      - name: value_objects
        type: list[ValueObjectSpec]
        optional: true
      - name: entities
        type: list[EntitySpec]
        optional: true
      - name: services
        type: list[ServiceSpec]
        optional: true
      - name: ports
        type: list[PortSpec]
        optional: true
    - name: EntitySpec
      description: Specification of an entity.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: str
        optional: true
      - name: attributes
        type: list[AttributeSpec]
        optional: true
      - name: behaviors
        type: list[MethodSpec]
        optional: true
    - name: EnumMemberSpec
      description: Specification of an enum member to be generated.
      attributes:
      - name: name
        type: MacroString
      - name: value
        type: str | int | None
        optional: true
      - name: description
        type: str
        optional: true
    - name: EnumSpec
      description: Specification of an enum to be generated.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: str
        optional: true
      - name: members
        type: list[EnumMemberSpec]
    - name: ImplementationSpec
      description: Specification of an implementation to be generated.
      attributes:
      - name: name
        type: PascalString
        optional: true
      - name: implements
        type: PascalString
      - name: technology
        type: SnakeString
      - name: description
        type: str
        optional: true
      - name: attributes
        type: list[AttributeSpec]
        optional: true
      - name: private_methods
        type: list[MethodSpec]
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: cls
          type: Any
        - name: name
          type: str
        - name: implements
          type: str
        - name: technology
          type: str
        - name: description
          type: str
        - name: attributes
          type: list[AttributeSpec] | None
        - name: private_methods
          type: list[MethodSpec] | None
        output:
          type: Any
    - name: InfrastructureSpec
      description: Specification of an infrastructure to be generated.
      attributes:
      - name: implementations
        type: list[ImplementationSpec]
        optional: true
    - name: MapperSpec
      description: Base class for value object mappers.
      attributes:
      - name: source
        type: str
      - name: target
        type: str
      - name: direction
        type: MappingDirection
    - name: MethodOutput
      description: Specification of the output of a method.
      attributes:
      - name: type
        type: str
    - name: MethodSpec
      description: Standard specification for a class method.
      attributes:
      - name: name
        type: SnakeString
      - name: description
        type: str
        optional: true
      - name: inputs
        type: list[AttributeSpec]
        optional: true
      - name: output
        type: MethodOutput
      behaviors:
      - name: create
        inputs:
        - name: cls
          type: Any
        - name: name
          type: str
        - name: inputs
          type: list[AttributeSpec]
        - name: output
          type: MethodOutput
        output:
          type: Any
    - name: PortBinding
      description: Binding between a port and an adapter.
      attributes:
      - name: port
        type: str
      - name: implementation
        type: str
    - name: PortSpec
      description: Specification of a domain port to be generated.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: str
        optional: true
      - name: kind
        type: PortType
      - name: aggregate
        type: PascalString | None
        optional: true
      - name: operations
        type: list[MethodSpec]
        optional: true
      behaviors:
      - name: check_aggregate_if_repository
        output:
          type: PortSpec
      - name: create
        inputs:
        - name: cls
          type: Any
        - name: name
          type: str
        - name: kind
          type: Union[PortType, str]
        - name: description
          type: str
        - name: aggregate
          type: str | None
        - name: operations
          type: list[MethodSpec] | None
        output:
          type: PortSpec
      - name: get_final_operations
        output:
          type: list[MethodSpec]
      - name: get_save_method_spec
        output:
          type: MethodSpec | None
      - name: get_delete_method_spec
        output:
          type: MethodSpec | None
      - name: get_find_by_id_method_spec
        output:
          type: MethodSpec | None
    - name: ServiceSpec
      description: Specification of a domain service to be generated.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: str
        optional: true
      - name: dependencies
        type: list[AttributeSpec]
        optional: true
      - name: operations
        type: list[MethodSpec]
        optional: true
    - name: UseCaseSpec
      description: Specification of a use case to be generated.
      attributes:
      - name: name
        type: PascalString
      - name: kind
        type: UseCaseKind
      - name: dependencies
        type: list[AttributeSpec]
        optional: true
      - name: description
        type: str
        optional: true
      - name: command
        type: DataContractSpec
        optional: true
      - name: query
        type: DataContractSpec
        optional: true
      - name: result
        type: DataContractSpec
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: cls
          type: Any
        - name: name
          type: str
        - name: kind
          type: Union[str, UseCaseKind]
        - name: dependencies
          type: list[AttributeSpec] | None
        - name: description
          type: str
        - name: command
          type: DataContractSpec | None
        - name: query
          type: DataContractSpec | None
        - name: result
          type: DataContractSpec | None
        output:
          type: Any
    - name: ValueObjectSpec
      description: Specification of a value object to be generated.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: str
        optional: true
      - name: attributes
        type: list[AttributeSpec]
        optional: true
      - name: behaviors
        type: list[MethodSpec]
        optional: true
    ports:
    - name: BlueprintStorage
      description: Loads the blueprint from a file.
      kind: adapter
      operations:
      - name: load
        output:
          type: Blueprint | None
      - name: save
        inputs:
        - name: blueprint
          type: Blueprint
        output:
          type: None
  application:
    use_cases:
    - name: LoadBlueprint
      kind: command
      dependencies:
      - name: blueprint_loader
        type: BlueprintStorage
      command:
        attributes:
        - name: node
          type: str | None
          optional: true
      result:
        attributes:
        - name: blueprint
          type: Blueprint
  infrastructure:
    implementations:
    - name: YamlBlueprintStorage
      implements: BlueprintStorage
      technology: yaml
      description: Blueprint loader that reads from a YAML file.
- name: Orchestration
  domain:
    services:
    - name: AggregateMapper
      dependencies:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: aggregate
          type: AggregateSpec
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - name: aggregates
          type: Iterable[AggregateSpec]
        output:
          type: PackageSpec
      - name: to_aggregate
        inputs:
        - name: module
          type: ModuleSpec
        output:
          type: AggregateSpec
      - name: to_aggregates
        inputs:
        - name: package
          type: PackageSpec
        output:
          type: list[AggregateSpec]
    - name: ApplicationMapper
      dependencies:
      - name: use_case_mapper
        type: UseCaseMapper
        optional: true
      - name: port_mapper
        type: PortMapper
        optional: true
      operations:
      - name: to_package_spec
        inputs:
        - name: application
          type: ApplicationSpec
        output:
          type: PackageSpec
      - name: to_application
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: ApplicationSpec
    - name: AttributeMapper
      operations:
      - name: to_parameter_spec
        inputs:
        - name: attribute
          type: AttributeSpec
        - name: default_field_flavor
          type: FieldFlavor | None
        output:
          type: ParameterSpec
      - name: to_attribute
        inputs:
        - name: parameter_spec
          type: ParameterSpec
        output:
          type: AttributeSpec
      - name: to_parameter_specs
        inputs:
        - name: attributes
          type: list[AttributeSpec]
        - name: default_field_flavor
          type: FieldFlavor | None
        output:
          type: list[ParameterSpec]
      - name: to_attributes
        inputs:
        - name: parameter_specs
          type: list[ParameterSpec]
        output:
          type: list[AttributeSpec]
    - name: BlueprintMapper
      dependencies:
      - name: context_mapper
        type: ContextMapper
        optional: true
      operations:
      - name: to_package_spec
        inputs:
        - name: blueprint
          type: Blueprint
        output:
          type: PackageSpec
      - name: to_blueprint
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: Blueprint
    - name: ContextMapper
      dependencies:
      - name: domain_mapper
        type: DomainMapper
        optional: true
      - name: application_mapper
        type: ApplicationMapper
        optional: true
      - name: infrastructure_mapper
        type: InfrastructureMapper
        optional: true
      operations:
      - name: to_package_spec
        inputs:
        - name: context
          type: BoundedContext
        output:
          type: PackageSpec
      - name: to_context
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: BoundedContext
      - name: _collect_class_specs_in_ports
        inputs:
        - name: class_specs
          type: dict[str, ClassSpec]
        - name: package_spec
          type: PackageSpec
        output:
          type: None
    - name: DomainMapper
      dependencies:
      - name: aggregate_mapper
        type: AggregateMapper
        optional: true
      - name: entity_mapper
        type: EntityMapper
        optional: true
      - name: value_object_mapper
        type: ValueObjectMapper
        optional: true
      - name: service_mapper
        type: ServiceMapper
        optional: true
      - name: port_mapper
        type: PortMapper
        optional: true
      - name: enum_mapper
        type: EnumMapper
        optional: true
      operations:
      - name: to_package_spec
        inputs:
        - name: domain
          type: DomainSpec
        output:
          type: PackageSpec
      - name: to_domain
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: DomainSpec
    - name: EntityMapper
      dependencies:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: entity
          type: EntitySpec
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - name: entities
          type: Iterable[EntitySpec]
        output:
          type: PackageSpec
      - name: to_entity
        inputs:
        - name: module
          type: ModuleSpec
        output:
          type: EntitySpec
      - name: to_entities
        inputs:
        - name: package
          type: PackageSpec
        output:
          type: list[EntitySpec]
    - name: EnumMapper
      operations:
      - name: to_python_enum_spec
        inputs:
        - name: meta_enum
          type: EnumSpec
        output:
          type: PythonEnumSpec
      - name: to_enum_spec
        inputs:
        - name: enum_spec
          type: PythonEnumSpec
        output:
          type: EnumSpec
      - name: to_module_spec
        inputs:
        - name: enums
          type: Iterable[EnumSpec]
        output:
          type: ModuleSpec
      - name: to_meta_enums
        inputs:
        - name: module_spec
          type: ModuleSpec
        output:
          type: Iterable[EnumSpec]
    - name: ImplementationMapper
      dependencies:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: implementation
          type: ImplementationSpec
        - name: port
          type: PortSpec
        output:
          type: ModuleSpec
      - name: to_implementation
        inputs:
        - name: module_spec
          type: ModuleSpec
        - name: technology
          type: str
        output:
          type: ImplementationSpec
      - name: _get_class_name
        inputs:
        - name: implementation
          type: ImplementationSpec
        output:
          type: str
    - name: InfrastructureMapper
      dependencies:
      - name: implementation_mapper
        type: ImplementationMapper
        optional: true
      operations:
      - name: to_package_spec
        inputs:
        - name: infrastructure
          type: InfrastructureSpec
        - name: port_finder
          type: Callable[[str], PortSpec]
        output:
          type: PackageSpec
      - name: to_infrastructure
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: InfrastructureSpec
    - name: MethodMapper
      dependencies:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      operations:
      - name: to_function_spec
        inputs:
        - name: method
          type: MethodSpec
        - name: function_type
          type: FunctionType
        - name: is_abstract
          type: bool
        - name: is_private
          type: bool
        output:
          type: FunctionSpec
      - name: to_method
        inputs:
        - name: function_spec
          type: FunctionSpec
        output:
          type: MethodSpec
    - name: PortMapper
      dependencies:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: port
          type: PortSpec
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - name: ports
          type: Iterable[PortSpec]
        output:
          type: PackageSpec
      - name: to_port
        inputs:
        - name: module_spec
          type: ModuleSpec
        output:
          type: PortSpec
      - name: to_ports
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: list[PortSpec]
    - name: ServiceMapper
      dependencies:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: service
          type: ServiceSpec
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - name: services
          type: Iterable[ServiceSpec]
        output:
          type: PackageSpec
      - name: to_service
        inputs:
        - name: module_spec
          type: ModuleSpec
        output:
          type: ServiceSpec
      - name: to_services
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: list[ServiceSpec]
    - name: UseCaseMapper
      dependencies:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: use_case
          type: UseCaseSpec
        output:
          type: ModuleSpec
      - name: to_use_case
        inputs:
        - name: module_spec
          type: ModuleSpec
        output:
          type: UseCaseSpec
    - name: ValueObjectMapper
      dependencies:
      - name: attribute_mapper
        type: AttributeMapper
        optional: true
      - name: method_mapper
        type: MethodMapper
        optional: true
      operations:
      - name: to_module_spec
        inputs:
        - name: value_object
          type: ValueObjectSpec
        output:
          type: ModuleSpec
      - name: to_package_spec
        inputs:
        - name: value_objects
          type: Iterable[ValueObjectSpec]
        output:
          type: PackageSpec
      - name: module_spec_to_value_objects
        inputs:
        - name: module_spec
          type: ModuleSpec
        output:
          type: list[ValueObjectSpec]
      - name: to_value_objects
        inputs:
        - name: package_spec
          type: PackageSpec
        output:
          type: list[ValueObjectSpec]
  application:
    use_cases:
    - name: GenerateBlueprint
      kind: command
      dependencies:
      - name: parser
        type: ParsePackage
      - name: storage
        type: BlueprintStorage
      - name: mapper
        type: BlueprintMapper
        optional: true
      command:
        attributes:
        - name: path
          type: Path
      result:
        attributes:
        - name: result
          type: str
    - name: GenerateProject
      kind: command
      dependencies:
      - name: loader
        type: LoadBlueprint
      - name: generator
        type: GeneratePackage
      - name: mapper
        type: BlueprintMapper
        optional: true
      command:
        attributes:
        - name: overwrite
          type: bool
        - name: node
          type: str | None
      result:
        attributes:
        - name: result
          type: str
- name: PythonGen
  domain:
    enums:
    - name: AssignmentFlavor
      members:
      - name: NONE
        value: none
      - name: LITERAL
        value: literal
      - name: PYDANTIC_FIELD
        value: pydantic_field
      - name: DATACLASS_FIELD
        value: dataclass_field
    - name: FunctionType
      members:
      - name: CLASS_METHOD
        value: class_method
      - name: STATIC_METHOD
        value: static_method
      - name: INSTANCE_METHOD
        value: instance_method
      - name: FUNCTION
        value: function
    - name: FieldFlavor
      members:
      - name: PYDANTIC
        value: pydantic
      - name: DATACLASS
        value: dataclass
    value_objects:
    - name: AssignmentSpec
      description: 描述变量的赋值结构 (RHS)。 对应 AST 中的 value 节点。
      attributes:
      - name: flavor
        type: AssignmentFlavor
      - name: content
        type: str
        optional: true
      - name: is_factory
        type: bool
    - name: ClassSpec
      description: Represents a class in a Python module.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: str
        optional: true
      - name: decorators
        type: list[str]
        optional: true
      - name: inheritance
        type: list[str]
        optional: true
      - name: attributes
        type: list[ParameterSpec]
        optional: true
      - name: methods
        type: list[FunctionSpec]
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: cls
          type: Any
        - name: name
          type: str
        - name: description
          type: str
        - name: decorators
          type: list[str] | None
        - name: inheritance
          type: list[str] | None
        - name: attributes
          type: list[ParameterSpec] | None
        - name: methods
          type: list[FunctionSpec] | None
        output:
          type: ClassSpec
      - name: create_value_object
        inputs:
        - name: cls
          type: Any
        output:
          type: ClassSpec
      - name: create_aggregate
        inputs:
        - name: cls
          type: Any
        output:
          type: ClassSpec
      - name: create_entity
        inputs:
        - name: cls
          type: Any
        output:
          type: ClassSpec
      - name: parse_ast
        inputs:
        - name: cls
          type: Any
        - name: node
          type: ast.ClassDef
        - name: source_code
          type: str
        output:
          type: Any
      - name: get_required_types
        output:
          type: set[str]
      - name: merge
        inputs:
        - name: other
          type: ClassSpec
        output:
          type: ClassSpec
    - name: FieldSpec
      attributes:
      - name: default
        type: str
        optional: true
      - name: default_factory
        type: str
        optional: true
      - name: flavor
        type: FieldFlavor
        optional: true
      behaviors:
      - name: create_from_annotation
        inputs:
        - name: cls
          type: Any
        - name: annotation
          type: TypeAnnotationSpec
        - name: flavor
          type: FieldFlavor
        output:
          type: FieldSpec
      - name: func_name
        output:
          type: Any
      - name: render
        output:
          type: str
    - name: FunctionSpec
      description: Represents a function in a Python module.
      attributes:
      - name: name
        type: SnakeString
      - name: decorators
        type: list[str]
        optional: true
      - name: parameters
        type: list[ParameterSpec]
        optional: true
      - name: return_annotation
        type: TypeAnnotationSpec
      - name: suite
        type: str
        optional: true
      - name: function_type
        type: FunctionType
        optional: true
      - name: is_private
        type: bool
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: cls
          type: Any
        - name: name
          type: str
        - name: return_annotation
          type: TypeAnnotationSpec
        - name: decorators
          type: list[str] | None
        - name: parameters
          type: list[ParameterSpec] | None
        - name: suite
          type: str
        - name: function_type
          type: FunctionType
        - name: is_private
          type: bool
        output:
          type: Any
      - name: parse_ast
        inputs:
        - name: cls
          type: Any
        - name: node
          type: Union[ast.FunctionDef, ast.AsyncFunctionDef]
        - name: source_code
          type: str
        output:
          type: Any
      - name: get_required_types
        output:
          type: set[str]
      - name: is_instance_method
        output:
          type: bool
      - name: merge
        inputs:
        - name: other
          type: FunctionSpec
        output:
          type: FunctionSpec
      - name: is_init_method
        output:
          type: bool
    - name: ImportedName
      description: Represents a name imported from another module.
      attributes:
      - name: name
        type: str
      - name: alias
        type: str | None
        optional: true
      behaviors:
      - name: render
        output:
          type: str
    - name: ImportFromSpec
      description: Represents an import statement from another module.
      attributes:
      - name: module
        type: str
      - name: names
        type: list[ImportedName]
      behaviors:
      - name: create
        inputs:
        - name: cls
          type: Any
        - name: module
          type: str
        - name: names
          type: Union[list[str], list[ast.alias]]
        output:
          type: ImportFromSpec
      - name: parse_ast
        inputs:
        - name: cls
          type: Any
        - name: node
          type: Union[ast.Import, ast.ImportFrom]
        output:
          type: Any
      - name: has_name
        inputs:
        - name: name
          type: str
        output:
          type: bool
      - name: add_name
        inputs:
        - name: name
          type: str
        output:
          type: ImportFromSpec
      - name: render
        output:
          type: str
      - name: render_from_expression
        output:
          type: str
      - name: render_names
        output:
          type: str
      - name: merge
        inputs:
        - name: other
          type: ImportFromSpec
        output:
          type: ImportFromSpec
    - name: ModuleSpec
      description: Represents a Python module.
      attributes:
      - name: name
        type: SnakeString
      - name: functions
        type: list[FunctionSpec]
        optional: true
      - name: classes
        type: list[ClassSpec]
        optional: true
      - name: imports
        type: list[ImportFromSpec]
        optional: true
      - name: enums
        type: list[PythonEnumSpec]
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: cls
          type: Any
        - name: name
          type: str
        - name: functions
          type: list[FunctionSpec] | None
        - name: classes
          type: list[ClassSpec] | None
        - name: imports
          type: list[ImportFromSpec] | None
        - name: enums
          type: list[PythonEnumSpec] | None
        output:
          type: ModuleSpec
      - name: create_shared_models
        inputs:
        - name: cls
          type: Any
        output:
          type: ModuleSpec
      - name: get_init_module
        inputs:
        - name: cls
          type: Any
        output:
          type: ModuleSpec
      - name: parse_code
        inputs:
        - name: cls
          type: Any
        - name: source_code
          type: str
        - name: module_name
          type: str
        output:
          type: ModuleSpec
      - name: filename
        output:
          type: str
      - name: is_init_module
        output:
          type: bool
      - name: is_match_name
        inputs:
        - name: name
          type: str
        output:
          type: bool
      - name: get_required_types
        output:
          type: set[str]
      - name: has_class
        inputs:
        - name: class_name
          type: str
        output:
          type: bool
      - name: has_function
        inputs:
        - name: function_name
          type: str
        output:
          type: bool
      - name: has_class_or_function
        inputs:
        - name: name
          type: str
        output:
          type: bool
      - name: collect_class_spec
        output:
          type: dict[str, ClassSpec]
      - name: merge
        inputs:
        - name: other
          type: ModuleSpec
        output:
          type: ModuleSpec
    - name: PackageSpec
      description: Represents a Python package.
      attributes:
      - name: name
        type: SnakeString
      - name: modules
        type: list[ModuleSpec]
        optional: true
      - name: sub_packages
        type: list[PackageSpec]
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: cls
          type: Any
        - name: name
          type: str
        - name: modules
          type: list[ModuleSpec] | None
        - name: sub_packages
          type: list[PackageSpec] | None
        output:
          type: Any
      - name: is_empty
        output:
          type: bool
      - name: get_global_registry
        inputs:
        - name: root_name
          type: str
        output:
          type: dict[str, str]
      - name: _build_symbol_table
        inputs:
        - name: root_path
          type: str
        - name: table
          type: dict[str, str]
        output:
          type: Any
      - name: collect_class_spec
        output:
          type: dict[str, ClassSpec]
      - name: merge
        inputs:
        - name: other
          type: PackageSpec
        output:
          type: PackageSpec
    - name: ParameterSpec
      description: Represents a parameter in a Python function.
      attributes:
      - name: name
        type: SnakeString
      - name: annotation
        type: TypeAnnotationSpec
      - name: default
        type: FieldSpec | None
        optional: true
      - name: optional
        type: bool
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: cls
          type: Any
        - name: name
          type: str
        - name: annotation
          type: Union[str, TypeAnnotationSpec]
        - name: optional
          type: bool
        - name: default_field_flavor
          type: FieldFlavor | None
        output:
          type: Any
      - name: parse_ast
        inputs:
        - name: cls
          type: Any
        - name: node
          type: Union[ast.AnnAssign, ast.Assign]
        - name: in_pydantic_model
          type: bool
        output:
          type: list[ParameterSpec]
      - name: get_required_types
        output:
          type: set[str]
      - name: render_default
        output:
          type: str
    - name: PythonEnumMemberSpec
      description: Represents an enum member in a Python module.
      attributes:
      - name: name
        type: MacroString
      - name: value
        type: str | int | None
        optional: true
      - name: description
        type: str
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: cls
          type: Any
        - name: name
          type: str
        - name: value
          type: str | int | None
        - name: description
          type: str
        output:
          type: PythonEnumMemberSpec
      - name: parse_ast
        inputs:
        - name: cls
          type: Any
        - name: node
          type: Union[ast.Assign, ast.AnnAssign]
        output:
          type: PythonEnumMemberSpec
      - name: _parse_value
        inputs:
        - name: node
          type: ast.AST
        output:
          type: str | int | None
    - name: PythonEnumSpec
      description: Represents an enum in a Python module.
      attributes:
      - name: name
        type: PascalString
      - name: description
        type: str
        optional: true
      - name: decorators
        type: list[str]
        optional: true
      - name: base_class
        type: str
        optional: true
      - name: members
        type: list[PythonEnumMemberSpec]
        optional: true
      behaviors:
      - name: create
        inputs:
        - name: cls
          type: Any
        - name: name
          type: str
        - name: description
          type: str
        - name: decorators
          type: list[str] | None
        - name: base_class
          type: str
        - name: members
          type: list[PythonEnumMemberSpec] | None
        output:
          type: PythonEnumSpec
      - name: parse_ast
        inputs:
        - name: cls
          type: Any
        - name: node
          type: ast.ClassDef
        output:
          type: PythonEnumSpec
    - name: TypeAnnotationSpec
      description: Represents a type annotation.
      attributes:
      - name: name
        type: str
      - name: args
        type: list[TypeAnnotationSpec]
        optional: true
      behaviors:
      - name: parse
        inputs:
        - name: cls
          type: Any
        - name: annotation
          type: str
        output:
          type: TypeAnnotationSpec
      - name: parse_ast
        inputs:
        - name: cls
          type: Any
        - name: node
          type: ast.AST | None
        output:
          type: TypeAnnotationSpec
      - name: _parse_node
        inputs:
        - name: cls
          type: Any
        - name: node
          type: ast.AST
        output:
          type: TypeAnnotationSpec
      - name: render
        output:
          type: str
      - name: get_all_referenced_names
        output:
          type: set[str]
      - name: is_nullable
        output:
          type: bool
    - name: TypeSpec
      description: 描述变量的类型注解结构 (LHS)。 对应 AST 中的 annotation 节点。
      attributes:
      - name: core_type
        type: str
      - name: container
        type: ContainerType
      - name: nullable
        type: bool
    - name: VariableSpec
      description: '对应 Python 代码中的 name: type_spec = assignment_spec'
      attributes:
      - name: name
        type: SnakeString
      - name: type_spec
        type: TypeSpec
      - name: assignment
        type: AssignmentSpec
      behaviors:
      - name: create
        inputs:
        - name: cls
          type: Any
        - name: name
          type: str
        - name: type_spec
          type: TypeSpec
        - name: assignment
          type: AssignmentSpec
        output:
          type: VariableSpec
      - name: from_ast
        inputs:
        - name: cls
          type: Any
        - name: node
          type: ast.AnnAssign
        output:
          type: VariableSpec
      - name: to_ast
        output:
          type: ast.AnnAssign
    services:
    - name: DependencyResolver
      dependencies:
      - name: global_registry
        type: dict[str, str]
      operations:
      - name: build_from_package_spec
        inputs:
        - name: cls
          type: Any
        - name: package_spec
          type: PackageSpec
        output:
          type: DependencyResolver
      - name: resolve_module
        inputs:
        - name: module_spec
          type: ModuleSpec
        output:
          type: Iterable[ImportFromSpec]
    - name: PythonSyntaxTranslator
      description: Bidirectional translator between Python source code and PackageSpec.
      dependencies:
      - name: template_port
        type: TemplatePort
      - name: file_system_port
        type: FileSystemPort
      operations:
      - name: to_package_spec
        inputs:
        - name: package_path
          type: Path
        output:
          type: PackageSpec
      - name: to_code
        inputs:
        - name: module_spec
          type: ModuleSpec
        - name: imports
          type: Iterable[ImportFromSpec]
        output:
          type: str
      - name: generate_source_tree
        inputs:
        - name: package_spec
          type: PackageSpec
        - name: target_node
          type: str | None
        output:
          type: dict[Path, str]
      - name: _collect_files_recursively
        inputs:
        - name: current_spec
          type: PackageSpec
        - name: resolver
          type: DependencyResolver
        - name: output_dict
          type: dict[Path, str]
        - name: current_path
          type: Path
        - name: target_node
          type: str | None
        output:
          type: None
    ports:
    - name: CodeFormatter
      description: Formats Python source code.
      kind: adapter
      operations:
      - name: format_code
        inputs:
        - name: code
          type: str
        output:
          type: str
  application:
    use_cases:
    - name: GeneratePackage
      kind: command
      dependencies:
      - name: file_system_port
        type: FileSystemPort
      - name: translator
        type: PythonSyntaxTranslator
      - name: code_formatter
        type: CodeFormatter
      command:
        attributes:
        - name: package_spec
          type: PackageSpec
        - name: overwrite
          type: bool
        - name: node
          type: str | None
          optional: true
      result:
        attributes:
        - name: result
          type: str
    - name: GenerateSchemaJson
      kind: command
      dependencies:
      - name: file_system_port
        type: FileSystemPort
    - name: ParsePackage
      kind: query
      dependencies:
      - name: translator
        type: PythonSyntaxTranslator
      query:
        attributes:
        - name: package_path
          type: Path
      result:
        attributes:
        - name: package_spec
          type: PackageSpec
  infrastructure:
    implementations:
    - name: BlackCodeFormatter
      implements: CodeFormatter
      technology: black
- name: Shared
  domain:
    enums:
    - name: ContainerType
      members:
      - name: NONE
        value: none
      - name: LIST
        value: list
      - name: SET
        value: set
      - name: MAP
        value: map
    - name: PrimitiveType
      description: 通用原语类型，不依赖具体语言。
      members:
      - name: STRING
        value: string
      - name: INTEGER
        value: integer
      - name: FLOAT
        value: float
      - name: BOOLEAN
        value: boolean
      - name: DATETIME
        value: datetime
      - name: UUID
        value: uuid
      - name: ANY
        value: any
    value_objects:
    - name: MacroString
      behaviors:
      - name: __new__
        inputs:
        - name: cls
          type: Any
        - name: value
          type: str
        output:
          type: Any
    - name: NamingString
      description: 基于 case-converter 的增强型字符串
      behaviors:
      - name: to_pascal
        output:
          type: str
      - name: to_snake
        output:
          type: str
      - name: to_kebab
        output:
          type: str
      - name: to_camel
        output:
          type: str
      - name: to_macro
        output:
          type: str
      - name: __get_pydantic_core_schema__
        inputs:
        - name: cls
          type: Any
        - name: source_type
          type: Any
        - name: handler
          type: GetCoreSchemaHandler
        output:
          type: core_schema.CoreSchema
    - name: PascalString
      behaviors:
      - name: __new__
        inputs:
        - name: cls
          type: Any
        - name: value
          type: str
        output:
          type: Any
    - name: SnakeString
      behaviors:
      - name: __new__
        inputs:
        - name: cls
          type: Any
        - name: value
          type: str
        output:
          type: Any
    ports:
    - name: FileSystemPort
      description: Port for interacting with the file system.
      kind: adapter
      operations:
      - name: read_file
        inputs:
        - name: path
          type: Path
        output:
          type: str
      - name: write_file
        inputs:
        - name: path
          type: Path
        - name: content
          type: str
        - name: overwrite
          type: bool
        output:
          type: None
      - name: list_directory_recursively
        inputs:
        - name: path
          type: Path
        output:
          type: Iterator[Path]
      - name: list_directory_flat
        inputs:
        - name: path
          type: Path
        output:
          type: Iterator[Path]
      - name: is_directory
        inputs:
        - name: path
          type: Path
        output:
          type: bool
      - name: is_file
        inputs:
        - name: path
          type: Path
        output:
          type: bool
      - name: exists
        inputs:
        - name: path
          type: Path
        output:
          type: bool
    - name: TemplatePort
      description: Port for generating templates.
      kind: adapter
      operations:
      - name: render
        inputs:
        - name: template_path
          type: str
        - name: context
          type: dict[str, Any]
        output:
          type: str
  infrastructure:
    implementations:
    - name: JinjaAdapter
      implements: TemplatePort
      technology: jinja
      description: Jinja-based template rendering adapter.
    - name: OsFileSystem
      implements: FileSystemPort
      technology: os
      description: OS file system adapter for reading/writing files.
