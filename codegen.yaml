# yaml-language-server: $schema=./codegen.schema.json
contexts:
- domain:
    enums:
    - members:
      - name: NONE
        value: none
      - name: LIST
        value: list
      - name: SET
        value: set
      - name: MAP
        value: map
      - name: ITERABLE
        value: iterable
      - name: CALLABLE
        value: callable
      - name: TYPE
        value: type
      - name: CLASS_VAR
        value: class_var
      name: ContainerType
    - description: 通用原语类型，不依赖具体语言。
      members:
      - name: STRING
        value: string
      - name: INTEGER
        value: integer
      - name: FLOAT
        value: float
      - name: BOOLEAN
        value: boolean
      - name: DATETIME
        value: datetime
      - name: UUID
        value: uuid
      - name: ANY
        value: any
      name: PrimitiveType
    ports:
    - description: Port for interacting with the file system.
      kind: adapter
      name: FileSystemPort
      operations:
      - inputs:
        - name: self
          type: Self
        - name: path
          type: Path
        name: read_file
        output:
          type: string
      - description: 'Writes content to file.

          Returns True if written, False if skipped (due to overwrite=False).'
        inputs:
        - name: self
          type: Self
        - name: path
          type: Path
        - name: content
          type: string
        - default: false
          name: overwrite
          type: boolean
        name: write_file
        output:
          type: boolean
      - inputs:
        - name: self
          type: Self
        - name: path
          type: Path
        name: list_directory_recursively
        output:
          container: iterable
          type: Path
      - inputs:
        - name: self
          type: Self
        - name: path
          type: Path
        name: list_directory_flat
        output:
          container: iterable
          type: Path
      - inputs:
        - name: self
          type: Self
        - name: path
          type: Path
        name: is_directory
        output:
          type: boolean
      - inputs:
        - name: self
          type: Self
        - name: path
          type: Path
        name: is_file
        output:
          type: boolean
      - inputs:
        - name: self
          type: Self
        - name: path
          type: Path
        name: exists
        output:
          type: boolean
    value_objects:
    - base_types:
      - NamingString
      behaviors:
      - inputs:
        - name: cls
          type: any
        - name: value
          type: string
        name: __new__
        output:
          type: any
      description: ''
      name: SnakeString
    - base_types:
      - NamingString
      behaviors:
      - inputs:
        - name: cls
          type: any
        - name: value
          type: string
        name: __new__
        output:
          type: any
      description: ''
      name: PascalString
    - base_types:
      - NamingString
      behaviors:
      - inputs:
        - name: cls
          type: any
        - name: value
          type: string
        name: __new__
        output:
          type: any
      description: ''
      name: KebabString
    - base_types:
      - str
      behaviors:
      - inputs:
        - name: self
          type: Self
        name: to_pascal
        output:
          type: string
      - inputs:
        - name: self
          type: Self
        name: to_snake
        output:
          type: string
      - inputs:
        - name: self
          type: Self
        name: to_kebab
        output:
          type: string
      - inputs:
        - name: self
          type: Self
        name: to_camel
        output:
          type: string
      - inputs:
        - name: self
          type: Self
        name: to_macro
        output:
          type: string
      - inputs:
        - container: type
          name: cls
          type: Self
        - name: source_type
          type: any
        - name: handler
          type: GetCoreSchemaHandler
        name: __get_pydantic_core_schema__
        output:
          type: core_schema.CoreSchema
      description: 基于 case-converter 的增强型字符串
      name: NamingString
    - base_types:
      - NamingString
      behaviors:
      - inputs:
        - name: cls
          type: any
        - name: value
          type: string
        name: __new__
        output:
          type: any
      description: ''
      name: MacroString
  infrastructure:
    implementations:
    - attributes:
      - name: root
        type: Path
      - default: utf-8
        name: encoding
        type: string
      description: OS file system adapter for reading/writing files.
      implements: FileSystemPort
      name: OsFileSystem
      technology: os
  name: Shared
- application:
    use_cases:
    - dependencies:
      - name: loader
        type: LoadBlueprint
      - name: generator
        type: GeneratePackage
      inputs:
      - container: list
        name: nodes
        optional: true
        type: string
      - default: false
        name: generate_tests
        type: boolean
      kind: command
      name: GenerateProject
      outputs:
      - name: result
        type: BuildResult
      - name: tests_result
        type: BuildResult
    - dependencies:
      - name: parser
        type: ParsePackage
      - name: storage
        type: BlueprintStorage
      inputs:
      - name: path
        type: Path
      kind: command
      name: GenerateBlueprint
      outputs:
      - name: result
        type: string
  domain:
    enums:
    - members:
      - name: SUCCESS
        value: SUCCESS
      - name: FAILURE
        value: FAILURE
      - name: WARNING
        value: WARNING
      name: BuildStatus
    - members:
      - name: CREATED
        value: CREATED
      - name: UPDATED
        value: UPDATED
      - name: SKIPPED
        value: SKIPPED
      - name: FAILED
        value: FAILED
      name: FileStatus
    value_objects:
    - attributes:
      - name: model_config
        type: Any
      - name: status
        type: BuildStatus
      - container: list
        default: list
        name: files
        type: FileResult
      - default: BuildStats
        name: stats
        type: BuildStats
      - container: list
        default: list
        name: messages
        type: string
      behaviors:
      - inputs:
        - name: self
          type: Self
        - name: result
          type: FileResult
        name: add_file_result
        output:
          type: any
      description: Top-level result object returned by generation use cases.
      name: BuildResult
    - attributes:
      - name: path
        type: string
      - name: status
        type: FileStatus
      - default: str
        name: message
        type: string
      - default: str
        name: diff
        type: string
      description: Represents the outcome for a single file generation.
      name: FileResult
    - attributes:
      - name: model_config
        type: Any
      - default: 0
        name: total_files
        type: integer
      - default: 0
        name: created_count
        type: integer
      - default: 0
        name: updated_count
        type: integer
      - default: 0
        name: skipped_count
        type: integer
      - default: 0
        name: failed_count
        type: integer
      - default: 0
        name: duration_ms
        type: integer
      behaviors:
      - inputs:
        - name: self
          type: Self
        - name: result
          type: FileResult
        name: add_result
        output:
          type: any
      description: Aggregated statistics for a build operation.
      name: BuildStats
  interfaces:
    cli_commands:
    - name: build
      use_case: GenerateProject
    - name: reverse
      use_case: GenerateBlueprint
  name: Orchestration
- application:
    use_cases:
    - dependencies:
      - name: translator
        type: PythonSyntaxTranslator
      description: Parses Python package to PackageSpec.
      inputs:
      - name: package_path
        type: Path
      kind: query
      name: ParsePackage
      outputs:
      - name: package_spec
        type: PackageSpec
    - dependencies:
      - name: file_system_port
        type: FileSystemPort
      kind: command
      name: GenerateSchemaJson
    - dependencies:
      - name: file_system_port
        type: FileSystemPort
      - name: translator
        type: PythonSyntaxTranslator
      - name: code_formatter
        type: CodeFormatter
      inputs:
      - name: package_spec
        type: PackageSpec
      - default: false
        name: overwrite
        type: boolean
      - container: list
        name: nodes
        optional: true
        type: string
      kind: command
      name: GeneratePackage
      outputs:
      - name: result
        type: BuildResult
  domain:
    enums:
    - members:
      - name: NONE
        value: none
      - name: LITERAL
        value: literal
      - name: SYMBOL
        value: symbol
      - name: CALL
        value: call
      - name: DICT
        value: dict
      - name: LIST
        value: list
      - name: RAW_CODE
        value: raw_code
      - name: CODE
        value: code
      - name: SUBSCRIPT
        value: subscript
      name: AssignmentFlavor
    - members:
      - name: CLASS_METHOD
        value: class_method
      - name: STATIC_METHOD
        value: static_method
      - name: INSTANCE_METHOD
        value: instance_method
      - name: FUNCTION
        value: function
      name: FunctionType
    - members:
      - name: PYDANTIC
        value: pydantic
      - name: DATACLASS
        value: dataclass
      name: FieldFlavor
    ports:
    - description: Port for bidirectional translation between Spec objects and Python
        source code.
      kind: adapter
      name: SourceCodePort
      operations:
      - inputs:
        - name: self
          type: Self
        - name: module_spec
          type: ModuleSpec
        - container: list
          name: imports
          type: ImportFromSpec
        name: render_module
        output:
          type: string
      - inputs:
        - name: self
          type: Self
        - name: source_code
          type: string
        - name: module_name
          type: string
        name: parse_module
        output:
          type: ModuleSpec
    - description: Formats Python source code.
      kind: adapter
      name: CodeFormatter
      operations:
      - inputs:
        - name: self
          type: Self
        - name: code
          type: string
        name: format_code
        output:
          type: string
    services:
    - dependencies:
      - container: map
        name: global_registry
        type: string
      name: DependencyResolver
      operations:
      - inputs:
        - container: type
          name: cls
          type: Self
        - name: package_spec
          type: PackageSpec
        name: build_from_package_spec
        output:
          type: DependencyResolver
      - inputs:
        - name: self
          type: Self
        - name: module_spec
          type: ModuleSpec
        name: resolve_module
        output:
          container: iterable
          type: ImportFromSpec
    - dependencies:
      - name: source_code_port
        type: SourceCodePort
      - name: file_system_port
        type: FileSystemPort
      description: Bidirectional translator between Python source code and PackageSpec.
      name: PythonSyntaxTranslator
      operations:
      - description: Reconstruct a PackageSpec from a dictionary of file paths and
          their contents.
        inputs:
        - name: self
          type: Self
        - name: package_path
          type: Path
        name: to_package_spec
        output:
          type: PackageSpec
      - inputs:
        - name: self
          type: Self
        - name: module_spec
          type: ModuleSpec
        - container: iterable
          name: imports
          type: ImportFromSpec
        name: to_code
        output:
          type: string
      - description: '核心方法：将 PackageSpec 转换为虚拟文件树。

          返回格式: { Path(''relative/path/to/file.py''): ''source code content'' }'
        inputs:
        - name: self
          type: Self
        - name: package_spec
          type: PackageSpec
        - container: list
          name: target_nodes
          optional: true
          type: string
        name: generate_source_tree
        output:
          custom_type_string: dict[Path, str]
          type: Any
      - inputs:
        - name: self
          type: Self
        - name: current_spec
          type: PackageSpec
        - name: resolver
          type: DependencyResolver
        - custom_type_string: dict[Path, str]
          name: output_dict
          type: Any
        - name: current_path
          type: Path
        - container: list
          name: target_nodes
          optional: true
          type: string
        name: _collect_files_recursively
        output:
          type: None
    value_objects:
    - attributes:
      - name: name
        type: string
      - name: value
        type: string
      - name: type_annotation
        optional: true
        type: string
      - container: list
        default: list
        name: require_types
        type: string
      behaviors:
      - inputs:
        - container: type
          name: cls
          type: Self
        - name: name
          type: string
        - name: value
          type: string
        - name: type_annotation
          optional: true
          type: string
        name: create
        output:
          type: ModuleAssignmentSpec
      - inputs:
        - name: self
          type: Self
        name: get_required_types
        output:
          container: set
          type: string
      description: Represents a top-level assignment in a module.
      name: ModuleAssignmentSpec
    - attributes:
      - name: code
        type: string
      behaviors:
      - inputs:
        - container: type
          name: cls
          type: Self
        - name: code
          type: string
        name: create
        output:
          type: RawCodeSpec
      description: Represents a block of raw source code.
      name: RawCodeSpec
    - attributes:
      - name: name
        type: PascalString
      - default: ''
        name: description
        type: string
      - container: list
        default: list
        name: decorators
        type: string
      - container: list
        default: list
        name: inheritance
        type: string
      - container: list
        default: list
        name: attributes
        type: VariableSpec
      - container: list
        default: list
        name: methods
        type: FunctionSpec
      behaviors:
      - inputs:
        - container: type
          name: cls
          type: Self
        - name: name
          type: string
        - default: ''
          name: description
          type: string
        - container: list
          name: decorators
          optional: true
          type: string
        - container: list
          name: inheritance
          optional: true
          type: string
        - container: list
          name: attributes
          optional: true
          type: VariableSpec
        - container: list
          name: methods
          optional: true
          type: FunctionSpec
        name: create
        output:
          type: ClassSpec
      - inputs:
        - container: type
          name: cls
          type: Self
        name: create_value_object
        output:
          type: ClassSpec
      - inputs:
        - container: type
          name: cls
          type: Self
        name: create_aggregate
        output:
          type: ClassSpec
      - inputs:
        - container: type
          name: cls
          type: Self
        name: create_entity
        output:
          type: ClassSpec
      - inputs:
        - container: type
          name: cls
          type: Self
        name: create_event
        output:
          type: ClassSpec
      - inputs:
        - container: type
          name: cls
          type: Self
        - name: name
          type: string
        name: _create_base_model
        output:
          type: ClassSpec
      - inputs:
        - name: self
          type: Self
        name: get_required_types
        output:
          container: set
          type: string
      - description: 获取指定名称的方法，不存在则 raise error
        inputs:
        - name: self
          type: Self
        - name: method_name
          type: string
        name: get_method
        output:
          type: FunctionSpec
      - inputs:
        - name: self
          type: Self
        - name: other
          type: ClassSpec
        name: merge
        output:
          type: ClassSpec
      description: Represents a class in a Python module.
      name: ClassSpec
    - attributes:
      - name: name
        type: SnakeString
      - container: list
        default: list
        name: decorators
        type: string
      - container: list
        default: list
        name: parameters
        type: VariableSpec
      - name: return_annotation
        type: TypeAnnotationSpec
      - default: ''
        name: suite
        type: string
      - default: FunctionType.FUNCTION
        name: function_type
        type: FunctionType
      - default: false
        name: is_private
        type: boolean
      - name: description
        optional: true
        type: string
      behaviors:
      - inputs:
        - container: type
          name: cls
          type: Self
        - name: name
          type: string
        - name: return_annotation
          type: TypeAnnotationSpec
        - container: list
          name: decorators
          optional: true
          type: string
        - container: list
          name: parameters
          optional: true
          type: VariableSpec
        - default: ''
          name: suite
          type: string
        - default: FunctionType.FUNCTION
          name: function_type
          type: FunctionType
        - default: false
          name: is_private
          type: boolean
        - name: description
          optional: true
          type: string
        name: create
        output:
          type: any
      - inputs:
        - name: self
          type: Self
        name: get_required_types
        output:
          container: set
          type: string
      - inputs:
        - name: self
          type: Self
        name: is_instance_method
        output:
          type: boolean
      - inputs:
        - name: self
          type: Self
        - name: other
          type: FunctionSpec
        name: merge
        output:
          type: FunctionSpec
      - inputs:
        - name: self
          type: Self
        name: is_init_method
        output:
          type: boolean
      description: Represents a function in a Python module.
      name: FunctionSpec
    - attributes:
      - name: name
        type: string
      - container: list
        default: list
        name: args
        type: TypeAnnotationSpec | AssignmentSpec
      behaviors:
      - description: 递归渲染类型字符串
        inputs:
        - name: self
          type: Self
        name: render
        output:
          type: string
      - description: 递归获取所有引用的类型名称
        inputs:
        - name: self
          type: Self
        name: get_all_referenced_names
        output:
          container: set
          type: string
      description: Represents a type annotation.
      name: TypeAnnotationSpec
    - attributes:
      - name: name
        type: string
      description: 引用一个已存在的变量或符号 (对应 AST Name节点)。
      name: ReferenceSpec
    - attributes:
      - name: value
        type: any
      description: 基础类型的字面量值 (对应 AST Constant节点)。
      name: LiteralSpec
    - attributes:
      - name: name
        type: MacroString
      - custom_type_string: str | int | None
        name: value
        type: Any
      - default: str
        name: description
        type: string
      behaviors:
      - inputs:
        - container: type
          name: cls
          type: Self
        - name: name
          type: string
        - custom_type_string: str | int | None
          name: value
          type: Any
        - default: ''
          name: description
          type: string
        name: create
        output:
          type: PythonEnumMemberSpec
      description: Represents an enum member in a Python module.
      name: PythonEnumMemberSpec
    - attributes:
      - name: flavor
        type: AssignmentFlavor
      - name: literal
        optional: true
        type: LiteralSpec
      - name: reference
        optional: true
        type: ReferenceSpec
      - name: call
        optional: true
        type: CallSpec
      - container: list
        name: list_items
        optional: true
        type: AssignmentSpec
      - container: map
        name: dict_items
        optional: true
        type: AssignmentSpec
      - name: code
        optional: true
        type: string
      - name: subscript
        optional: true
        type: SubscriptSpec
      behaviors:
      - inputs:
        - container: type
          name: cls
          type: Self
        - name: code
          type: string
        name: from_code
        output:
          type: AssignmentSpec
      - inputs:
        - container: type
          name: cls
          type: Self
        - name: value
          type: any
        name: from_literal
        output:
          type: AssignmentSpec
      - inputs:
        - container: type
          name: cls
          type: Self
        - name: symbol
          type: string
        name: from_symbol
        output:
          type: AssignmentSpec
      - inputs:
        - container: type
          name: cls
          type: Self
        - name: func_name
          type: string
        - container: list
          name: args
          optional: true
          type: AssignmentSpec
        - container: map
          name: kwargs
          optional: true
          type: AssignmentSpec
        name: from_call
        output:
          type: AssignmentSpec
      - inputs:
        - container: type
          name: cls
          type: Self
        - name: value
          type: AssignmentSpec
        - name: slice
          type: AssignmentSpec
        name: from_subscript
        output:
          type: AssignmentSpec
      - inputs:
        - name: self
          type: Self
        name: get_required_types
        output:
          container: set
          type: string
      description: 描述变量的赋值结构 (RHS)。 对应 AST 中的 value 节点。
      name: AssignmentSpec
    - attributes:
      - name: value
        type: AssignmentSpec
      - name: slice
        type: AssignmentSpec
      behaviors:
      - description: 收集 subscript.value 和 subscript.slice 中的所有类型标记。
        inputs:
        - name: self
          type: Self
        name: get_required_types
        output:
          container: set
          type: string
      description: 下标访问语法 obj[key]，对应 AST Subscript 节点。
      name: SubscriptSpec
    - attributes:
      - name: callee
        type: string
      - container: list
        name: args
        type: AssignmentSpec
      - container: map
        name: kwargs
        type: AssignmentSpec
      description: 函数调用或类实例化 (对应 AST Call节点)。
      name: CallSpec
    - attributes:
      - name: core_type
        type: string
      - name: container
        type: ContainerType
      - name: nullable
        type: boolean
      description: 描述变量的类型注解结构 (LHS)。 对应 AST 中的 annotation 节点。
      name: TypeSpec
    - attributes:
      - name: name
        type: string
      - name: alias
        optional: true
        type: string
      behaviors:
      - inputs:
        - name: self
          type: Self
        name: render
        output:
          type: string
      description: Represents a name imported from another module.
      name: ImportedName
    - attributes:
      - name: name
        type: SnakeString
      - container: list
        default: list
        name: functions
        type: FunctionSpec
      - container: list
        default: list
        name: classes
        type: ClassSpec
      - container: list
        default: list
        name: imports
        type: ImportFromSpec
      - container: list
        default: list
        name: enums
        type: PythonEnumSpec
      - container: list
        default: list
        name: assignments
        type: ModuleAssignmentSpec
      - container: list
        default: list
        name: extra_code
        type: RawCodeSpec
      behaviors:
      - inputs:
        - container: type
          name: cls
          type: Self
        - name: name
          type: string
        - container: list
          name: functions
          optional: true
          type: FunctionSpec
        - container: list
          name: classes
          optional: true
          type: ClassSpec
        - container: list
          name: imports
          optional: true
          type: ImportFromSpec
        - container: list
          name: enums
          optional: true
          type: PythonEnumSpec
        - container: list
          name: assignments
          optional: true
          type: ModuleAssignmentSpec
        - container: list
          name: extra_code
          optional: true
          type: RawCodeSpec
        name: create
        output:
          type: ModuleSpec
      - inputs:
        - container: type
          name: cls
          type: Self
        name: create_shared_models
        output:
          type: ModuleSpec
      - inputs:
        - container: type
          name: cls
          type: Self
        name: create_shared_events
        output:
          type: ModuleSpec
      - inputs:
        - container: type
          name: cls
          type: Self
        name: get_init_module
        output:
          type: ModuleSpec
      - inputs:
        - name: self
          type: Self
        name: filename
        output:
          type: string
      - inputs:
        - name: self
          type: Self
        name: is_init_module
        output:
          type: boolean
      - inputs:
        - name: self
          type: Self
        - name: name
          type: string
        name: is_match_name
        output:
          type: boolean
      - description: Check if module name matches any of the provided names.
        inputs:
        - name: self
          type: Self
        - container: list
          name: names
          type: string
