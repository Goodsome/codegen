        inputs:
        - type: Self
          container: type
          name: cls
        - type: ModuleSpec
          name: module_spec
        output:
          type: EnumSpec
          container: list
      - name: update
        description: Update scalar metadata fields. Preserves internal structure.
        inputs:
        - type: Self
          name: self
        - type: string
          optional: true
          name: description
        output:
          type: None
      - name: add_member
        description: Add an EnumMemberSpec. Raises ValueError if member with same
          name exists.
        inputs:
        - type: Self
          name: self
        - type: EnumMemberSpec
          name: member
        output:
          type: Self
      - name: update_member
        description: Update an existing EnumMemberSpec by name. Raises ValueError
