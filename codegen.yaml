      base_types:
      - DomainConcept
      attributes:
      - type: Any
        name: __concept_name__
        default: entity
      - type: Any
        name: __pkg_name__
        default: entities
    - name: PortSpec
      description: Specification of a domain port to be generated.
      attributes:
      - type: PascalString
        name: name
      - type: string
        name: description
        default: str
      - type: PortType
        name: kind
      - type: PascalString
        optional: true
        name: aggregate
      - type: MethodSpecList
        name: operations
        default: MethodSpecList
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        - type: Any
          custom_type_string: Union[PortType, str]
          name: kind
        - type: string
          name: description
          default: ''
        - type: string
          optional: true
          name: aggregate
        - type: MethodSpec
          container: list
          optional: true
          name: operations
        output:
          type: Self
      - name: to_module_spec
        description: 将 PortSpec 转换为 ModuleSpec
        inputs:
        - type: Self
          name: self
        output:
          type: ModuleSpec
      - name: to_package_spec
        description: 将多个 PortSpec 转换为一个 'ports' 包
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Self
          container: iterable
          name: ports
        output:
          type: PackageSpec
      - name: from_module_spec
        description: 将 ModuleSpec 逆向解析为 PortSpec
        inputs:
        - type: Self
          container: type
          name: cls
        - type: ModuleSpec
          name: module
        output:
          type: Self
      - name: from_package_spec
        description: 将 'ports' 包逆向解析为 PortSpec 列表
        inputs:
        - type: Self
          container: type
          name: cls
        - type: PackageSpec
          name: package
        output:
          type: Self
          container: list
      - name: update
        description: Update scalar metadata fields. Preserves internal structure.
        inputs:
        - type: Self
          name: self
        - type: string
          optional: true
          name: kind
        - type: string
          optional: true
          name: description
        - type: string
          optional: true
          name: aggregate
        output:
          type: None
      - name: to_test_package_spec
        description: Create test package for port with operations that have rules.
        inputs:
        - type: Self
          name: self
        output:
          type: PackageSpec
    - name: EnumSpec
      description: Specification of an enum to be generated.
      attributes:
      - type: PascalString
        name: name
      - type: string
        name: description
        default: str
      - type: EnumMemberSpec
        container: list
        name: members
      behaviors:
      - name: to_python_enum_spec
        description: 将 EnumSpec 转换为 PythonEnumSpec
        inputs:
        - type: Self
          name: self
        output:
          type: PythonEnumSpec
      - name: from_python_enum_spec
        description: 将 PythonEnumSpec 逆向解析为 EnumSpec
        inputs:
        - type: Self
