name: DomainDefinitionTest
description: "E2E Test for Domain Definition"
layout: standard

contexts:
  - name: Shared
  - name: Sales
    description: "Sales Context"
    domain:
      aggregates:
        - name: Order
          description: "An order aggregate"
          attributes:
            - name: order_id
              type: str
            - name: total_amount
              type: float
          behaviors:
            - name: add_item
              inputs:
                - name: product_id
                  type: str
                - name: quantity
                  type: int
              output:
                type: None

      entities:
        - name: Product
          description: "A product entity"
          attributes:
            - name: product_id
              type: str
            - name: name
              type: str
            - name: price
              type: float

      value_objects:
        - name: Address
          description: "A value object for address"
          attributes:
            - name: street
              type: str
            - name: city
              type: str
            - name: zip_code
              type: str

      enums:
        - name: OrderStatus
          description: "Status of an order"
          members:
            - name: PENDING
              value: "pending"
            - name: SHIPPED
              value: "shipped"
            - name: DELIVERED
              value: "delivered"
